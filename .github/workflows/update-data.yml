name: Import Elevation Tiles

# AW3D30 150m標高タイル(1,578枚・約0.65GB)をリポジトリに取り込むための手動ワークフロー。
#
# 背景: GitHubのWeb UIはブラウザ経由だと1ファイル25MBまでで、180MB級のzipを直接
# 置けない。また1,578ファイルを個別にアップロードするのはスマートフォンでは非現実的。
# そこでzipをRelease(1ファイル2GBまで、リポジトリ容量に計上されない)に添付し、
# Actions側で展開・検証・コミットまで行う。
#
# 使い方:
#   1. Releases から新しいRelease(例: タグ名 elev-tiles-v1)を作成し、
#      elev150min_0.zip 〜 elev150min_3.zip の4ファイルを添付して公開する
#   2. Actions タブ → 本ワークフロー → Run workflow → タグ名を入力して実行
#   3. 完了後、Releaseは削除してよい(ファイルはリポジトリ本体に入るため)

"on":
  workflow_dispatch:
    inputs:
      release_tag:
        description: "標高タイルzipを添付したReleaseのタグ名(例: elev-tiles-v1)"
        type: string
        required: true
      expected_count:
        description: "展開後に期待されるタイル枚数(通常は1578)"
        type: string
        default: "1578"

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    # 0.65GBのコミットとpushに時間がかかるため長めに設定
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Download tile archives from the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/tiles
          gh release download "${{ github.event.inputs.release_tag }}" \
            --repo "${{ github.repository }}" \
            --pattern 'elev150min_*.zip' \
            --dir /tmp/tiles
          echo "--- ダウンロードしたアーカイブ ---"
          ls -la /tmp/tiles

      - name: Unzip into data/elevation_tiles/
        run: |
          # 旧タイル(平均方式)が残っていると混在するため、いったん全削除する
          rm -rf data/elevation_tiles
          mkdir -p data/elevation_tiles
          for z in /tmp/tiles/elev150min_*.zip; do
            echo "展開中: $z"
            unzip -o -q -j "$z" -d data/elevation_tiles
          done
          echo "--- 展開結果 ---"
          echo "タイル数: $(ls data/elevation_tiles/*.tif | wc -l)"
          du -sh data/elevation_tiles

      - name: Verify tile count and naming
        run: |
          COUNT=$(ls data/elevation_tiles/*.tif | wc -l)
          EXPECTED="${{ github.event.inputs.expected_count }}"
          if [ "$COUNT" -ne "$EXPECTED" ]; then
            echo "::error::タイル数が想定と一致しません(期待 ${EXPECTED} 枚 / 実際 ${COUNT} 枚)。"
            echo "::error::Releaseに4つのzipすべてが添付されているか確認してください。"
            exit 1
          fi
          # ファイル名が N034E113.tif 形式になっているか(index.html側の命名規則)
          BAD=$(ls data/elevation_tiles | grep -vcE '^N[0-9]{3}E[0-9]{3}\.tif$' || true)
          if [ "$BAD" -ne 0 ]; then
            echo "::error::命名規則に合わないファイルが ${BAD} 件あります。"
            ls data/elevation_tiles | grep -vE '^N[0-9]{3}E[0-9]{3}\.tif$' | head
            exit 1
          fi
          echo "検証OK: ${COUNT} 枚、命名規則の違反なし"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/elevation_tiles
          if git diff --staged --quiet; then
            echo "変更なし(既に同じ内容が入っています)"
          else
            git commit -m "chore: import AW3D30 150m elevation tiles (min-aggregated) [auto]"
            git pull --rebase origin main
            git push
            echo "コミット・プッシュ完了"
          fi
