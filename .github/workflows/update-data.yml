name: Update Hazard Data

on:
  schedule:
    # 地震: 毎日 UTC 6:00(日本時間 15:00)
    - cron: "0 6 * * *"
    # 台風: 毎週 月・水・金 UTC 7:00(IBTrACS更新〈日火木〉の翌朝を狙う)
    - cron: "0 7 * * 1,3,5"
  workflow_dispatch: {}   # 手動実行ボタンからも動かせるようにする

permissions:
  contents: write

jobs:
  update-earthquakes:
    runs-on: ubuntu-latest
    # 日次cron、または手動実行時は常に実行する
    if: github.event.schedule == '0 6 * * *' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fetch earthquakes
        run: python scripts/fetch_earthquakes.py --days 30 --minmag 3.5 --out data/earthquakes.geojson

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/earthquakes.geojson
          git diff --staged --quiet || git commit -m "chore: update earthquakes.geojson [auto]"
          git push

  update-typhoons:
    runs-on: ubuntu-latest
    # 台風用cron、または手動実行時は常に実行する
    if: github.event.schedule == '0 7 * * 1,3,5' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Fetch typhoons
        run: python scripts/fetch_typhoons.py --years 10 --out data/typhoons.geojson

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/typhoons.geojson
          git diff --staged --quiet || git commit -m "chore: update typhoons.geojson [auto]"
          git push
