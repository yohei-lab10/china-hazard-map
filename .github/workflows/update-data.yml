name: Update Hazard Data

"on":
  schedule:
    # 地震: 毎日 UTC 6:00(日本時間 15:00)
    - cron: "0 6 * * *"
    # 台風: 毎週 月・水・金 UTC 7:00(IBTrACS更新〈日火木〉の翌朝を狙う)
    - cron: "0 7 * * 1,3,5"
  workflow_dispatch:
    inputs:
      run_elevation:
        description: "Run elevation hazard backfill (rarely needed — elevation barely changes)"
        type: boolean
        default: false
      flood_gpkg_url:
        description: "DFO flood GeoPackage (.gpkg) URL (leave empty to skip flood update)"
        type: string
        default: ""
      run_rainfall:
        description: "Run CHIRPS rainfall risk grid update"
        type: boolean
        default: false
      run_aqueduct:
        description: "Run WRI Aqueduct Floods depth fetch (10yr & 100yr return period — powers both the map heatmap and point search)"
        type: boolean
        default: false
      rivers_url:
        description: "HydroRIVERS Asia region download URL (.zip, from hydrosheds.org). Usually blocked by bot protection from GitHub Actions — kept as a fallback attempt only."
        type: string
        default: ""
      run_rivers_kaggle:
        description: "Run rivers update via Kaggle mirror (recommended — bypasses hydrosheds.org's bot blocking). Requires the KAGGLE_API_TOKEN repo secret."
        type: boolean
        default: false
      kaggle_rivers_dataset:
        description: "Kaggle dataset slug for the HydroRIVERS mirror (owner/dataset-name)"
        type: string
        default: "charlesbwhetstone/hydrorivers"
      run_lightning:
        description: "Run WGLC lightning climatology update (downloads ~27MB NetCDF, climate data — rarely needs to change)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  update-earthquakes:
    runs-on: ubuntu-latest
    if: github.event.schedule == '0 6 * * *' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Fetch earthquakes
        run: python scripts/fetch_earthquakes.py --minmag 5.0 --out data/earthquakes.geojson
      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/earthquakes.geojson
          git diff --staged --quiet || git commit -m "chore: update earthquakes.geojson [auto]"
          git pull --rebase origin main
          git push

  update-typhoons:
    runs-on: ubuntu-latest
    if: github.event.schedule == '0 7 * * 1,3,5' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r scripts/requirements.txt
      - name: Fetch typhoons
        run: python scripts/fetch_typhoons.py --years 10 --out data/typhoons.geojson
      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/typhoons.geojson
          git diff --staged --quiet || git commit -m "chore: update typhoons.geojson [auto]"
          git pull --rebase origin main
          git push

  update-elevation:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.run_elevation == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install requests
      - name: Fetch elevation risk grid
        run: python scripts/fetch_elevation.py --grid-deg 1.0 --out data/elevation_risk.geojson
      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/elevation_risk.geojson
          git diff --staged --quiet || git commit -m "chore: update elevation_risk.geojson [auto]"
          git pull --rebase origin main
          git push

  update-floods:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.flood_gpkg_url != ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install geopandas requests
      - name: Fetch floods
        run: python scripts/fetch_floods.py --gpkg-url "${{ github.event.inputs.flood_gpkg_url }}" --out data/floods.geojson
      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/floods.geojson
          git diff --staged --quiet || git commit -m "chore: update floods.geojson [auto]"
          git pull --rebase origin main
          git push

  update-rainfall:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.run_rainfall == 'true'
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install rasterio requests numpy
      - name: Fetch rainfall risk grid
        run: python scripts/fetch_rainfall.py --days 180 --grid-deg 1.0 --out data/rainfall_risk.geojson
      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/rainfall_risk.geojson
          git diff --staged --quiet || git commit -m "chore: update rainfall_risk.geojson [auto]"
          git pull --rebase origin main
          git push

  update-aqueduct:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.run_aqueduct == 'true'
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install rasterio requests numpy
      - name: Fetch Aqueduct Floods depth (COG for point search + gridded GeoJSON for heatmap, 10-year & 100-year)
        run: python scripts/fetch_aqueduct.py --scenario historical --model 000000000WATCH --year 1980 --rp 10 100 --out-dir data
      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/aqueduct_depth_rp10.tif data/aqueduct_depth_rp100.tif data/aqueduct_floods_rp10.geojson data/aqueduct_floods_rp100.geojson
          git diff --staged --quiet || git commit -m "chore: update Aqueduct Floods depth data [auto]"
          git pull --rebase origin main
          git push

  update-rivers-hydrosheds:
    runs-on: ubuntu-latest
    # hydrosheds.orgはGitHub ActionsのIPを含むクラウド環境をボット対策でブロックしていることを確認済み。
    # 成功する可能性は低いが、サイト側の対策状況が変わった場合に備えてフォールバックとして残している。
    # 基本的には update-rivers-kaggle を使うこと。
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.rivers_url != ''
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install geopandas
      - name: Download rivers zip via curl
        run: |
          curl -L --fail \
            -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36" \
            -e "https://www.hydrosheds.org/products/hydrorivers" \
            -o rivers.zip \
            "${{ github.event.inputs.rivers_url }}"
      - name: Fetch rivers
        run: python scripts/fetch_rivers.py --file rivers.zip --min-order 4 --out data/rivers.geojson
      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/rivers.geojson
          git diff --staged --quiet || git commit -m "chore: update rivers.geojson [auto]"
          git pull --rebase origin main
          git push

  update-rivers-kaggle:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.run_rivers_kaggle == 'true'
    timeout-minutes: 30
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install geopandas kaggle
      - name: Download rivers dataset from Kaggle
        run: |
          mkdir -p kaggle_rivers
          kaggle datasets download -d "${{ github.event.inputs.kaggle_rivers_dataset }}" -p kaggle_rivers --unzip
      - name: List downloaded files (debug)
        run: find kaggle_rivers -type f | head -100
      - name: Fetch rivers
        run: python scripts/fetch_rivers.py --shp-dir kaggle_rivers --min-order 4 --out data/rivers.geojson
      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/rivers.geojson
          git diff --staged --quiet || git commit -m "chore: update rivers.geojson via Kaggle [auto]"
          git pull --rebase origin main
          git push

  update-lightning:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.run_lightning == 'true'
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install xarray netCDF4 requests numpy
      - name: Fetch lightning climatology risk grid
        run: python scripts/fetch_lightning.py --out data/lightning.geojson
      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/lightning.geojson
          git diff --staged --quiet || git commit -m "chore: update lightning.geojson [auto]"
          git pull --rebase origin main
          git push
