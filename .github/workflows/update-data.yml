name: Update Hazard Data

"on":
  schedule:
    # 地震: 毎日 UTC 6:00(日本時間 15:00)
    - cron: "0 6 * * *"
    # 台風: 毎週 月・水・金 UTC 7:00(IBTrACS更新〈日火木〉の翌朝を狙う)
    - cron: "0 7 * * 1,3,5"
  workflow_dispatch:
    inputs:
      flood_gpkg_url:
        description: "DFO flood GeoPackage (.gpkg) URL (leave empty to skip flood update)"
        type: string
        default: ""
      run_rainfall:
        description: "Run CHIRPS rainfall risk grid update"
        type: boolean
        default: false
      run_lakes:
        description: "Regenerate data/lakes.geojson from HydroLAKES (downloads ~763MB, one-time — rarely needs to change once generated)"
        type: boolean
        default: false
      hydrolakes_url:
        description: "HydroLAKES shapefile (.zip) URL — check https://www.hydrosheds.org/products/hydrolakes for the current link. Required only when run_lakes is checked."
        type: string
        default: ""
      run_freeze:
        description: "Run freeze hazard (frozen pipe risk) update from NASA POWER — climate data, rarely needs to change once generated"
        type: boolean
        default: false
      run_freeze_calibration:
        description: "TEMPORARY: run calibrate_freeze_thresholds.py to derive absolute FDD tier thresholds from past damage events. Remove this input+job once thresholds are finalized."
        type: boolean
        default: false

permissions:
  contents: write

# ============================================================================
# 【2026年9月削除】update-elevation ジョブと run_elevation 入力を削除した。
#
# 理由: このジョブは data/elevation_risk.geojson(全国ヒートマップ用の1度グリッド、
# 1,592地点)を scripts/fetch_elevation.py で再生成していたが、同スクリプトは
# Open-Elevation(SRTM由来・250m)を参照したままである。一方で現行の
# elevation_risk.geojson は JAXA AW3D30 から別途生成したものに差し替え済み。
# そのため run_elevation にチェックを入れると、AW3D30由来のファイルが
# Open-Elevation の値で静かに上書きされ、そのままコミット・プッシュされていた。
# 説明文が "rarely needed — elevation barely changes" だったため、
# 「押しても安全」と読める点も危険だった。
#
# なお data/elevation_tiles/(150mタイル1,578枚)はこのジョブの対象外であり、
# 影響を受けない。劣化するのは全国ヒートマップの色分けのみ(地点検索は無影響)。
#
# elevation_risk.geojson を再生成する必要が生じた場合は、
# scripts/fetch_elevation.py を AW3D30(data/elevation_tiles/)を読む実装に
# 書き換えてから、ジョブを復活させること。それまでは手動生成したファイルを
# GitHub Web UI から直接差し替える運用とする。
# ============================================================================

# ============================================================================
# 【2026年9月追加】凍結ハザード(水道管凍結・破裂リスク)の気候値レイヤーを追加。
#
# fetch_freeze.py が NASA POWER(認証・APIキー不要)から気温・風速・湿度・雲量を
# 取得し、①累積結氷度日数 ②寒潮頻度(GB/T20484-2017) ④放射冷却頻度 を算出する。
# グリッドは data/elevation_risk.geojson の1度グリッドを再利用するため、
# 中国の陸域境界を本ジョブ側で再定義する必要はない。
#
# ③供暖境界(秦嶺・淮河線)は data/heating_boundary.geojson として別途一度限りで
# 手動生成済みの静的ファイルであり、本ジョブでは更新しない
# (lakes.geojsonが一度生成すればよいのと同じ扱い)。
#
# 実行時間の見積り: 中国陸域の1度グリッド点数(elevation_risk.geojsonの
# 地点数)× NASA POWER APIの応答時間(1点あたり数秒、リトライ・
# インターバル込み)。降雨強度(10年分で約1.6時間)より対象期間が長い
# (デフォルト20年)ため、余裕を持ってtimeoutを180分に設定。
# ============================================================================

jobs:
  update-earthquakes:
    runs-on: ubuntu-latest
    if: github.event.schedule == '0 6 * * *' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Fetch earthquakes
        run: python scripts/fetch_earthquakes.py --minmag 5.0 --out data/earthquakes.geojson
      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/earthquakes.geojson
          git diff --staged --quiet || git commit -m "chore: update earthquakes.geojson [auto]"
          git pull --rebase origin main
          git push

  update-typhoons:
    runs-on: ubuntu-latest
    if: github.event.schedule == '0 7 * * 1,3,5' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r scripts/requirements.txt
      - name: Fetch typhoons
        run: python scripts/fetch_typhoons.py --out data/typhoons.geojson
      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/typhoons.geojson
          git diff --staged --quiet || git commit -m "chore: update typhoons.geojson [auto]"
          git pull --rebase origin main
          git push

  update-floods:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.flood_gpkg_url != ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install geopandas requests
      - name: Fetch floods
        run: python scripts/fetch_floods.py --gpkg-url "${{ github.event.inputs.flood_gpkg_url }}" --out data/floods.geojson
      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/floods.geojson
          git diff --staged --quiet || git commit -m "chore: update floods.geojson [auto]"
          git pull --rebase origin main
          git push

  update-rainfall:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.run_rainfall == 'true'
    # 2026年8月改訂: fetch_rainfall.pyが「直近180日の近似値」方式から「年最大値+
    # Gumbel分布フィット」方式に変更されたことに伴い更新。
    # 実測(#39: 180日で3分51秒)から1日約1.3秒。10年分(3,650日)で約1.6時間、
    # 20年分なら約3.2時間の見込み。まずはサーバー負荷を抑えるため10年で運用し、
    # 安定して完走するようなら --years を増やすことを検討する。
    # timeoutは10年分の見込み(1.6時間)に余裕を持たせて300分に設定。
    # なおスクリプト側が年ごとにキャッシュをcommit・pushするため、途中でtimeoutに
    # 達しても完了済みの年はリポジトリに残り、次回はその続きから再開できる。
    # 【2026年8月改訂・その9】fetch_rainfall.py側がSTART_YEAR(2016)固定方式に
    # 変更されたため、--years引数は削除した(渡しても無視される仕様になったが、
    # 混乱を避けるため呼び出し側からも削除)。
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install rasterio requests numpy
      - name: Configure git
        # 2026年8月追加: fetch_rainfall.py内部が年ごとにgit commit/pushを行うようになった
        # ため、スクリプト実行前にgit configを済ませておく必要がある(以前は最後の
        # 「Commit and push if changed」ステップでのみ設定していたが、それでは遅い)。
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - name: Fetch rainfall risk grid
        run: python scripts/fetch_rainfall.py --grid-deg 1.0 --out data/rainfall_risk.geojson --cache data/rainfall_annual_max_cache.json
      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/rainfall_risk.geojson data/rainfall_annual_max_cache.json
          git diff --staged --quiet || git commit -m "chore: update rainfall_risk.geojson [auto]"
          git pull --rebase origin main
          git push

  # 【2026年9月追加】外水氾濫(機構1)に湖沼を組み込むための、HydroLAKESからの
  # 一括抽出ジョブ。太湖・洪澤湖・青海湖を標高タイルから「発見」しようとした
  # 従来の試み(diagnose_lake_tiles.py)は、単一の閾値では成立しないことが
  # 実測で判明したため撤去し、既知の湖沼データベース(HydroLAKES、CC BY 4.0)
  # から直接抽出する方式に切り替えた。詳細はfetch_lakes.pyのdocstring参照。
  #
  # HydroLAKESの配布ファイル(約763MB)はこのジョブの実行中だけ使い、
  # リポジトリにはコミットしない。data/lakes.geojsonとして出力される、
  # 面積と間引いた湖岸点群だけを持つ小さいファイルだけがコミットされる。
  update-lakes:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.run_lakes == 'true' && github.event.inputs.hydrolakes_url != ''
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install geopandas requests
      - name: Fetch lakes
        run: python scripts/fetch_lakes.py --hydrolakes-url "${{ github.event.inputs.hydrolakes_url }}" --out data/lakes.geojson
      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/lakes.geojson
          git diff --staged --quiet || git commit -m "chore: generate lakes.geojson from HydroLAKES [auto]"
          git pull --rebase origin main
          git push

  # 【2026年9月追加】凍結ハザード(水道管凍結・破裂リスク)。詳細は上のコメントブロックと
  # scripts/fetch_freeze.py のdocstring参照。NASA POWERは認証・APIキー不要のため
  # hydrolakes_urlのような外部URL入力は不要。
  update-freeze:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.run_freeze == 'true'
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install requests
      - name: Fetch freeze hazard grid
        run: python scripts/fetch_freeze.py --elevation data/elevation_risk.geojson --out data/freeze_risk.geojson
      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/freeze_risk.geojson
          git diff --staged --quiet || git commit -m "chore: update freeze_risk.geojson [auto]"
          git pull --rebase origin main
          git push

  # 【一時ジョブ・要削除】①FDDの絶対閾値を過去の実被害事例から逆算するための
  # 較正専用ジョブ。何もリポジトリにコミットしない(ログ出力を見るだけ)。
  # 閾値が確定したら、この入力(run_freeze_calibration)とこのジョブ、および
  # scripts/calibrate_freeze_thresholds.py 自体を削除してよい。
  calibrate-freeze:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.run_freeze_calibration == 'true'
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install requests
      - name: Run calibration (see output below in this step's log)
        run: python scripts/calibrate_freeze_thresholds.py
