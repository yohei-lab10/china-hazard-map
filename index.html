// ==== 地点検索: 各ハザードの5段階配色ロジック(標高以外はローカルデータのみで計算、追加通信なし) ====

// 気象庁の震度階級配色を参考にした地震用5段階(黄→橙→赤→濃い赤→赤紫)
const EARTHQUAKE_TIER_COLORS = ['#D9A22C', '#D9722C', '#C13A2E', '#8C1F1F', '#7A2E6B'];
// 気象庁の統一「警戒レベル」配色を参考にした台風・雷・洪水共通5段階(黄→橙→赤→紫→黒)
const WARNING_TIER_COLORS = ['#D9A22C', '#D9722C', '#C13A2E', '#7A3B8C', '#C13A7A'];

// 5段階配色のグラデーション凡例(温度計ふう)+データ欠損(灰色)の説明をHTMLで生成する共通関数

const GENERIC_TIER_LABELS = ['Low', 'Moderate', 'High', 'Severe', 'Extreme'];
function riskLegendHtml(colors, ratio, labels) {
  const useColors = colors || WARNING_TIER_COLORS;
  const useLabels = labels || GENERIC_TIER_LABELS;
  const bar = useColors.map(c => `<span style="background:${c};"></span>`).join('');
  const labelSpans = useLabels.map(l => `<span>${l}</span>`).join('');
  const hasMarker = typeof ratio === 'number' && !isNaN(ratio);
  // マーカーは棒の左右端で見切れないよう、ごくわずかに内側へクランプする
  const pct = hasMarker ? Math.min(99, Math.max(1, ratio * 100)) : 0;
  return `
    <div class="risk-legend">
      <div class="risk-legend-bar-wrap">
        ${hasMarker ? `<div class="risk-legend-marker" style="left:${pct.toFixed(1)}%;">▼</div>` : ''}
        <div class="risk-legend-bar">${bar}</div>
      </div>
    </div>
    <div class="risk-legend-labels">${labelSpans}</div>
  `;
}

// 台風(34kt+)の発生頻度(再現期間)の表示。過去の最大値(バッジ本体)とは別の指標なので、
// 混同されないよう「past N years」を明記し、不確実性の90%区間もあわせて示す。
function typhoonFreqHtml(freq) {
  if (!freq.observed) {
    return `<div class="result-freq">Typhoon (34kt+): not observed within 200km in past ${freq.totalYears}yrs (insufficient data for a frequency estimate)</div>`;
  }
  return `<div class="result-freq">Typhoon frequency: ~${freq.returnPeriod.toFixed(1)}yr return period (annual prob. ${(freq.pAnnual * 100).toFixed(0)}%, 90% CI: ${freq.ciLow.toFixed(1)}–${freq.ciHigh.toFixed(1)}yr, based on ${freq.totalYears}yrs of data)</div>`;
}

function haversineKm(lat1, lon1, lat2, lon2) {
  const R = 6371;
  const dLat = (lat2 - lat1) * Math.PI / 180;
  const dLon = (lon2 - lon1) * Math.PI / 180;
  const a = Math.sin(dLat / 2) ** 2 + Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLon / 2) ** 2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
}

// 度単位のざっくりした絞り込み(重い三角関数を使うhaversineの前段フィルタとして使う)。
// 緯度1度は約111km固定。経度は高緯度ほど短くなるが、ここでは安全側に倍のマージンを取って簡略化する。
function degBboxFilter(lat, lon, flat, flon, radiusKm) {
  const degMargin = (radiusKm / 111) * 1.5;
  return Math.abs(lat - flat) <= degMargin && Math.abs(lon - flon) <= degMargin;
}

// 地震: 周辺100km以内の地震のうち、マグニチュードと震源距離を組み合わせた実効的な
// 危険度が最大のものを判定に使う。以前は「100km以内の最大マグニチュード」を二値判定
// (圏内/圏外)していたため、5km先のM6.0も95km先のM6.0も同じ扱いになっていた。
// lightningと同じ考え方で、震源距離に応じて線形減衰させる(100kmでゼロ)ようにした。
// マグニチュード側はM5.0=0.05(下限)、M7.5以上=1.0となるよう2乗カーブで正規化している。
// 【2026年8月改訂】以前は単純な線形正規化(M5.0=0.0)だったため、震源距離が0kmでも
// M5.0ちょうどの地震は必ずeffective=0(距離減衰も無意味化)になり、「M5.0+」を謳う
// バッジ文言と矛盾していた。2乗カーブへの変更は副作用として、M6.5以上の高マグニチュード
// 帯の刻みをより強調する効果もある(地震のエネルギーは指数的に増えるため、線形正規化だと
// 低マグニチュード側の刻みが相対的に粗く感じられる問題があった)。
function earthquakeRiskInfo(lat, lon) {
  if (!earthquakeGeojsonCache) return null;
  let best = null; // { mag, dist, effective }
  earthquakeGeojsonCache.features.forEach(f => {
    const [flon, flat] = f.geometry.coordinates;
    if (!degBboxFilter(lat, lon, flat, flon, 100)) return; // 先に安価な絞り込み
    const mag = f.properties?.mag;
    if (typeof mag !== 'number') return;
    const dist = haversineKm(lat, lon, flat, flon);
    if (dist > 100) return;
    const falloff = Math.max(0, 1 - dist / 100);
    const magRatioLinear = Math.min(1, Math.max(0, (mag - 5.0) / 2.5));
    const magRatio = Math.max(0.05, Math.pow(magRatioLinear, 2));
    const effective = magRatio * falloff;
    if (!best || effective > best.effective) best = { mag, dist, effective };
  });
  // 100km境界付近のごく微弱な値はノイズとして扱い、「データなし」と同様に無視する
  if (!best || best.effective <= 0.02) return null;
  const tier = Math.min(4, Math.floor(best.effective * 5));
  return { tier, ratio: best.effective, color: EARTHQUAKE_TIER_COLORS[tier], valueLabel: `M${best.mag.toFixed(1)}, ${Math.round(best.dist)}km` };
}
function earthquakeTileColor(lat, lon) {
  const info = earthquakeRiskInfo(lat, lon);
  return info ? info.color : null;
}

// 台風: 指定地点での推定風速(r34_kmがあれば線形補間、無ければ固定半径フォールバック)を、
// JMA(気象庁)の台風強さ階級(台風/強い台風/非常に強い台風/猛烈な台風)で判定する。最低閾値(34kt)未満は対象外。
// 周辺200km以内で、過去のデータ期間全体における台風(34kt+)の発生回数を年ごとに数える
// 共通ヘルパー(頻度重み・再現期間の両方で使う)。r34_kmがあれば線形補間、無ければ
// 固定半径フォールバックで判定する(estimateStormWindAtと同じ基準)。
function typhoonEventsAt(lat, lon) {
  if (!typhoonGeojsonCacheGlobal) return null;
  const years = typhoonGeojsonCacheGlobal.features
    .map(f => f.properties?.start_time ? new Date(f.properties.start_time).getFullYear() : null)
    .filter(y => y !== null);
  if (years.length === 0) return null;
  const minYear = Math.min(...years), maxYear = Math.max(...years);
  const totalYears = maxYear - minYear + 1;
  const countByYear = {};
  for (let y = minYear; y <= maxYear; y++) countByYear[y] = 0;
  typhoonGeojsonCacheGlobal.features.forEach(f => {
    const estWind = estimateStormWindAt(f, lat, lon);
    if (estWind === null || estWind < TYPHOON_CATEGORY_BOUNDS_KT[0]) return; // 最低閾値(34kt)未満は対象外
    const y = f.properties?.start_time ? new Date(f.properties.start_time).getFullYear() : null;
    if (y !== null && countByYear[y] !== undefined) countByYear[y]++;
  });
  const counts = Object.values(countByYear);
  const totalEvents = counts.reduce((s, c) => s + c, 0);
  return { totalYears, countByYear, counts, totalEvents };
}

// 台風の発生頻度による重み(水害の洪水実績重みと同じ設計思想: 1.0〜1.5倍、下限1.0固定)。
// 「1回だけ強烈な猛烈な台風」と「弱めの台風が繰り返し何度も来る」地点を区別するため、
// 過去の発生回数が多いほど単発最大強度のratioを底上げする。
// 【2026年8月実装】N=5(データ期間内で台風(34kt+)が5回以上なら頭打ち)は、水害の
// 80km・0.5係数と同様、公式基準ではなく経験則的な調整値。まずはN=5で試験導入し、
// 実データでの発生回数の分布を見ながら調整する想定。
const TYPHOON_FREQ_WEIGHT_N = 5;
function typhoonFrequencyWeightAt(lat, lon) {
  const ev = typhoonEventsAt(lat, lon);
  if (!ev || ev.totalEvents === 0) return { weight: 1.0, totalEvents: 0, totalYears: ev ? ev.totalYears : null };
  const relative = Math.min(1, ev.totalEvents / TYPHOON_FREQ_WEIGHT_N);
  return { weight: 1 + 0.5 * relative, totalEvents: ev.totalEvents, totalYears: ev.totalYears };
}

function typhoonRiskInfo(lat, lon) {
  const estWind = typhoonWindEstimateAt(lat, lon);
  const tr = typhoonWindToTierRatio(estWind);
  if (!tr) return null;
  const freq = typhoonFrequencyWeightAt(lat, lon);
  const adjustedRatio = Math.min(1, tr.ratio * freq.weight);
  const n = TYPHOON_CATEGORY_BOUNDS_KT.length;
  const tier = Math.min(n - 1, Math.floor(adjustedRatio * n));
  const freqSuffix = freq.totalEvents > 1 ? ` (×${freq.totalEvents} in ${freq.totalYears}yrs)` : '';
  return { tier, ratio: adjustedRatio, color: TYPHOON_TIER_COLORS[tier], valueLabel: `${TYPHOON_TIER_LABELS[tr.tier]}, ~${Math.round(estWind)}kt at this point${freqSuffix}` };
}
function typhoonTileColor(lat, lon) {
  const info = typhoonRiskInfo(lat, lon);
  return info ? info.color : null;
}

// 台風の発生頻度(再現期間)を、周辺200km以内・過去のデータ期間全体から統計的に推定する。
// バッジ本体が過去の最大値(1個のイベント)を示すのに対し、こちらは
// 「台風(34kt+)が平均どれくらいの頻度で来るか」という発生回数(頻度)の指標で、別物。
// 2026年8月実装: 年ごとに台風(34kt+)の発生回数をカウントし、ポアソン分布で
// 年間発生確率・再現期間を点推定。加えて、年別データを1000回ブートストラップ再抽出して
// (11年程度の少ないデータに由来する)推定の不確実性を90%区間として示す。
// 対数正規分布などの連続分布は「0回の年」を表現できないため採用していない(過去の検討より)。
function typhoonReturnPeriodInfo(lat, lon) {
  const ev = typhoonEventsAt(lat, lon);
  if (!ev) return null;
  const { totalYears, counts, totalEvents } = ev;

  if (totalEvents === 0) return { totalYears, observed: false };

  // 点推定(ポアソン分布): lambda = 年平均発生回数
  const lambda = totalEvents / totalYears;
  const pAnnual = 1 - Math.exp(-lambda);
  const returnPeriod = 1 / pAnnual;

  // ブートストラップ(1000回、年単位で重複ありに再抽出)で不確実性の90%区間を求める
  const BOOTSTRAP_N = 1000;
  const rps = [];
  for (let i = 0; i < BOOTSTRAP_N; i++) {
    let sampleSum = 0;
    for (let j = 0; j < counts.length; j++) {
      sampleSum += counts[Math.floor(Math.random() * counts.length)];
    }
    const lamB = sampleSum / counts.length;
    if (lamB === 0) continue; // この試行では「発生なし」となり再現期間は定義できないため除外
    const pB = 1 - Math.exp(-lamB);
    rps.push(1 / pB);
  }
  rps.sort((a, b) => a - b);
  const pct = (p) => rps.length ? rps[Math.min(rps.length - 1, Math.floor(rps.length * p))] : null;

  return {
    totalYears, observed: true, totalEvents, pAnnual, returnPeriod,
    ciLow: pct(0.05), ciHigh: pct(0.95),
  };
}

// 雷: 既知の落雷多発地点までの距離から密度を推定し5段階に変換
// 【2026年9月改訂】80km→55kmに変更。格子間隔(0.5度≈55km)より意図的に広く取っていた
// 80kmはぼかしが強すぎたため、格子間隔と揃えることで、なめらかさを保ったまま
// 少しシャープにした。半径をさらに絞る(例: 10km)と、格子間の隙間が
// 「データなし」だらけになるため行っていない(元データの格子自体が55km間隔で
// 粗いため、半径を縮めても精密さは上がらず、穴が増えるだけ)。
function lightningRiskInfo(lat, lon) {
  if (!lightningGeojsonCacheGlobal) return null;
  let nearest = null, nearestDist = Infinity;
  lightningGeojsonCacheGlobal.features.forEach(f => {
    const [slon, slat] = f.geometry.coordinates;
    if (!degBboxFilter(lat, lon, slat, slon, 55)) return;
    const d = haversineKm(lat, lon, slat, slon);
    if (d < nearestDist) { nearestDist = d; nearest = f.properties?.risk; }
  });
  if (nearest === null || nearest === undefined || nearestDist > 55) return null;
  // 格子点(約55km間隔)からの距離で緩やかに減衰させ、格子の境目が不自然に見えないようにする
  const falloff = Math.max(0, 1 - nearestDist / 55);
  const ratio = nearest * falloff;
  if (ratio <= 0.05) return null;
  const tier = Math.min(4, Math.floor(ratio * 5));
  return { tier, ratio, color: WARNING_TIER_COLORS[tier], valueLabel: ratio.toFixed(2) };
}
function lightningTileColor(lat, lon) {
  const info = lightningRiskInfo(lat, lon);
  return info ? info.color : null;
}

// 洪水: 周辺80km以内で最も近い洪水記録の冠水面積を5段階に変換
function floodTileColor(lat, lon) {
  if (!floodGeojsonCacheGlobal) return null;
  let nearestArea = null, nearestDist = Infinity;
  floodGeojsonCacheGlobal.features.forEach(f => {
    const area = f.properties?.affected_sq_km;
    if (typeof area !== 'number') return;
    const [flon, flat] = f.geometry.coordinates;
    if (!degBboxFilter(lat, lon, flat, flon, 80)) return;
    const d = haversineKm(lat, lon, flat, flon);
    if (d <= 80 && d < nearestDist) { nearestDist = d; nearestArea = area; }
  });
  if (nearestArea === null) return null;
  const ratio = Math.min(1, nearestArea / 5000);
  return WARNING_TIER_COLORS[Math.min(4, Math.floor(ratio * 5))];
}


// so failed lookups are retried automatically before surfacing an error.
// ==== Point lookup: elevation + comparison with 8 surrounding points ====
// Open-Elevation supports CORS for direct browser calls (unlike the free tier of
// Open-Topo-Data, which requires a paid plan for CORS). It's occasionally flaky,
// so failed lookups are retried automatically before surfacing an error.
const OPEN_ELEVATION_URL = 'https://api.open-elevation.com/api/v1/lookup';
const ELEVATION_MAX_RETRIES = 2;
const DIRS = [
  { name: 'N', dLat: 1, dLon: 0 }, { name: 'NE', dLat: 1, dLon: 1 },
  { name: 'E', dLat: 0, dLon: 1 }, { name: 'SE', dLat: -1, dLon: 1 },
  { name: 'S', dLat: -1, dLon: 0 }, { name: 'SW', dLat: -1, dLon: -1 },
  { name: 'W', dLat: 0, dLon: -1 }, { name: 'NW', dLat: 1, dLon: -1 },
];
const SEARCH_RADIUS_M = 100;

// 検索地点周辺を細かい格子(グリッド)状にサンプリングして面で塗るための設定。
// 【2026年9月改訂】標高がローカルの150mタイル(AW3D30)になり、1マスあたりの
// API問い合わせが不要になったため、9x9(1マス250m、約2.25km四方)から
// 21x21(1マス150m、約3.15km四方)へ拡張した。1マスのサイズを標高タイルの
// 画素サイズ(1/720度 ≒ 150m)に合わせてあるので、リサンプリングが発生しない。
// この21x21グリッドは、内水氾濫の窪み係数(周囲との相対標高)の計算基盤も兼ねる。
const GRID_CELL_M = 150;
const GRID_STEPS = 10; // 中心 ±10マス = 21x21 = 441マス
const GRID_RADIUS_M = GRID_CELL_M * GRID_STEPS; // 1500m

let searchMarkerLayer;
let searchExtentLayer; // 評価範囲の枠(2026年9月追加)。検索のたびに作り直す
let searchGridLayers = {}; // ハザードキーごとのタイルレイヤー(それぞれ対応するチップと連動)

// 【2026年9月削除】elevationToRiskInfo()は3m/5m/10mの旧しきい値をそのまま流用した
// 単独の「標高リスク」表示だったが、depressionFactorLabel()に統合したため呼び出し元が
// 無くなった(死んだコードとして残していたのを削除)。

// 降雨の再現期間(2026年8月実装)。
// fetch_rainfall.py側で20年分の年最大値にフィット済みのGumbel分布パラメータ
// (gumbel_mu, gumbel_beta)を使い、固定の再現期間(10年/50年/100年)それぞれについて
// 「その再現期間に相当する降水量(mm)」を逆算する。
// 台風がポアソン分布(離散カウント)なのに対し、降雨は「年最大値」という連続量を扱うため
// Gumbel分布(極値統計で標準的に使われる連続分布)を使う。
// 逆関数: x_T = mu - beta * ln(-ln(1 - 1/T))  ※Tは再現期間(年)
// 20年分のデータでは、50年・100年は観測期間の2.5〜5倍の外挿になり不確実性が非常に大きい
// 点に注意(台風の非常に強い/猛烈な台風と同種の限界)。10年(観測期間の半分)はおおむね妥当。
const RAINFALL_RETURN_PERIODS_YR = [10, 50, 100];

// 気候変動シナリオ(2026年8月実装)。
// Gumbel分布は「降水量の統計的性質は時間で変わらない(定常性)」を前提にしており、
// 気候変動による増加傾向を織り込めない。10年分のデータでは非定常GEV(時間依存パラメータ)で
// トレンドを検出する統計的検出力が無いため、IPCCの知見に基づく係数を掛ける方式を採る。
//
// 根拠: IPCC AR6 第11章 — 年最大日降水量(Rx1day)の変化は世界平均地上気温の変化に比例し、
// Clausius-Clapeyron関係に従って1℃の昇温あたり約7%増加する(観測・将来予測とも)。
// 中国域の研究でも日降水量の極値は6〜7%/℃とほぼ同じ関係が確認されている。
// このサイトが算出しているのはまさにRx1day(年最大24時間降水量)なので指標が一致する。
//
// 注意: これは「その昇温レベルに達した世界での想定値」であり、いつそうなるかを示すものではない。
// 昇温量の選択(=どのSSPシナリオを想定するか)は利用者の判断に委ねる。
const RAINFALL_CC_PCT_PER_DEG = 7; // %/℃(Clausius-Clapeyron関係)
// マップ・地点検索・レポートで共有する配列。ここを変えるだけで4箇所に反映される。
const RAINFALL_WARMING_SCENARIOS = [0, 1.5, 2, 3]; // ℃(0=現在の観測ベース)

// 【2026年9月追加】水害バッジ・レポートの両方から使う共通ヘルパー。
// 外水(fluvial)・高潮(surge)・窪み係数(depression)は気候シナリオの影響を受けない
// (降雨強度だけがIPCC AR6係数で変わる設計、p.24)ため、これらは1回だけ計算した値を
// 再利用し、シナリオごとに変わる降雨強度(pluvial)だけを再計算する。
// ヘッダーの総合スコア(badge本体・レポートの表紙)は従来どおり常に現在気候(warming=0)
// のままで、この関数はあくまで「参考として他シナリオだとどうなるか」を出すためのもの。
function waterHazardByScenario(lat, lon, fluvial, surge, depressionFactorObj, weight, tierLabels) {
  return RAINFALL_WARMING_SCENARIOS.map(w => {
    const rain = rainfallIntensityScore(lat, lon, w);
    const pluvial = rain === null ? null : Math.max(0, Math.min(1, rain * depressionFactorObj.factor));
    const combined = combineWaterHazard(fluvial, pluvial, surge);
    if (!combined) return { warming: w, finalRisk: null, tierLabel: null, dominant: null };
    const finalRisk = Math.min(1.0, combined.base * weight);
    const tier = Math.min(4, Math.max(0, Math.ceil(finalRisk * 5) - 1));
    return { warming: w, finalRisk, tierLabel: tierLabels[tier], dominant: combined.dominant };
  });
}

function waterScenarioSummaryHtml(scenarios) {
  const parts = scenarios.map(s => {
    const label = s.warming === 0 ? 'Current' : `+${s.warming}°C`;
    const value = s.finalRisk === null ? 'n/a' : `${s.tierLabel} (${s.finalRisk.toFixed(2)})`;
    return `${label} ${value}`;
  });
  return parts.join(' · ');
}

// レポートのシナリオ曲線・凡例で共用する配色(RAINFALL_WARMING_SCENARIOSと同じ順・同じ数)
const CURVE_COLORS_RPT = ['#378ADD', '#1D9E75', '#EF9F27', '#D85A30'];
// 【2026年9月改訂】地点検索用のrainfallSelectedWarmingと、全国ヒートマップ用の
// mapRainfallWarmingが別々に存在し、見た目の同じラジオボタンが2箇所に重複表示され
// 混乱を招いていた。1つの状態(mapRainfallWarming)に統合し、切替は地図側のみで行う。
function rainfallReturnPeriodInfo(lat, lon) {
  if (!rainfallGeojsonCacheGlobal) return null;
  let nearest = null, nearestDist = Infinity;
  rainfallGeojsonCacheGlobal.features.forEach(f => {
    const [flon, flat] = f.geometry.coordinates;
    if (!degBboxFilter(lat, lon, flat, flon, 150)) return;
    const d = haversineKm(lat, lon, flat, flon);
    if (d < nearestDist) { nearestDist = d; nearest = f.properties || {}; }
  });
  if (!nearest || typeof nearest.gumbel_mu !== 'number' || typeof nearest.gumbel_beta !== 'number') {
    return null; // 旧形式データ(Gumbelパラメータ未生成)の場合は表示しない
  }
  const { gumbel_mu: mu, gumbel_beta: beta, years_used: yearsUsed } = nearest;
  // 選択中の昇温シナリオに応じた気候変動係数(0℃なら1.0=観測ベースのまま)
  const ccFactor = 1 + (RAINFALL_CC_PCT_PER_DEG / 100) * mapRainfallWarming;
  const results = RAINFALL_RETURN_PERIODS_YR.map(T => {
    const baseMm = mu - beta * Math.log(-Math.log(1 - 1 / T));
    return { years: T, mm: baseMm * ccFactor };
  });
  return { results, yearsUsed, warming: mapRainfallWarming };
}

// 【2026年9月改訂】シナリオ切替はここでは行わない(地図側の「Map colors for」に一本化)。
// ここでは選択中のシナリオを1行で示すだけの読み取り専用表示にする。
// 【2026年9月改訂】ご指摘によりトップ(検索結果バッジ)側にもシナリオ切替を復活。
// ただし状態は地図側と共通(mapRainfallWarming)なので、以前のような「見た目が同じ
// 別々のコントロール」にはならず、どちらを押しても両方が同時に切り替わる。
function rainfallFreqHtml(freq) {
  if (!freq) return '';
  const rows = freq.results.map(r => `${r.years}yr: ~${r.mm.toFixed(0)}mm`).join(' / ');
  const scenarioLabel = freq.warming === 0 ? 'current climate' : `+${freq.warming}°C scenario`;

  return `<div class="result-freq" id="rainfallFreq">
    ${rows} (${scenarioLabel}, ${freq.yearsUsed}yrs data)
    ${climateChipsHtml()}
  </div>`;
}

function metersToDegLat(m) { return m / 111000; }
function metersToDegLon(m, lat) { return m / (111000 * Math.cos(lat * Math.PI / 180)); }

// 標高タイルから複数地点の標高をまとめて取得する。タイルが存在しない範囲
// (パミール高原・モンゴル国内の一部)では null を返すので、呼び出し側で
// Open-Elevation にフォールバックする。
async function elevationsFromTiles(block, locations) {
  if (!block || !block.ok) return null;
  const out = locations.map(l => block.get(l.latitude, l.longitude));
  return out.some(v => v === null || typeof v !== 'number') ? null : out;
}

async function fetchElevations(locations) {
  for (let attempt = 1; attempt <= ELEVATION_MAX_RETRIES; attempt++) {
    try {
      const res = await fetch(OPEN_ELEVATION_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ locations }),
      });
      if (!res.ok) throw new Error('elevation api error');
      const data = await res.json();
      const results = data.results || [];
      if (results.length < locations.length) throw new Error('insufficient results');
      return results.map(r => r.elevation);
    } catch (e) {
      if (attempt === ELEVATION_MAX_RETRIES) throw e;
    }
  }
}

// queryPoint に渡す lat/lon は必ずWGS84。GCJ-02(高徳)・BD-09(百度)で入力された場合は
// 呼び出し側(検索ボタン / レポート生成)で変換済みのため、この中では変換しない。
// 標高タイル(data/elevation_tiles/)もWGS84基準なので、そのままタイルIDを算出してよい。
async function queryPoint(lat, lon) {
  const resultEl = document.getElementById('searchResult');
  if (BADGE_LAYER_KEYS.some(k => activeLayers.has(k))) {
    resultEl.className = 'search-result visible';
    resultEl.innerHTML = '<div class="result-elev">Fetching…</div>';
  }

  lastQueriedLatLon = { lat, lon };
  syncReportLocationFromSearch(lat, lon);

  const dLat = metersToDegLat(SEARCH_RADIUS_M);
  const dLon = metersToDegLon(SEARCH_RADIUS_M, lat);
  const locations = [{ latitude: lat, longitude: lon }];
  DIRS.forEach(d => locations.push({ latitude: lat + d.dLat * dLat, longitude: lon + d.dLon * dLon }));

  // 500m圏内の9x9グリッド(各マス約125m四方)の中心座標を用意
  const cellDLat = metersToDegLat(GRID_CELL_M);
  const gridCells = [];
  for (let i = -GRID_STEPS; i <= GRID_STEPS; i++) {
    for (let j = -GRID_STEPS; j <= GRID_STEPS; j++) {
      const cellLat = lat + i * cellDLat;
      const cellDLon = metersToDegLon(GRID_CELL_M, cellLat);
      gridCells.push({ lat: cellLat, lon: lon + j * cellDLon });
    }
  }
  const gridLocations = gridCells.map(c => ({ latitude: c.lat, longitude: c.lon }));

  try {
    // 21x21グリッド(±10画素)に加え、外水氾濫の比高計算で半径2km(約13画素)の
    // 河川頂点も参照するため、余裕をみて ±30画素(約4.6km四方)を1回で読む。
    const elevBlock = await loadElevationBlock(lat, lon, 30);

    let elevations = await elevationsFromTiles(elevBlock, locations);
    let gridElevations = await elevationsFromTiles(elevBlock, gridLocations);
    if (!elevations || !gridElevations) {
      // タイル欠損範囲: 従来どおりOpen-Elevation APIにフォールバックする
      [elevations, gridElevations] = await Promise.all([
        fetchElevations(locations),
        fetchElevations(gridLocations),
      ]);
    }

    const centerElev = elevations[0];

    // バッジは「水害ハザード」の統合値(降雨×標高の高い方 × 洪水実績の重み)で判定する。
    // 湖の近接判定は、Overpass API(OpenStreetMap)にこの検索1回につき1回だけ問い合わせる
    // (169マス個別には問い合わせず、結果を使い回すことで通信回数を抑える)。

    const pluvialRain = rainfallIntensityScore(lat, lon);
    const noRainDataHere = pluvialRain === null;
    const tierLabels = ['Low', 'Moderate', 'High', 'Severe', 'Extreme'];

    // 21x21グリッドの標高から窪み係数を求める(内水氾濫の増幅要因)。
    // 【2026年9月】表示用の標高差(depLabel)もこのdepressionと同じ計算根拠を使う。
    const gridSide = GRID_STEPS * 2 + 1;
    const depression = depressionFactor(centerElev,
      subGridAround(gridElevations, gridSide, GRID_STEPS, GRID_STEPS, DEPRESSION_HALF));
    const depLabel = depressionFactorLabel(depression);
    const pluvial = noRainDataHere ? null : Math.max(0, Math.min(1, pluvialRain * depression.factor));
    const fluvial = fluvialScoreAt(lat, lon, elevBlock && elevBlock.ok ? elevBlock.get : null, centerElev);
    const surge = surgeScoreAt(lat, lon, centerElev);
    const waterCombined = combineWaterHazard(fluvial, pluvial, surge);

    let waterBadge;
    if (!waterCombined) {
      // 3機構すべてが評価不能。降雨圏外なのか取得失敗なのかを書き分ける。
      waterBadge = {
        label: noRainDataHere && riverSpatialIndex && coastlinePointsIndex
          ? 'No rainfall data (outside CHIRPS coverage)'
          : 'Water hazard not evaluated (data unavailable)',
        color: NO_DATA_COLOR, colors: WARNING_TIER_COLORS,
      };
    } else {
      const weight = floodWeightAt(lat, lon);
      const finalRisk = Math.min(1.0, waterCombined.base * weight);
      const tier = Math.min(4, Math.max(0, Math.ceil(finalRisk * 5) - 1));
      const rainfallFreq = rainfallReturnPeriodInfo(lat, lon);
      // 【2026年9月追加】ヘッダーの総合スコアは従来どおり現在気候のまま。
      // 参考として、+1.5/+2/+3℃だとどうなるかも一緒に計算しておく。
      const byScenario = waterHazardByScenario(lat, lon, fluvial, surge, depression, weight, tierLabels);
      waterBadge = {
        label: `${tierLabels[tier]} water hazard (${finalRisk.toFixed(2)})`,
        color: WARNING_TIER_COLORS[tier], colors: WARNING_TIER_COLORS, ratio: finalRisk,
        dominant: waterCombined.dominant,
        caveat: waterCaveatText(waterCombined.missing),
        freqInfo: rainfallFreq, freqHtmlFn: rainfallFreqHtml,
        byScenario,
      };
    }

    // 地震・台風・雷は標高フェッチを待つ必要が無い(キャッシュ済みgeojsonのみで判定可能)が、
    // 表示更新のタイミングは水害と揃えて1回にまとめている
    const badges = [];
    if (activeLayers.has('earthquake')) {
      const info = earthquakeRiskInfo(lat, lon);
      badges.push(info
        ? { label: `${tierLabels[info.tier]} earthquake hazard (${info.valueLabel})`, color: info.color, colors: EARTHQUAKE_TIER_COLORS, ratio: info.ratio }
        : { label: 'No M5.0+ earthquake within 100km', color: NO_DATA_COLOR, colors: EARTHQUAKE_TIER_COLORS });
    }
    if (activeLayers.has('typhoonHazard')) {
      const info = typhoonRiskInfo(lat, lon);
      const freq = typhoonReturnPeriodInfo(lat, lon);
      badges.push({
        ...(info
          ? { label: `${TYPHOON_TIER_LABELS[info.tier]} hazard (${info.valueLabel})`, color: info.color, colors: TYPHOON_TIER_COLORS, labels: TYPHOON_TIER_LABELS, ratio: info.ratio }
          : { label: typhoonNoDataLabel(), color: NO_DATA_COLOR, colors: TYPHOON_TIER_COLORS, labels: TYPHOON_TIER_LABELS }),
        freqInfo: freq, freqHtmlFn: typhoonFreqHtml,
      });
    }
    if (activeLayers.has('lightning')) {
      const info = lightningRiskInfo(lat, lon);
      badges.push(info
        ? { label: `${tierLabels[info.tier]} lightning hazard (${info.valueLabel})`, color: info.color, colors: WARNING_TIER_COLORS, ratio: info.ratio }
        : { label: 'No significant lightning density nearby', color: NO_DATA_COLOR, colors: WARNING_TIER_COLORS });
    }
    if (activeLayers.has('waterHazard')) badges.push(waterBadge);

    if (badges.length > 0) {
      resultEl.className = 'search-result visible';
      resultEl.innerHTML = `
        ${badges.map(b => `
          <span class="result-badge" style="background:${b.color};">${b.label}</span>
          ${riskLegendHtml(b.colors, b.ratio, b.labels)}
          ${b.freqInfo && b.freqHtmlFn ? b.freqHtmlFn(b.freqInfo) : ''}
        `).join('<div style="height:5px;"></div>')}
        ${activeLayers.has('waterHazard') ? `
          ${waterBadge.dominant ? `<div class="result-elev" style="margin-top:5px;">Dominant mechanism: ${waterBadge.dominant}</div>` : ''}
          ${waterBadge.caveat ? `<div class="result-elev" style="margin-top:5px;color:var(--risk-severe);font-weight:600;">${waterBadge.caveat}</div>` : ''}
          <div class="result-elev" style="margin-top:5px;">Elevation: ${centerElev.toFixed(1)}m — ${depLabel.text} (factored into the score above)</div>
          ${waterBadge.byScenario ? `<div class="result-elev" style="margin-top:5px; font-family:'JetBrains Mono', monospace; font-size:9.5px; opacity:0.85;">By climate scenario: ${waterScenarioSummaryHtml(waterBadge.byScenario)}</div>
          <div class="result-elev" style="margin-top:2px; font-family:'JetBrains Mono', monospace; font-size:9px; opacity:0.6;">Shown for reference only — the score above always uses Current.</div>` : ''}
        ` : ''}
      `;
    } else {
      resultEl.className = 'search-result';
      resultEl.innerHTML = '';
    }

    if (searchMarkerLayer) map.removeLayer(searchMarkerLayer);
    if (searchExtentLayer) map.removeLayer(searchExtentLayer);

    // 半径1000m(一辺約2.25km、2km四方設計)圏内を、各ハザードのリスクに応じた色のタイルで塗る
    // (地震・台風・雷はローカルデータのみ、追加通信なし)
    const hazardTileFns = {
      earthquake: earthquakeTileColor,
      typhoonHazard: typhoonTileColor,
      lightning: lightningTileColor,
    };

    Object.entries(searchGridLayers).forEach(([key, layer]) => {
      if (layer) layerGroups[key].removeLayer(layer);
    });
    searchGridLayers = {};

    Object.entries(hazardTileFns).forEach(([key, fn]) => {
      if (!activeLayers.has(key)) return; // チップがOFFなら、そもそもタイルを生成しない(表示崩れの防止)
      const layer = L.layerGroup();
      let any = false;
      gridCells.forEach((cell, idx) => {
        const color = fn(cell.lat, cell.lon);
        if (!color) return;
        any = true;
        const halfLat = cellDLat / 2;
        const halfLon = metersToDegLon(GRID_CELL_M, cell.lat) / 2;
        L.rectangle(
          [[cell.lat - halfLat, cell.lon - halfLon], [cell.lat + halfLat, cell.lon + halfLon]],
          { color, weight: 0, fillColor: color, fillOpacity: 0.45 }
        ).addTo(layer);
      });
      if (any) {
        layer.addTo(layerGroups[key]);
        searchGridLayers[key] = layer;
      }
    });

    // 水害ハザードのタイル: 標高は実測API値(このマス)、降雨強度は最寄りの事前生成データ、
    // 洪水実績は重みとしてのみ使用。海上のマスは除外。チップがOFFなら生成自体をスキップする。
    // 水害ハザードのタイル: バッジと同じ3機構モデルで1マスずつ評価する。
    // 標高は150mタイルの実測値(このマス)、降雨は平滑化済みGumbel、
    // 窪み係数はグリッド全体の分布から求めた値をマス共通で使う。
    if (activeLayers.has('waterHazard')) {
      const waterGridLayer = L.layerGroup();
      const gridVals = gridElevations;
      gridCells.forEach((cell, idx) => {
        const cellElev = gridVals[idx];
        if (typeof cellElev !== 'number') return;
        // 陸/海の判定: CHINA_COASTLINE_POLYGON は30頂点しかなく、海南島・青島・大連などを
        // 「海」と誤判定してタイルが1枚も描画されない問題があった。標高タイルでは海面が0mで
        // 埋まっているため、粗いポリゴンで陸と判定されるか、標高が0mより高ければ陸とみなす。
        if (!isOnLand(cell.lat, cell.lon) && !(cellElev > 0)) return;

        // 【2026年9月修正】ここにmapRainfallWarmingを渡し忘れていたため、地図の気候
        // シナリオを切り替えても、検索中の地点の水害タイル(150m格子)だけは常に現在気候
        // のまま変わらなかった(全国俯瞰のヒートマップだけが変化していた)。
        const cellRain = rainfallIntensityScore(cell.lat, cell.lon, mapRainfallWarming);
        const cellDep = depressionFactor(cellElev,
          subGridAround(gridVals, GRID_STEPS * 2 + 1, Math.floor(idx / (GRID_STEPS * 2 + 1)), idx % (GRID_STEPS * 2 + 1), DEPRESSION_HALF));
        const cellPluvial = cellRain === null ? null : Math.max(0, Math.min(1, cellRain * cellDep.factor));
        const cellFluvial = fluvialScoreAt(cell.lat, cell.lon, elevBlock && elevBlock.ok ? elevBlock.get : null, cellElev);
        const cellSurge = surgeScoreAt(cell.lat, cell.lon, cellElev);
        const cellCombined = combineWaterHazard(cellFluvial, cellPluvial, cellSurge);
        if (!cellCombined) return; // データなしのマスは何も描かない

        const weight = floodWeightAt(cell.lat, cell.lon);
        const finalRisk = Math.min(1.0, cellCombined.base * weight);
        if (finalRisk <= 0) return;

        const halfLat = cellDLat / 2;
        const halfLon = metersToDegLon(GRID_CELL_M, cell.lat) / 2;
        const tileColor = WARNING_TIER_COLORS[Math.min(4, Math.max(0, Math.ceil(finalRisk * 5) - 1))];
        L.rectangle(
          [[cell.lat - halfLat, cell.lon - halfLon], [cell.lat + halfLat, cell.lon + halfLon]],
          { color: tileColor, weight: 0, fillColor: tileColor, fillOpacity: 0.45 }
        ).addTo(waterGridLayer);
      });
      waterGridLayer.addTo(layerGroups.waterHazard);
      searchGridLayers.waterHazard = waterGridLayer;
    }

    // 指定地点そのものは📍ピンで表示(どのチップの状態にも関わらず常に表示)
    searchMarkerLayer = L.marker([lat, lon], {
      icon: L.divIcon({
        html: '<div style="font-size:26px;line-height:1;transform:translateY(-4px);">📍</div>',
        className: '',
        iconSize: [26, 26],
        iconAnchor: [13, 26],
      }),
    }).addTo(map);

    // 【2026年9月追加】評価範囲そのものを地図上に枠で示す。数値の開示はレポート側
    // (「約1.05km四方の窪みを考慮」)と揃え、計算式やしきい値は出さない。
    searchExtentLayer = L.layerGroup().addTo(map);

    const halfLatOuter = metersToDegLat(GRID_RADIUS_M);
    const halfLonOuter = metersToDegLon(GRID_RADIUS_M, lat);
    L.rectangle(
      [[lat - halfLatOuter, lon - halfLonOuter], [lat + halfLatOuter, lon + halfLonOuter]],
      { color: '#6C7686', weight: 1, dashArray: '4 4', fill: false, interactive: false }
    ).bindTooltip('Evaluated area (~3.15km)', { permanent: true, direction: 'bottom', className: 'extent-tooltip', offset: [0, 16] })
     .addTo(searchExtentLayer);

    const halfLatInner = metersToDegLat(DEPRESSION_HALF * GRID_CELL_M);
    const halfLonInner = metersToDegLon(DEPRESSION_HALF * GRID_CELL_M, lat);
    L.rectangle(
      [[lat - halfLatInner, lon - halfLonInner], [lat + halfLatInner, lon + halfLonInner]],
      { color: '#E8B94A', weight: 1.5, dashArray: '2 3', fill: false, interactive: false }
    ).bindTooltip('Depression check (~1.05km)', { permanent: true, direction: 'bottom', className: 'extent-tooltip', offset: [0, -4] })
     .addTo(searchExtentLayer);

    // 検索結果パネル(バッジ・標高情報等)の表示でmap要素の高さが変わるため、
    // Leafletが内部キャッシュしている古いサイズのままcenterがズレないよう、
    // setViewの直前に再計算させる
    map.invalidateSize();
    map.setView([lat, lon], Math.max(map.getZoom(), 13));
  } catch (e) {
    resultEl.innerHTML = '<div class="result-elev">Could not fetch elevation data. Please try again shortly.</div>';
  }
}

// ==== GCJ-02(百度地図・高徳地図などが使う中国独自座標系)→ WGS84 変換 ====
// 公開されているeviltransform等のアルゴリズムに準拠した標準的な変換式。
// 中国国外の座標は変換対象外(規制自体が中国国内向けのため)。
function outOfChina(lat, lon) {
  return lon < 72.004 || lon > 137.8347 || lat < 0.8293 || lat > 55.8271;
}

function gcj02Delta(lat, lon) {
  const a = 6378245.0;
  const ee = 0.00669342162296594323;
  let dLat = -100.0 + 2.0 * lon + 3.0 * lat + 0.2 * lat * lat + 0.1 * lon * lat + 0.2 * Math.sqrt(Math.abs(lon));
  dLat += (20.0 * Math.sin(6.0 * lon * Math.PI) + 20.0 * Math.sin(2.0 * lon * Math.PI)) * 2.0 / 3.0;
  dLat += (20.0 * Math.sin(lat * Math.PI) + 40.0 * Math.sin(lat / 3.0 * Math.PI)) * 2.0 / 3.0;
  dLat += (160.0 * Math.sin(lat / 12.0 * Math.PI) + 320 * Math.sin(lat * Math.PI / 30.0)) * 2.0 / 3.0;

  let dLon = 300.0 + lon + 2.0 * lat + 0.1 * lon * lon + 0.1 * lon * lat + 0.1 * Math.sqrt(Math.abs(lon));
  dLon += (20.0 * Math.sin(6.0 * lon * Math.PI) + 20.0 * Math.sin(2.0 * lon * Math.PI)) * 2.0 / 3.0;
  dLon += (20.0 * Math.sin(lon * Math.PI) + 40.0 * Math.sin(lon / 3.0 * Math.PI)) * 2.0 / 3.0;
  dLon += (150.0 * Math.sin(lon / 12.0 * Math.PI) + 300.0 * Math.sin(lon / 30.0 * Math.PI)) * 2.0 / 3.0;

  const radLat = lat / 180.0 * Math.PI;
  let magic = Math.sin(radLat);
  magic = 1 - ee * magic * magic;
  const sqrtMagic = Math.sqrt(magic);
  dLat = (dLat * 180.0) / ((a * (1 - ee)) / (magic * sqrtMagic) * Math.PI);
  dLon = (dLon * 180.0) / (a / sqrtMagic * Math.cos(radLat) * Math.PI);
  return { dLat, dLon };
}

function gcj02ToWgs84(lat, lon) {
  if (outOfChina(lat, lon)) return { lat, lon };
  const { dLat, dLon } = gcj02Delta(lat, lon);
  return { lat: lat - dLat, lon: lon - dLon };
}

// BD-09(百度地図)→ GCJ-02 変換(百度独自の追加オフセットを取り除く)
function bd09ToGcj02(lat, lon) {
  const xPi = Math.PI * 3000.0 / 180.0;
  const x = lon - 0.0065;
  const y = lat - 0.006;
  const z = Math.sqrt(x * x + y * y) - 0.00002 * Math.sin(y * xPi);
  const theta = Math.atan2(y, x) - 0.000003 * Math.cos(x * xPi);
  return { lat: z * Math.sin(theta), lon: z * Math.cos(theta) };
}

function bd09ToWgs84(lat, lon) {
  const gcj = bd09ToGcj02(lat, lon);
  return gcj02ToWgs84(gcj.lat, gcj.lon);
}

document.getElementById('searchBtn').addEventListener('click', () => {
  let lat = parseFloat(document.getElementById('searchLat').value);
  let lon = parseFloat(document.getElementById('searchLon').value);
  if (isNaN(lat) || isNaN(lon)) return;
  // 緯度は-90〜90の範囲しかありえない。範囲外なら経度と入れ替わっている可能性が高いので自動補正する
  // (百度地図など「経度,緯度」の順でコピーされるサイトからの貼り付けを想定)
  if ((lat < -90 || lat > 90) && lon >= -90 && lon <= 90) {
    [lat, lon] = [lon, lat];
  }
  const system = document.querySelector('input[name="coordSystem"]:checked').value;
  if (system === 'gcj02') {
    const converted = gcj02ToWgs84(lat, lon);
    lat = converted.lat; lon = converted.lon;
  } else if (system === 'bd09') {
    const converted = bd09ToWgs84(lat, lon);
    lat = converted.lat; lon = converted.lon;
  }
  queryPoint(lat, lon);
});

// 降雨のGumbelパラメータ(mu, beta)を最寄り地点から取得(rainfallReturnPeriodInfoと同じ検索ロジックだが、
// グローバルなrainfallSelectedWarmingに依存せず、4シナリオ分を一度に計算するために分離)
function rainfallGumbelParamsAt(lat, lon) {
  if (!rainfallGeojsonCacheGlobal) return null;
  let nearest = null, nearestDist = Infinity;
  rainfallGeojsonCacheGlobal.features.forEach(f => {
    const [flon, flat] = f.geometry.coordinates;
    if (!degBboxFilter(lat, lon, flat, flon, 150)) return;
    const d = haversineKm(lat, lon, flat, flon);
    if (d < nearestDist) { nearestDist = d; nearest = f.properties || {}; }
  });
  if (!nearest || typeof nearest.gumbel_mu !== 'number' || typeof nearest.gumbel_beta !== 'number') return null;
  return { mu: nearest.gumbel_mu, beta: nearest.gumbel_beta, yearsUsed: nearest.years_used };
}

const TIER_LABELS_RPT = ['Low', 'Moderate', 'High', 'Severe', 'Extreme'];

// 1地点分の4ハザード+降雨曲線+標高地形データをまとめて計算する(activeLayersに依存しない)
async function computeReportData(lat, lon) {
  const dLat = metersToDegLat(SEARCH_RADIUS_M);
  const dLon = metersToDegLon(SEARCH_RADIUS_M, lat);
  const locations = [{ latitude: lat, longitude: lon }];
  DIRS.forEach(d => locations.push({ latitude: lat + d.dLat * dLat, longitude: lon + d.dLon * dLon }));
  const reportBlock = await loadElevationBlock(lat, lon, 30);
  let elevations = await elevationsFromTiles(reportBlock, locations);
  if (!elevations) elevations = await fetchElevations(locations);
  const centerElev = elevations[0];

  // 地点検索と同じ3機構モデルで評価する。窪み係数は21x21グリッドの標高分布から求める。
  const reportGrid = [];
  // 3D地形図にも同じ格子を使う。Plotlyのsurfaceは z[y][x] の2次元配列を取るため、
  // 行(y)=南北、列(x)=東西 として組み立てる。北を上にするので i は降順に積む。
  const terrainRows = [];
  if (reportBlock && reportBlock.ok) {
    const cellDLatR = metersToDegLat(GRID_CELL_M);
    for (let i = -GRID_STEPS; i <= GRID_STEPS; i++) {
      const cellLat = lat + i * cellDLatR;
      const cellDLonR = metersToDegLon(GRID_CELL_M, cellLat);
      const row = [];
      for (let j = -GRID_STEPS; j <= GRID_STEPS; j++) {
        const v = reportBlock.get(cellLat, lon + j * cellDLonR);
        reportGrid.push(v);
        row.push(typeof v === 'number' ? v : null);
      }
      terrainRows.push(row);
    }
  }
  // 3D地形図は、窪み係数の評価範囲と同じ 7x7(±3マス、約1.05km四方)に切り出す。
  // 図と判定根拠の範囲を一致させることで、「この地形から窪み度を判定した」と説明できる。
  // (地点検索の21x21グリッド表示は従来どおり3.15km四方のまま)
  const terrainAxis = [];
  for (let k = -DEPRESSION_HALF; k <= DEPRESSION_HALF; k++) terrainAxis.push(k * GRID_CELL_M);
  const terrainSub = terrainRows.length
    ? terrainRows
        .slice(GRID_STEPS - DEPRESSION_HALF, GRID_STEPS + DEPRESSION_HALF + 1)
        .map(row => row.slice(GRID_STEPS - DEPRESSION_HALF, GRID_STEPS + DEPRESSION_HALF + 1))
    : [];
  const terrain = terrainSub.length ? { z: terrainSub, axis: terrainAxis } : null;
  const reportDepression = depressionFactor(centerElev,
    subGridAround(reportGrid, GRID_STEPS * 2 + 1, GRID_STEPS, GRID_STEPS, DEPRESSION_HALF));
  const reportDepLabel = depressionFactorLabel(reportDepression);
  const reportRain = rainfallIntensityScore(lat, lon);
  const reportPluvial = reportRain === null ? null : Math.max(0, Math.min(1, reportRain * reportDepression.factor));
  const reportFluvial = fluvialScoreAt(lat, lon, reportBlock && reportBlock.ok ? reportBlock.get : null, centerElev);
  const reportSurge = surgeScoreAt(lat, lon, centerElev);
  const reportCombined = combineWaterHazard(reportFluvial, reportPluvial, reportSurge);

  let water;
  if (!reportCombined) {
    water = {
      label: reportRain === null && riverSpatialIndex && coastlinePointsIndex
        ? 'No rainfall data (outside CHIRPS coverage)'
        : 'Water hazard not evaluated (data unavailable)',
      color: NO_DATA_COLOR, colors: WARNING_TIER_COLORS, ratio: null,
    };
  } else {
    const weight = floodWeightAt(lat, lon);
    const finalRisk = Math.min(1.0, reportCombined.base * weight);
    const tier = Math.min(4, Math.max(0, Math.ceil(finalRisk * 5) - 1));
    // 【2026年9月追加】レポートの表紙スコアは従来どおり現在気候のまま。
    // 参考として、4シナリオ(Current/+1.5/+2/+3℃)分をまとめてレポートに載せる。
    const byScenario = waterHazardByScenario(lat, lon, reportFluvial, reportSurge, reportDepression, weight, TIER_LABELS_RPT);
    water = {
      label: `${TIER_LABELS_RPT[tier]} water hazard (${finalRisk.toFixed(2)})`,
      color: WARNING_TIER_COLORS[tier], colors: WARNING_TIER_COLORS, ratio: finalRisk,
      dominant: reportCombined.dominant,
      caveat: waterCaveatText(reportCombined.missing),
      byScenario,
    };
  }

  const eqInfo = earthquakeRiskInfo(lat, lon);
  const earthquake = eqInfo
    ? { label: `${TIER_LABELS_RPT[eqInfo.tier]} earthquake hazard (${eqInfo.valueLabel})`, color: eqInfo.color, colors: EARTHQUAKE_TIER_COLORS, ratio: eqInfo.ratio }
    : { label: 'No M5.0+ earthquake within 100km', color: NO_DATA_COLOR, colors: EARTHQUAKE_TIER_COLORS, ratio: null };

  const tyInfo = typhoonRiskInfo(lat, lon);
  const tyFreq = typhoonReturnPeriodInfo(lat, lon);
  const typhoon = tyInfo
    ? { label: `${TYPHOON_TIER_LABELS[tyInfo.tier]} hazard (${tyInfo.valueLabel})`, color: tyInfo.color, colors: TYPHOON_TIER_COLORS, labels: TYPHOON_TIER_LABELS, ratio: tyInfo.ratio, freq: tyFreq }
    : { label: typhoonNoDataLabel(), color: NO_DATA_COLOR, colors: TYPHOON_TIER_COLORS, labels: TYPHOON_TIER_LABELS, ratio: null, freq: tyFreq };

  const ltInfo = lightningRiskInfo(lat, lon);
  const lightning = ltInfo
    ? { label: `${TIER_LABELS_RPT[ltInfo.tier]} lightning hazard (${ltInfo.valueLabel})`, color: ltInfo.color, colors: WARNING_TIER_COLORS, ratio: ltInfo.ratio }
    : { label: 'No significant lightning density nearby', color: NO_DATA_COLOR, colors: WARNING_TIER_COLORS, ratio: null };

  // 降雨再現期間: Current/+1.5/+2/+3℃の4シナリオをまとめて計算(グラフ用)
  const gumbel = rainfallGumbelParamsAt(lat, lon);
  let rainfallCurves = null;
  if (gumbel) {
    rainfallCurves = RAINFALL_WARMING_SCENARIOS.map(w => {
      const ccFactor = 1 + (RAINFALL_CC_PCT_PER_DEG / 100) * w;
      return {
        warming: w,
        values: RAINFALL_RETURN_PERIODS_YR.map(T => (gumbel.mu - gumbel.beta * Math.log(-Math.log(1 - 1 / T))) * ccFactor),
      };
    });
  }

  // 複合ハザード: 4ハザードの最大値。平均や重み付き和にしないのは、重みに根拠が無いため。
  // また地震(稀・全損もあり得る)と雷(高頻度・小損害)は損失の起き方が異なり、
  // 平均すると「他が低いから薄まる」という誤った緩和が起きる。
  const perilList = [
    { key: 'earthquake', label: 'Earthquake', ratio: earthquake.ratio },
    { key: 'typhoon', label: 'Typhoon', ratio: typhoon.ratio },
    { key: 'lightning', label: 'Lightning', ratio: lightning.ratio },
    { key: 'water', label: 'Water', ratio: water.ratio },
  ];
  const scored = perilList.filter(x => typeof x.ratio === 'number' && !isNaN(x.ratio));
  let overall = null;
  if (scored.length > 0) {
    let top = scored[0];
    scored.forEach(x => { if (x.ratio > top.ratio) top = x; });
    // 同率1位が複数ある場合は全て挙げる。max()を採る方式では珍しくなく、
    // 1つだけ表示すると「他は下位」という誤った印象を与えるため。
    // 表示上の丸め(小数第2位)と一致させるので、0.999と1.000のような差では並記しない。
    const drivers = scored.filter(x => Math.abs(x.ratio - top.ratio) < 0.005).map(x => x.label);
    const tier = Math.min(4, Math.max(0, Math.ceil(top.ratio * 5) - 1));
    overall = {
      ratio: top.ratio,
      tier,
      label: TIER_LABELS_RPT[tier],
      drivenBy: drivers.length > 1
        ? `${drivers.slice(0, -1).join(', ')} and ${drivers[drivers.length - 1]}`
        : drivers[0],
      driverCount: drivers.length,
      colors: WARNING_TIER_COLORS,
      color: WARNING_TIER_COLORS[tier],
      breakdown: perilList,
    };
  }

  // 降雨の「現在の水準」: Gumbel分布の平均値 = mu + 0.5772 * beta。
  // これは観測期間における「年最大24時間降水量の平均」に一致するため、
  // 再現期間の外挿値に対する基準として提示する。
  const rainfallTypical = gumbel ? gumbel.mu + 0.5772157 * gumbel.beta : null;

  return { centerElev, depLabel: reportDepLabel, water, earthquake, typhoon, lightning,
    rainfallCurves, rainfallTypical, overall, terrain,
    yearsUsed: gumbel ? gumbel.yearsUsed : null };
}

function rptLegendBar(colors, ratio) {
  const useColors = colors || WARNING_TIER_COLORS;
  const grad = useColors.map((c, i) => `${c} ${(i / (useColors.length - 1) * 100).toFixed(0)}%`).join(', ');
  const hasMarker = typeof ratio === 'number' && !isNaN(ratio);
  const pct = hasMarker ? Math.min(99, Math.max(1, ratio * 100)) : 0;
  return `<div class="rpt-bar-wrap" style="background:linear-gradient(to right, ${grad});">
    ${hasMarker ? `<div class="rpt-bar-marker" style="left:${pct.toFixed(1)}%;">▽</div>` : ''}
  </div>`;
}

function rptBadgeColors(hexColor) {
  // バッジの背景はハザード色の薄いトーン、文字は同系統の濃い色にする(簡易変換)
  return { bg: hexColor + '22', text: hexColor };
}

async function loadScriptOnce(src) {
  if (document.querySelector(`script[src="${src}"]`)) return;
  await new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = src; s.onload = resolve; s.onerror = reject;
    document.head.appendChild(s);
  });
}

async function generateIntegratedReport() {
  const btn = document.getElementById('reportGenerateBtn');
  const status = document.getElementById('reportStatus');
  const validLocs = reportLocations.filter(l => l.lat !== '' && l.lon !== '');
  if (validLocs.length === 0) { status.textContent = 'Enter at least one location.'; return; }
  btn.disabled = true;
  status.textContent = 'Computing hazard data…';

  const system = document.querySelector('input[name="reportCoordSystem"]:checked').value;

  try {
    await loadScriptOnce('https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js');
    await loadScriptOnce('https://cdnjs.cloudflare.com/ajax/libs/plotly.js/2.27.0/plotly.min.js');
    await loadScriptOnce('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js');
    await loadScriptOnce('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js');

    const results = [];
    for (const loc of validLocs) {
      let lat = parseFloat(loc.lat), lon = parseFloat(loc.lon);
      if (isNaN(lat) || isNaN(lon)) continue;
      if ((lat < -90 || lat > 90) && lon >= -90 && lon <= 90) [lat, lon] = [lon, lat];
      if (system === 'gcj02') { const c = gcj02ToWgs84(lat, lon); lat = c.lat; lon = c.lon; }
      else if (system === 'bd09') { const c = bd09ToWgs84(lat, lon); lat = c.lat; lon = c.lon; }
      const data = await computeReportData(lat, lon);
      results.push({ name: loc.name || `${lat.toFixed(4)}, ${lon.toFixed(4)}`, lat, lon, data });
    }

    if (results.length === 0) { status.textContent = 'No valid coordinates entered.'; btn.disabled = false; return; }

    status.textContent = 'Rendering charts…';
    await renderReportView(results);

    status.textContent = 'Building PDF…';
    const { jsPDF } = window.jspdf;
    let pdf = null;
    const pages = document.querySelectorAll('#reportView .rpt-page');
    for (let i = 0; i < pages.length; i++) {
      // scale:2 で高解像度化。各拠点1ページぶんの全内容を、改ページなしで1枚の縦長ページに収める
      const canvas = await html2canvas(pages[i], { scale: 2, backgroundColor: '#ffffff', useCORS: true });
      const imgData = canvas.toDataURL('image/png');
      const pageWidthMm = 210; // A4幅に合わせ、縦は内容量に応じて可変(1枚に収める)
      const pageHeightMm = canvas.height * (pageWidthMm / canvas.width);
      if (!pdf) {
        pdf = new jsPDF({ unit: 'mm', format: [pageWidthMm, pageHeightMm] });
      } else {
        pdf.addPage([pageWidthMm, pageHeightMm]);
      }
      pdf.addImage(imgData, 'PNG', 0, 0, pageWidthMm, pageHeightMm);
    }
    pdf.save(`hazard-report-${new Date().toISOString().slice(0, 10)}.pdf`);

    document.getElementById('reportView').innerHTML = '';
    status.textContent = 'PDF downloaded.';
    btn.disabled = false;
  } catch (e) {
    console.error(e);
    status.textContent = 'Failed to generate report. Please try again.';
    btn.disabled = false;
  }
}

    return `

  view.innerHTML = summaryHtml + results.map((r, i) => `
    <div class="rpt-page">
      ${rptHead()}
      <div class="rpt-loc-name">${escapeHtml(r.name)}</div>

      <div class="rpt-section">
        <div class="rpt-h">Typhoon</div>
        <div class="rpt-desc">${HAZARD_DESCRIPTIONS.typhoon}</div>
        ${rptLegendBar(r.data.typhoon.colors, r.data.typhoon.ratio)}
        <span class="rpt-badge" style="background:${rptBadgeColors(r.data.typhoon.color).bg}; color:${rptBadgeColors(r.data.typhoon.color).text};">${r.data.typhoon.label}</span>
        ${r.data.typhoon.freq && r.data.typhoon.freq.observed ? `<div class="rpt-comment">Category 1+ passages occur on average once every ~${r.data.typhoon.freq.returnPeriod.toFixed(1)} years, based on ${r.data.typhoon.freq.totalYears} years of track data.</div>` : ''}
      </div>

      <div class="rpt-section">
        <div class="rpt-h">Lightning</div>
        <div class="rpt-desc">${HAZARD_DESCRIPTIONS.lightning}</div>
        ${rptLegendBar(r.data.lightning.colors, r.data.lightning.ratio)}
        <span class="rpt-badge" style="background:${rptBadgeColors(r.data.lightning.color).bg}; color:${rptBadgeColors(r.data.lightning.color).text};">${r.data.lightning.label}</span>
      </div>

      <div class="rpt-section">
        <div class="rpt-h">Water hazard</div>
        <div class="rpt-desc">${HAZARD_DESCRIPTIONS.water}</div>
        ${rptLegendBar(r.data.water.colors, r.data.water.ratio)}
        <span class="rpt-badge" style="background:${rptBadgeColors(r.data.water.color).bg}; color:${rptBadgeColors(r.data.water.color).text};">${r.data.water.label}</span>
        ${r.data.water.dominant ? `<div class="rpt-comment">Dominant mechanism at this location: <b>${r.data.water.dominant}</b>.</div>` : ''}
        ${r.data.water.caveat ? `<div class="rpt-comment" style="color:#C13A2E;font-weight:700;">${r.data.water.caveat}</div>` : ''}
        ${r.data.water.byScenario ? `
        <div class="rpt-kv" style="margin-top:8px;">
          ${r.data.water.byScenario.map(sc => `
            <div class="rpt-kv-item">

              <div class="rpt-kv-v">${sc.finalRisk === null ? 'n/a' : sc.finalRisk.toFixed(2)}</div>

          <div class="rpt-desc" style="margin-top:2px;">

          </div>
          <div style="margin:10px 0 4px;"><canvas id="rptChart${i}" width="640" height="220"></canvas></div>
          <div style="display:flex; flex-wrap:wrap; gap:12px; font-size:9.5px; color:#52514e;">
            ${RAINFALL_WARMING_SCENARIOS.map((w, wi) => `
            <span><span style="display:inline-block;width:8px;height:8px;background:${CURVE_COLORS_RPT[wi]};border-radius:2px;margin-right:4px;"></span>${w === 0 ? 'Current' : '+' + w + '°C'}</span>`).join('')}
          </div>

        <div style="margin-top:16px;">
          <div class="rpt-h" style="font-size:9.5px;">Terrain around the site (approx. 1.05km)</div>

            </div>
          </div>
          <div class="rpt-desc" style="margin-top:2px;">${r.data.depLabel.text}, considering the surrounding ~1.05km (roughly 450m in each direction from the site) — factored into the surface water flooding score above.</div>
          <div id="rptTerrain${i}" style="width:100%; height:230px;"></div>
        </div>
      </div>

      ${rptFooter}
    </div>
  `).join('');

  await Promise.all(results.map((r, i) => new Promise((resolveLoc) => {
    const tasks = [];
    if (r.data.rainfallCurves) {
      tasks.push(new Promise((resolveChart) => {
        const canvas = document.getElementById(`rptChart${i}`);
        const colors = CURVE_COLORS_RPT;
        new Chart(canvas, {
          type: 'line',
          data: {
            labels: RAINFALL_RETURN_PERIODS_YR.map(T => `${T}yr`),
            datasets: r.data.rainfallCurves.map((c, ci) => ({
              data: c.values, borderColor: colors[ci], backgroundColor: 'transparent', tension: 0.35, pointRadius: 2,
            })),
          },
          options: {
            responsive: false, animation: { onComplete: () => resolveChart() },
            plugins: { legend: { display: false }, tooltip: { enabled: false } },
            scales: {
              y: { title: { display: true, text: 'mm', color: '#898781', font: { size: 10 } }, ticks: { color: '#898781', font: { size: 10 } }, grid: { color: '#e1e0d9' } },
              x: { title: { display: true, text: 'return period', color: '#898781', font: { size: 10 } }, ticks: { color: '#898781', font: { size: 10 } }, grid: { display: false } },
            },
          },
        });
      }));
    }

    // 標高地形: 中心+周囲8方向(実測9点)を3x3グリッドとしてプロット(補間はしない)
    // 【2026年9月改訂】従来は中心+8方向のわずか9点(±100m)で描いており、
    // 150mタイルの1画素より狭い範囲だったため凹凸がほとんど表現できなかった。
    // 窪み係数の計算に使う21x21グリッド(±1.5km、441点)をそのまま流用して解像度を上げる。
    const terrainDiv = document.getElementById(`rptTerrain${i}`);
    const tr = r.data.terrain;
    const z = tr ? tr.z : [[r.data.centerElev]];
    const axis = tr ? tr.axis : [0];
    const flat = z.flat().filter(v => typeof v === 'number');
    const zMin = Math.min(...flat), zMax = Math.max(...flat);
    const zSpan = Math.max(1, zMax - zMin);
    // 検索地点(中心=0,0)がどこかひと目でわかるよう、地表面より少し浮かせたマーカーを重ねる
    const centerMarkerZ = r.data.centerElev + zSpan * 0.12;
    tasks.push(
      Plotly.newPlot(terrainDiv, [{
        z, x: axis, y: axis, type: 'surface', showscale: true,
        colorscale: [[0, '#185FA5'], [0.35, '#1D9E75'], [0.6, '#FAC775'], [0.8, '#D85A30'], [1, '#791F1F']],
        // 等高線を面に焼き込むと、数mしかない緩やかな起伏でも形が読み取れる
        contours: { z: { show: true, usecolormap: false, color: '#00000033', width: 1, project: { z: false } } },
        lighting: { ambient: 0.75, diffuse: 0.8, specular: 0.08, roughness: 0.9 },
        lightposition: { x: -1000, y: 1000, z: 3000 },
        colorbar: { title: { text: 'elevation (m)', side: 'right', font: { size: 10, color: '#52514e' } }, tickfont: { size: 9, color: '#898781' }, thickness: 12, len: 0.7 },
      }, {
        type: 'scatter3d', mode: 'markers+text', x: [0], y: [0], z: [centerMarkerZ],
        text: ['Search point'], textposition: 'top center',
        textfont: { size: 10, color: '#0b0b0b' },
        marker: { size: 6, color: '#0b0b0b', symbol: 'diamond', line: { color: '#ffffff', width: 1.5 } },
        showlegend: false, hoverinfo: 'skip',
      }], {
        margin: { l: 0, r: 0, t: 0, b: 0 },
        scene: {
          xaxis: { title: { text: 'E–W (m)', font: { size: 9, color: '#898781' } }, tickfont: { size: 8, color: '#898781' }, gridcolor: '#e1e0d9' },
          yaxis: { title: { text: 'N–S (m)', font: { size: 9, color: '#898781' } }, tickfont: { size: 8, color: '#898781' }, gridcolor: '#e1e0d9' },
          zaxis: { title: { text: 'elevation (m)', font: { size: 9, color: '#898781' } }, tickfont: { size: 8, color: '#898781' }, range: [zMin - zSpan * 0.08, zMax + zSpan * 0.20] },
          // 水平3.15kmに対し標高差が数mしかない地点では、実スケールだと完全に平らに見える。
          // 縦横比を固定して、起伏が常に箱の高さの一定割合を占めるようにする(誇張表示)。
          aspectmode: 'manual', aspectratio: { x: 1, y: 1, z: 0.42 },
          camera: { eye: { x: 1.5, y: -1.5, z: 1.1 } },
        },
        paper_bgcolor: '#ffffff', plot_bgcolor: '#ffffff',
      }, { displayModeBar: false, responsive: false })
        // html2canvas/印刷はWebGLキャンバスを正しく捕捉できないことがあるため、
        // Plotly自身の画像書き出しAPIで静止画に変換し、<img>に差し替えて確実にPDFへ焼き込む
        .then(() => Plotly.toImage(terrainDiv, { format: 'png', width: terrainDiv.clientWidth * 2, height: 230 * 2 }))
        .then(dataUrl => {
          const img = document.createElement('img');
          img.src = dataUrl;
          img.style.width = '100%';
          img.style.height = '230px';
          img.style.display = 'block';
          terrainDiv.replaceWith(img);
        })
    );

    Promise.all(tasks).then(resolveLoc);
  })));
}

// 地図タップは、以前はシングルタップで即検索していたが、地図を軽くタップ/パンする操作と
// 誤操作しやすいため、長押し(500ms)専用に変更した。
//
// 【バグ修正 2026年8月・その2】当初はLeafletの'mousedown'イベントでタイマーを開始して
// いたが、スマホでは全く動作しなかった。原因は、タッチ操作の「互換mousedownイベント」は
// 指を触れた瞬間ではなく指を離した瞬間(touchend後)に初めて発火するため、押している間は
// 一切発火せず、長押しの検知が原理的に不可能だったこと。native の touchstart/touchmove/
// touchend を直接使う方式に変更し、押した瞬間から正しくタイマーを開始できるようにした。
//
// 【バグ修正 2026年8月・その3】その際、指のブレでLeaflet自身のパンが先に始まってしまう
// のを防ごうとdragging機能を一時的に無効化していたが、これが原因で通常の1本指パンその
// ものが機能しなくなった(touchstartの瞬間に毎回パンを止めてしまうため、Leaflet側が
// ドラッグ開始を検知できなかった。2本指の場合はこの無効化処理を通らないため無事だった)。
// dragging.disable/enableは撤去し、自前の移動量チェック(10px)とLeafletの'dragstart'/
// 'zoomstart'イベントの両方で長押し判定をキャンセルする、素直な方式に戻した。
const LONG_PRESS_MS = 500;
const LONG_PRESS_MOVE_TOLERANCE_PX = 10;
let longPressTimer = null;
let longPressStartPoint = null;

function cancelLongPress() {
  if (longPressTimer) { clearTimeout(longPressTimer); longPressTimer = null; }
  longPressStartPoint = null;
}

function startLongPress(evt) {
  const containerPoint = map.mouseEventToContainerPoint(evt);
  const latlng = map.containerPointToLatLng(containerPoint);
  longPressStartPoint = containerPoint;
  clearTimeout(longPressTimer);
  longPressTimer = setTimeout(() => {
    longPressTimer = null;
    document.getElementById('searchLat').value = latlng.lat.toFixed(4);
    document.getElementById('searchLon').value = latlng.lng.toFixed(4);
    queryPoint(latlng.lat, latlng.lng);
    if (navigator.vibrate) navigator.vibrate(10); // 長押しが認識されたことを伝える軽い振動(対応端末のみ)
  }, LONG_PRESS_MS);
}

function moveLongPress(evt) {
  if (!longPressTimer || !longPressStartPoint) return;
  const pt = map.mouseEventToContainerPoint(evt);
  if (pt.distanceTo(longPressStartPoint) > LONG_PRESS_MOVE_TOLERANCE_PX) cancelLongPress();
}

const mapContainer = map.getContainer();

// タッチ操作(スマホ): touchstartは指を触れた瞬間に発火するため、ここでタイマーを開始する
mapContainer.addEventListener('touchstart', (e) => {
  if (e.touches.length !== 1) { cancelLongPress(); return; } // 2本指以降(ピンチ操作等)は対象外
  e.preventDefault(); // OS標準の長押しメニューを抑止し、後続の合成mousedownの重複発火も防ぐ
  startLongPress(e.touches[0]);
}, { passive: false });
mapContainer.addEventListener('touchmove', (e) => {
  if (e.touches.length !== 1) return;
  moveLongPress(e.touches[0]);
}, { passive: true });
mapContainer.addEventListener('touchend', cancelLongPress, { passive: true });
mapContainer.addEventListener('touchcancel', cancelLongPress, { passive: true });

// マウス操作(PC): mousedownは押した瞬間に発火するため、そのまま使える
mapContainer.addEventListener('mousedown', startLongPress);
mapContainer.addEventListener('mousemove', moveLongPress);
mapContainer.addEventListener('mouseup', cancelLongPress);

// 実際にLeaflet側でパン/ズームが始まった場合も、念のため長押し判定を確実にキャンセルする
map.on('dragstart zoomstart', cancelLongPress);

// ブラウザの右クリックメニュー(PC)が独自の長押し検索と競合しないよう抑止する
mapContainer.addEventListener('contextmenu', (e) => e.preventDefault());

// ============================================================
// ログインゲート(2026年9月追加)
// 【重要】これは静的サイト向けの簡易的な閲覧制限であり、本格的なアクセス制御ではない。
// ページのソースを直接読める人には効果が無い(パスワードそのものではなく
// SHA-256ハッシュを埋め込んでいるが、ハッシュ自体も総当たりで破られ得る)。
// 「知らない人が偶然URLを開いて閲覧してしまう」ことを防ぐ程度の位置づけ。
// 本格的な保護が必要な場合はCloudflare Access等、サーバー側の仕組みを検討すること。
//
// 初期認証情報: ID=msichina / Password=msichina
// 変更する場合は、新しい「id:password」文字列のSHA-256を計算し、
// LOGIN_HASH を差し替える(ブラウザのコンソールで以下を実行すると得られる):
//   crypto.subtle.digest('SHA-256', new TextEncoder().encode('新ID:新パスワード'))
//     .then(b => console.log([...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')))
// ============================================================
const LOGIN_HASH = '86c8a40a47fda90ba216685c709760cbb66836da2a351e7ffe969d51a7a6937c';
const LOGIN_STORAGE_KEY = 'chinaHazardMapAuthed_v1';
// 【2026年9月】crypto.subtleはHTTPS(またはlocalhost)でしか使えず、index.htmlを
// file://として直接プレビューすると undefined になる。GitHub Pages(https)では
// 問題ないが、手元でファイルを直接開いて確認する場合にログインできず「何も
// 起きない」ように見えるため、その場合だけ平文比較にフォールバックする。
const LOGIN_ID_FALLBACK = 'msichina';
const LOGIN_PW_FALLBACK = 'msichina';

async function sha256Hex(text) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
  return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, '0')).join('');
}

function hasSecureCrypto() {
  return typeof crypto !== 'undefined' && crypto.subtle && typeof crypto.subtle.digest === 'function';
}

function unlockApp() {
  const gate = document.getElementById('loginGate');
  gate.classList.add('hidden');
  document.body.style.overflow = '';
}

(function initLoginGate() {
  const gate = document.getElementById('loginGate');
  const form = document.getElementById('loginForm');
  const idInput = document.getElementById('loginId');
  const pwInput = document.getElementById('loginPw');
  const errorEl = document.getElementById('loginError');
  const yearEl = document.getElementById('loginYear');
  if (yearEl) yearEl.textContent = new Date().getFullYear();

  // 前回ログイン済みならスキップ(ブラウザ・端末ごとに記憶。共有PCでは注意)
  try {
    if (localStorage.getItem(LOGIN_STORAGE_KEY) === '1') {
      unlockApp();
      return;
    }
  } catch (e) { /* localStorage不可の環境ではスキップせず毎回ログインを求める */ }

  document.body.style.overflow = 'hidden';
  setTimeout(() => idInput && idInput.focus(), 350);

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const id = idInput.value.trim();
    const pw = pwInput.value;

    let matched;
    if (hasSecureCrypto()) {
      const hash = await sha256Hex(`${id}:${pw}`);
      matched = (hash === LOGIN_HASH);
    } else {
      // file://などの非セキュアコンテキスト用フォールバック(平文比較)。
      console.warn('crypto.subtleが使えない環境(file://など)のため、簡易的な平文比較でログイン判定しています。');
      matched = (id === LOGIN_ID_FALLBACK && pw === LOGIN_PW_FALLBACK);
    }

    if (matched) {
      try { localStorage.setItem(LOGIN_STORAGE_KEY, '1'); } catch (e) { /* 記憶できなくても閲覧は許可する */ }
      unlockApp();
    } else {
      const card = form; // .login-card
      errorEl.classList.add('show');
      card.classList.remove('shake');
      void card.offsetWidth; // reflow強制でアニメーションを再トリガー
      card.classList.add('shake');
      pwInput.value = '';
      pwInput.focus();
    }
  });
})();
