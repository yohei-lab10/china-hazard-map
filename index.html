async function loadLightning() {
  const geojson = await fetchGeojsonSafe('data/lightning.geojson');
  if (!geojson) return;
  lightningGeojsonCacheGlobal = geojson;
  // risk(0〜1)を重みとして使い、密度に応じたグラデーションで表示する(HAZARD_GRADIENTは既存の
  // 緑→黄→赤のリスク強度グラデーションを他レイヤーと共通で使い回している)
  const heatPoints = geojson.features
    .map(f => {
      const [lon, lat] = f.geometry.coordinates;
      const risk = f.properties?.risk;
      return typeof risk === 'number' ? [lat, lon, risk] : null;
    })
    .filter(Boolean);
  const heat = L.heatLayer(heatPoints, { radius: 26, blur: 22, maxZoom: 8, max: 1.0, gradient: HAZARD_GRADIENT });
  heat.addTo(layerGroups.lightning);
}

async function fetchGeojsonSafe(path) {
  try {
    const res = await fetch(path);
    if (!res.ok) return null;
    const geojson = await res.json();
    if (!geojson.features || geojson.features.length === 0) return null;
    return geojson;
  } catch (e) {
    return null;
  }
}

// HAZARD_GRADIENTの色停止点(0/0.25/0.5/0.75/1.0)の間を線形補間して、weight(0〜1)に対応する
// 1色を返す。台風の軌跡を線(ポリライン)で描くために使う(ヒートマップの色と統一するため)。
const HAZARD_GRADIENT_STOPS = [
  [0.0, [0xD9, 0xA2, 0x2C]], [0.25, [0xD9, 0x72, 0x2C]], [0.5, [0xC1, 0x3A, 0x2E]],
  [0.75, [0x7A, 0x3B, 0x8C]], [1.0, [0x1A, 0x21, 0x30]],
];
function colorForWeight(w) {
  const cw = Math.max(0, Math.min(1, w));
  for (let i = 0; i < HAZARD_GRADIENT_STOPS.length - 1; i++) {
    const [t0, c0] = HAZARD_GRADIENT_STOPS[i], [t1, c1] = HAZARD_GRADIENT_STOPS[i + 1];
    if (cw >= t0 && cw <= t1) {
      const t = (cw - t0) / (t1 - t0);
      const r = Math.round(c0[0] + (c1[0] - c0[0]) * t);
      const g = Math.round(c0[1] + (c1[1] - c0[1]) * t);
      const b = Math.round(c0[2] + (c1[2] - c0[2]) * t);
      return `rgb(${r},${g},${b})`;
    }
  }
  return '#1A2130';
}

// inLandBbox(陸地・沿岸のみ表示)でフィルタすると軌跡の一部が虫食いになるため、
// 連続してtrueな区間だけをひとつながりの線として切り出す(そうしないと海上の空白を
// 直線でショートカットしてしまい、不自然な線になる)。items内の各要素はpredicateで
// 判定できる値を持つオブジェクトであればよい(座標に限らない汎用ヘルパー)。
function splitContiguousRuns(items, predicate) {
  const runs = [];
  let current = [];
  items.forEach(item => {
    if (predicate(item)) {
      current.push(item);
    } else {
      if (current.length >= 2) runs.push(current);
      current = [];
    }
  });
  if (current.length >= 2) runs.push(current);
  return runs;
}

// 台風の軌跡はポリライン(線)で描画する。以前はcircle(暴風域バッファ)+polylineの
// 半透明な重ね描きだったが、沿岸部のように何十本もの台風の軌跡が同じ場所を通ると、
// 半透明図形の不透明度が積み重なってべったり単色に潰れる問題があった。その後
// L.heatLayer(ヒートマップ)化も試したが、これは「通過本数が多いほど濃くなる」
// 積算方式のため、弱い台風が何本も通っただけの場所が強く見えてしまい、
// 「その場所を通った最も強い台風で評価したい」という意図とズレていた。
// 現在は、区間(ratio)の弱い順に不透明(opacity:1)なポリラインを描画し、
// 強い区間ほど後(=上)に描く方式にしている。同じ場所を複数の軌跡が通っても
// 不透明度は加算されず、単純に一番強い区間の色が最前面に残る(=最大値評価)。
//
// 同じ台風の中でも発達・衰弱で色が変わるよう、区間(2地点間)ごとに、その両端の風速の
// 平均で色を決める。階級はJMA(気象庁)の台風強さ階級を採用している(下記改訂その8参照)。
// 【2026年8月改訂・その8】このサイトのwinds_ktは、実データ検証(Typhoon Meranti 2016の
// 実測値との照合)により、JMA(気象庁、10分間平均風速)方式であることが判明した。
// 以前使っていたSaffir-Simpson基準(64/83/96/114/136kt)は米国JTWC方式(1分間平均)を
// 前提に作られており、同じ数値でも1分間平均は10分間平均よりおよそ12〜14%高く出るため、
// 単純に当てはめると実際の強さを過小評価してしまう(検証: Meranti実測120kt→旧基準では
// Category4止まりだが、1分間平均換算では約137ktでCategory5相当)。
// データの出典(JMA)に合わせ、JMA自身の階級基準に切り替えた。
// 17.2m/s(台風)・33m/s(強い台風)・44m/s(非常に強い台風)・54m/s(猛烈な台風)をkt換算。
// 下限34ktはr34_km(34kt到達半径)の定義そのものと一致するため、区間の帯の外縁=r34と
// なり、計算が単純化される(距離補間が不要になる)という副次的な利点もある。
const TYPHOON_CATEGORY_BOUNDS_KT = [34, 64, 85, 105]; // JMA: 台風/強い台風/非常に強い台風/猛烈な台風
const TYPHOON_TIER_COLORS = ['#D9A22C', '#D9722C', '#C13A2E', '#1A2130']; // JMAの4階級専用(他ハザードの5階級とは別)
const TYPHOON_TIER_LABELS = ['Typhoon', 'Strong Typhoon', 'Very Strong Typhoon', 'Violent Typhoon']; // JMA英語表記
// 台風ごとの実際の暴風域半径(r34_km)がデータにある場合は、それを使って中心からの
// 線形補間で風速を推定する(2026年8月改訂: 台風によって暴風域の大きさが11〜581km、
// 中央値185kmと大きくばらつくため、一律の固定半径では小型で強い台風・大型で緩い台風を
// 区別できなかった)。r34_kmが無い地点・台風のみ、フォールバックとして固定半径で判定する。
const TYPHOON_FALLBACK_RADIUS_KM = 200; // r34_km欠損時のフォールバック(実データ中央値ベース)
const TYPHOON_PREFILTER_RADIUS_KM = 600; // 安価な絞り込み用(実データの最大r34=581kmをカバー)

// 2点(lat1,lon1)-(lat2,lon2)を結ぶ線分上で、指定地点(lat,lon)に最も近い点までの距離(km)と、
// その点が線分のどの位置(t=0で始点、t=1で終点)かを返す。
// 台風の観測点は6時間おきで、その間は移動速度によって100〜300km離れることもあり、
// 線分の"途中"では風速判定が行われていなかった(2026年8月改訂で対応)。
// 緯度経度を局所的に平面近似(観測点間隔は最大でも数百km程度のため、この近似で十分な精度)。
// 2点間の方位(度、真北=0、時計回り)を求める
function bearingDeg(lat1, lon1, lat2, lon2) {
  const φ1 = lat1 * Math.PI / 180, φ2 = lat2 * Math.PI / 180;
  const Δλ = (lon2 - lon1) * Math.PI / 180;
  const y = Math.sin(Δλ) * Math.cos(φ2);
  const x = Math.cos(φ1) * Math.sin(φ2) - Math.sin(φ1) * Math.cos(φ2) * Math.cos(Δλ);
  return (Math.atan2(y, x) * 180 / Math.PI + 360) % 360;
}

// 起点(lat,lon)から方位bearingDeg方向にdistKmだけ進んだ地点の緯度経度を求める(大圏航路)
function destinationPoint(lat, lon, bearingDegVal, distKm) {
  const R = 6371;
  const δ = distKm / R;
  const θ = bearingDegVal * Math.PI / 180;
  const φ1 = lat * Math.PI / 180, λ1 = lon * Math.PI / 180;
  const φ2 = Math.asin(Math.sin(φ1) * Math.cos(δ) + Math.cos(φ1) * Math.sin(δ) * Math.cos(θ));
  const λ2 = λ1 + Math.atan2(Math.sin(θ) * Math.sin(δ) * Math.cos(φ1), Math.cos(δ) - Math.sin(φ1) * Math.sin(φ2));
  return [φ2 * 180 / Math.PI, λ2 * 180 / Math.PI]; // [lat, lon]
}

function closestPointOnSegmentKm(lat, lon, lat1, lon1, lat2, lon2) {
  const latRad = (lat1 + lat2) / 2 * Math.PI / 180;
  const kx = 111.32 * Math.cos(latRad); // 経度1度あたりの距離(km、この緯度での近似)
  const ky = 110.57; // 緯度1度あたりの距離(km、ほぼ一定)
  const bx = (lon2 - lon1) * kx, by = (lat2 - lat1) * ky;
  const px = (lon - lon1) * kx, py = (lat - lat1) * ky;
  const abLenSq = bx * bx + by * by;
  let t = abLenSq > 0 ? (px * bx + py * by) / abLenSq : 0;
  t = Math.max(0, Math.min(1, t));
  const cLat = lat1 + t * (lat2 - lat1), cLon = lon1 + t * (lon2 - lon1);
  return { t, distKm: haversineKm(lat, lon, cLat, cLon) };
}

// 台風1個分のデータから、指定地点での推定風速(kt)の最大値を求める。
// 各時刻の地点ごとに、r34_kmがあれば「中心=その時刻の風速、r34地点=34kt」の線形補間、
// 無ければ固定半径(TYPHOON_FALLBACK_RADIUS_KM)内かどうかの二値判定にフォールバックする。
// 【2026年8月改訂・その2】上記は観測点(6時間おきの「点」)でしか評価しておらず、地図上に
// 描画される観測点間の直線(区間)上では一切評価されていなかった。観測点間隔が広い台風では、
// 地図上は線に近い/線上にあるのに「リスクなし」と判定される矛盾が生じていたため、
// 区間(2点間)も線分として扱い、区間上の最近接点までの距離で判定するよう拡張した。
// 【2026年8月改訂・その7】さらに、以前は地点検索側だけ「距離に応じて連続的に減衰」する
// モデルを使っており、レンダリング側(collectTyphoonSegments)の「区間ごとに一定の帯」
// というモデルと、そもそも前提が異なっていた。これでは両者が完全一致することは原理的に
// なく、細かな不一致(片方の観測点の欠損の扱いなど)が起きるたびに個別修正が必要になって
// いた。地点検索側も typhoonReachRadiusKm() による「帯の中にいるかどうか」の判定に統一し、
// 地図の帯とロジックレベルで完全に同じ計算を使うようにした。
function estimateStormWindAt(feature, lat, lon) {
  const coords = feature.geometry.coordinates;
  const windsKt = feature.properties?.winds_kt;
  const r34Km = feature.properties?.r34_km;
  const maxWind = feature.properties?.max_wind_kt;
  let best = null;
  let anyPointWind = false;

  // 各観測点の最低閾値到達半径(レンダリングのcatRadiusと完全に同じ計算)
  const catRadii = coords.map(([, ], i) => {
    const w = windsKt && typeof windsKt[i] === 'number' ? windsKt[i] : null;
    if (w !== null) anyPointWind = true;
    const hasR34 = !!(r34Km && typeof r34Km[i] === 'number' && r34Km[i] > 0);
    const r34raw = hasR34 ? r34Km[i] : TYPHOON_FALLBACK_RADIUS_KM;
    return { w, catR: typhoonReachRadiusKm(w, r34raw, hasR34) };
  });

  // (1) 観測点そのもの: 距離が観測点自身のcatRadius以内なら、その観測点の風速を採用
  coords.forEach(([flon, flat], i) => {
    if (!degBboxFilter(lat, lon, flat, flon, TYPHOON_PREFILTER_RADIUS_KM)) return;
    const { w, catR } = catRadii[i];
    if (w === null || catR <= 0) return;
    const dist = haversineKm(lat, lon, flat, flon);
    if (dist <= catR && (best === null || w > best)) best = w;
  });

  // (2) 観測点"間"(区間): レンダリングと同じく、区間の両端のcatRadiusを線形補間した
  // 「帯の幅」の中に入っているかどうかで判定する。風速側も同様に、両端の値が
  // 揃っていれば線形補間、片方だけならその値を区間全体の一定値として使う
  // (レンダリングのsegWindフォールバックと同じ規則)。
  for (let i = 0; i < coords.length - 1; i++) {
    const [flon1, flat1] = coords[i], [flon2, flat2] = coords[i + 1];
    if (!degBboxFilter(lat, lon, flat1, flon1, TYPHOON_PREFILTER_RADIUS_KM) &&
        !degBboxFilter(lat, lon, flat2, flon2, TYPHOON_PREFILTER_RADIUS_KM)) continue;
    const p1 = catRadii[i], p2 = catRadii[i + 1];
    if (p1.w === null && p2.w === null) continue; // 両方欠損なら評価不能
    const { t, distKm } = closestPointOnSegmentKm(lat, lon, flat1, flon1, flat2, flon2);
    const catT = p1.catR + t * (p2.catR - p1.catR); // 帯の幅をtで線形補間(レンダリングと同一)
    if (distKm > catT) continue; // 帯の外
    const wT = (p1.w !== null && p2.w !== null) ? p1.w + t * (p2.w - p1.w) : (p1.w !== null ? p1.w : p2.w);
    if (wT !== null && (best === null || wT > best)) best = wT;
  }

  // winds_kt自体が無い古い形式のデータ(台風全体で1つの最大風速のみ)は、固定半径のみで判定
  if (!anyPointWind && typeof maxWind === 'number') {
    const near = coords.some(([flon, flat]) => degBboxFilter(lat, lon, flat, flon, TYPHOON_FALLBACK_RADIUS_KM) && haversineKm(lat, lon, flat, flon) <= TYPHOON_FALLBACK_RADIUS_KM);
    if (near) best = maxWind;
  }
  return best;
}

// 全台風の中から、指定地点での推定風速(kt)の最大値を求める(=badge/タイル判定用)
function typhoonWindEstimateAt(lat, lon) {
  if (!typhoonGeojsonCacheGlobal) return null;
  let best = null;
  typhoonGeojsonCacheGlobal.features.forEach(f => {
    const w = estimateStormWindAt(f, lat, lon);
    if (w !== null && (best === null || w > best)) best = w;
  });
  return best;
}

// 風速(kt)をJMA階級のtier(0=台風〜3=猛烈な台風)とratio(0〜1、色のグラデーション用)に変換する。
// 最低階級(34kt)未満はnullを返す(=台風ハザードとして扱わない)。同じ階級内での強弱も
// なめらかに反映されるよう、次の階級境界に近いほどratioを1段階分の中で連続的に上げる
// (猛烈な台風は上限が無いため、目安として+30ktの幅で頭打ちにする。直前の階級幅
// (105-85=20kt)よりやや広めに取り、無限に強い台風でもratio=1に張り付き過ぎないようにした)。
function typhoonWindToTierRatio(windKt) {
  const n = TYPHOON_CATEGORY_BOUNDS_KT.length;
  if (typeof windKt !== 'number' || windKt < TYPHOON_CATEGORY_BOUNDS_KT[0]) return null;
  let tier = 0;
  for (let i = 1; i < n; i++) {
    if (windKt >= TYPHOON_CATEGORY_BOUNDS_KT[i]) tier = i;
  }
  const lower = TYPHOON_CATEGORY_BOUNDS_KT[tier];
  const upper = tier < n - 1 ? TYPHOON_CATEGORY_BOUNDS_KT[tier + 1] : lower + 30;
  const within = Math.min(1, (windKt - lower) / (upper - lower));
  return { tier, ratio: (tier + within) / n };
}

// r34_km(34kt=トロピカルストーム相当が届く範囲)を、そのまま「台風ハザードとして
// 表示する範囲」の幅として使う。改訂その8でJMA基準に切り替え、最低階級の下限
// (TYPHOON_CATEGORY_BOUNDS_KT[0])を34ktにしたことで、この下限はr34の定義(34kt到達点)
// そのものと一致するようになった。そのため下記の減衰式で距離を逆算すると、
// MIN_KT=34の場合は d = r34 × (1 - 0/(w-34)) = r34 となり、常にr34そのものが
// 返る(距離補間が実質不要になった、Saffir-Simpson基準だった頃の名残の計算式だが、
// 別の閾値に変更した場合にも対応できるよう汎用のまま残してある)。
// r34欠損時(フォールバック)は距離減衰が無い(200km以内は一律w)前提のため、
// w>=最低閾値なら200km、それ未満なら0という単純な二値になる。
function typhoonReachRadiusKm(w, r34, hasR34) {
  const MIN_KT = TYPHOON_CATEGORY_BOUNDS_KT[0]; // 34(JMA「台風」の下限)
  if (typeof w !== 'number') return 0;
  if (!hasR34) return w >= MIN_KT ? TYPHOON_FALLBACK_RADIUS_KM : 0;
  if (w <= 34) return 0; // 中心ですら34kt以下なら、r34内のどこにも最低閾値は存在しない
  const d = r34 * (1 - (MIN_KT - 34) / (w - 34));
  return Math.max(0, Math.min(r34, d));
}

function collectTyphoonSegments(coords, windsKt, r34Km, fallbackTierRatio, segments) {
  const items = coords.map(([lon, lat], i) => {
    const wind = (windsKt && typeof windsKt[i] === 'number') ? windsKt[i] : null;
    const hasR34 = !!(r34Km && typeof r34Km[i] === 'number' && r34Km[i] > 0);
    const r34 = hasR34 ? r34Km[i] : TYPHOON_FALLBACK_RADIUS_KM;
    return { lat, lon, wind, catRadius: typhoonReachRadiusKm(wind, r34, hasR34) };
  });
  const runs = splitContiguousRuns(items, item => inLandBbox(item.lat, item.lon));
  runs.forEach(run => {
    for (let i = 0; i < run.length - 1; i++) {
      const a = run[i], b = run[i + 1];
      let segWind;
      if (typeof a.wind === 'number' && typeof b.wind === 'number') segWind = (a.wind + b.wind) / 2;
      else if (typeof a.wind === 'number') segWind = a.wind;
      else if (typeof b.wind === 'number') segWind = b.wind;
      else segWind = null;
      const tr = segWind !== null ? typhoonWindToTierRatio(segWind) : fallbackTierRatio;
      // 最低閾値(JMA「台風」の下限、34kt)未満の区間は台風ハザードとして描画しない
      if (!tr) continue;
      segments.push({ a, b, ratio: tr.ratio });
    }
  });
}

async function buildTyphoonHazard() {
  const geojson = await fetchGeojsonSafe('data/typhoons.geojson');
  typhoonGeojsonCacheGlobal = geojson;
  const segments = [];

  if (geojson) {
    let minTime = Infinity, maxTime = -Infinity;
    geojson.features.forEach(f => {
      const maxWind = f.properties?.max_wind_kt;
      // winds_kt(地点ごとの風速)が無い古いデータ形式でも動くよう、その場合は
      // 台風全体の最大風速から一律のtier/ratioを計算してフォールバックに使う。
      // 最大風速でも最低閾値(34kt)未満の台風は、そもそも描画対象にしない。
      const fallbackTierRatio = typhoonWindToTierRatio(maxWind);
      collectTyphoonSegments(f.geometry.coordinates, f.properties?.winds_kt, f.properties?.r34_km, fallbackTierRatio, segments);
      const st = f.properties?.start_time, et = f.properties?.end_time;
      if (st) minTime = Math.min(minTime, new Date(st).getTime());
      if (et) maxTime = Math.max(maxTime, new Date(et).getTime());
    });
    if (isFinite(minTime) && isFinite(maxTime)) {
      dataRanges.typhoonHazard = `${new Date(minTime).getFullYear()}–${new Date(maxTime).getFullYear()}`;
      updateLegend();
    }
  } else {
    TYPHOON_SAMPLE.forEach(t => {
      const lonLatCoords = t.points.map(([lat, lon]) => [lon, lat]);
      collectTyphoonSegments(lonLatCoords, null, null, { tier: 2, ratio: 0.5 }, segments);
    });
  }

  // 弱い区間から先に描画し、強い区間を最後(最前面)に描くことで、重なった場所では
  // 常に最も強い台風の色が見えるようにする
  // 【2026年8月改訂・その3】以前は太さ固定(weight:5)の単純な線で描画しており、見た目の
  // 太さが実際の暴風域(r34、11〜581kmと大きく幅がある)と無関係だったため、
  // 「線に近ければ危険」という誤解を招きやすかった。区間ごとにr34を反映した幅の帯
  // (ポリゴン)として描画するよう変更し、実際の暴風域の広さの違いが見た目にも
  // 表れるようにした。帯同士が重なっても地図が見えなくなりすぎないよう、
  // 透過度を上げて(fillOpacity 0.28)半透明にしてある。
  segments.sort((s1, s2) => s1.ratio - s2.ratio);
  segments.forEach(seg => {
    const brg = bearingDeg(seg.a.lat, seg.a.lon, seg.b.lat, seg.b.lon);
    const perpL = brg - 90, perpR = brg + 90;
    const aL = destinationPoint(seg.a.lat, seg.a.lon, perpL, seg.a.catRadius);
    const aR = destinationPoint(seg.a.lat, seg.a.lon, perpR, seg.a.catRadius);
    const bL = destinationPoint(seg.b.lat, seg.b.lon, perpL, seg.b.catRadius);
    const bR = destinationPoint(seg.b.lat, seg.b.lon, perpR, seg.b.catRadius);
    L.polygon([aL, bL, bR, aR], {
      color: colorForWeight(seg.ratio), weight: 1, opacity: 0.35,
      fillColor: colorForWeight(seg.ratio), fillOpacity: 0.28,
    }).addTo(layerGroups.typhoonHazard);
  });
}

// 水害ハザード: 降雨強度(CHIRPS)と標高(Open-Elevation)の高い方を基礎リスクとし、
// 過去の洪水実績(DFO)で最大1.5倍まで底上げする。データ欠損セルは灰色で明示する。
let rainfallGeojsonCacheGlobal = null;
let elevationGeojsonCacheGlobal = null;
// 降雨グリッドは1度間隔の整数座標のため、"lat_lon" をキーにした Map で直接引ける。
// 平滑化では周囲5x5格子まで参照するので、毎回の線形探索を避ける。
let rainfallGridIndex = new Map();

function buildRainfallGridIndex(geojson) {
  const index = new Map();
  if (!geojson) return index;
  geojson.features.forEach(f => {
    const [lon, lat] = f.geometry.coordinates;
    const props = f.properties || {};
    if (props.no_data) return;
    index.set(`${Math.round(lat)}_${Math.round(lon)}`, props);
  });
  return index;
}

function floodWeightAt(lat, lon) {
  if (!floodGeojsonCacheGlobal) return 1.0;
  const areaVals = floodGeojsonCacheGlobal.features
    .map(f => f.properties?.affected_sq_km).filter(v => typeof v === 'number');
  if (areaVals.length === 0) return 1.0;
  const maxArea = Math.max(...areaVals);

  let nearestArea = null, nearestDist = Infinity;
  floodGeojsonCacheGlobal.features.forEach(f => {
    const area = f.properties?.affected_sq_km;
    if (typeof area !== 'number') return;
    const [flon, flat] = f.geometry.coordinates;
    if (!degBboxFilter(lat, lon, flat, flon, 80)) return;
    const d = haversineKm(lat, lon, flat, flon);
    if (d <= 80 && d < nearestDist) { nearestDist = d; nearestArea = area; }
  });
  if (nearestArea === null) return 1.0;
  const relative = Math.min(1, nearestArea / maxArea);
  // 2026年9月改訂: 1.0〜1.5から1.0〜1.2に縮小。DFOの代表点は洪水イベントの影響範囲の
  // 重心で、面積の中央値が約73,000km²(270km四方)と粗く、地点ごとの差を表せていない。
  // また記録の8割超が豪雨起因で、内水氾濫(降雨×窪み)と原因が重複している。
  // 実績は「モデルが捉えきれなかった分の補正」に留める。
  return 1 + FLOOD_WEIGHT_MAX_UPLIFT * relative;
}

// ==== 水域近接倍率(河川・湖・海への近さで標高リスクを底上げする) ====
let riversGeojsonCacheGlobal = null;
let riverSpatialIndex = null; // Map<"latCell_lonCell", number[]>(河川データのインデックス、featuresの添字)
const RIVER_INDEX_CELL_DEG = 0.02; // 約2.2km四方の格子(2km圏内の検索に十分な粒度)

// 河川データを読み込んだ直後に1回だけ呼ぶ: 各河川の頂点をもとに、格子ごとの索引を作る。
// これにより検索のたびに全件(14万本規模)をスキャンする必要がなくなる。
function buildRiverSpatialIndex(riversGeojson) {
  const index = new Map();
  if (!riversGeojson) return index;
  riversGeojson.features.forEach((f, idx) => {
    const coords = f.geometry?.coordinates;
    if (!coords) return;
    const seenCells = new Set(); // 同じ河川が同じ格子に何度も登録されるのを防ぐ
    coords.forEach(([lon, lat]) => {
      const cellKey = `${Math.floor(lat / RIVER_INDEX_CELL_DEG)}_${Math.floor(lon / RIVER_INDEX_CELL_DEG)}`;
      if (seenCells.has(cellKey)) return;
      seenCells.add(cellKey);
      if (!index.has(cellKey)) index.set(cellKey, []);
      index.get(cellKey).push(idx);
    });
  });
  return index;
}

// 指定地点の周囲(3x3の格子=約6.6km四方)に該当する河川の候補だけを取り出す
function nearbyRiverFeatures(lat, lon) {
  if (!riverSpatialIndex || !riversGeojsonCacheGlobal) return [];
  const baseLat = Math.floor(lat / RIVER_INDEX_CELL_DEG);
  const baseLon = Math.floor(lon / RIVER_INDEX_CELL_DEG);
  const candidateIdx = new Set();
  for (let dLat = -1; dLat <= 1; dLat++) {
    for (let dLon = -1; dLon <= 1; dLon++) {
      const key = `${baseLat + dLat}_${baseLon + dLon}`;
      const bucket = riverSpatialIndex.get(key);
      if (bucket) bucket.forEach(i => candidateIdx.add(i));
    }
  }
  return Array.from(candidateIdx).map(i => riversGeojsonCacheGlobal.features[i]);
}

// Overpass API(OpenStreetMap)で、指定地点周辺の湖・貯水池をその場に問い合わせる。
// HydroLAKES(全世界820MBの事前ダウンロードが必要)を避けるための代替手段。
// 地点検索1回につき1回だけ呼び出し、169マス全体で結果を使い回す(通信回数を抑えるため)。
const OVERPASS_URL = 'https://overpass-api.de/api/interpreter';

async function fetchNearbyLakePoints(lat, lon, radiusM) {
  const query = `[out:json][timeout:25];(way["natural"="water"]["water"~"lake|reservoir|oxbow"](around:${radiusM},${lat},${lon});relation["natural"="water"]["water"~"lake|reservoir|oxbow"](around:${radiusM},${lat},${lon}););out geom;`;
  try {
    const res = await fetch(OVERPASS_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain' },
      body: query,
    });
    if (!res.ok) return [];
    const data = await res.json();
    const points = [];
    (data.elements || []).forEach(el => {
      if (el.geometry) {
        el.geometry.forEach(g => points.push([g.lat, g.lon]));
      } else if (el.members) {
        el.members.forEach(m => {
          if (m.geometry) m.geometry.forEach(g => points.push([g.lat, g.lon]));
        });
      }
    });
    return points;
  } catch (e) {
    // Overpass APIが混雑・失敗している場合は、湖の要素なしとして扱う(検索自体は継続する)
    return [];
  }
}

// 距離(km) → 最寄りの頂点との最短距離(度)を概算距離(km)に変換する簡易ヘルパー
function pointToLineDistanceKm(lat, lon, coords) {
  // 簡易実装: 線を構成する各頂点との距離のうち最小値を採用する(頂点間の補間はしない近似)
  let minDist = Infinity;
  coords.forEach(([clon, clat]) => {
    const d = haversineKm(lat, lon, clat, clon);
    if (d < minDist) minDist = d;
  });
  return minDist;
}

// ==== 標高タイル(AW3D30 150m)の読み込み ====
// data/elevation_tiles/N034E113.tif = 北緯34〜35度・東経113〜114度の1度タイル。
// 720x720のint16 GeoTIFF(1画素 = 1/720度 ≒ 150m)、行0がタイル北端。
// geotiff.jsのHTTPレンジリクエストで、必要な範囲の画素だけを部分読み込みする。
const ELEV_TILE_PX = 720;
const ELEV_TILE_DIR = 'data/elevation_tiles/';
const elevTileCache = new Map(); // "N034E113" -> Promise<GeoTIFFImage>

function elevTileKey(latFloor, lonFloor) {
  const la = String(latFloor).padStart(3, '0');
  const lo = String(lonFloor).padStart(3, '0');
  return `N${la}E${lo}`;
}

function loadElevTile(latFloor, lonFloor) {
  const key = elevTileKey(latFloor, lonFloor);
  if (!elevTileCache.has(key)) {
    elevTileCache.set(key, (async () => {
      const tiff = await GeoTIFF.fromUrl(`${ELEV_TILE_DIR}${key}.tif`);
      return await tiff.getImage();
    })().catch(() => null));
  }
  return elevTileCache.get(key);
}

// 緯度経度 → 全球通しの画素番号(北極が行0、経度0度が列0)
function elevGlobalPixel(lat, lon) {
  return {
    gx: Math.floor(lon * ELEV_TILE_PX),
    gy: Math.floor((90 - lat) * ELEV_TILE_PX),
  };
}

// 中心地点の周囲 (2*halfPx+1) 画素四方を読み、その場で引ける標高ブロックを返す。
// タイル境界をまたぐ場合は、必要なタイルを個別に読んで貼り合わせる。
// タイルが存在しない範囲(パミール高原など)の画素は null のままになる。
async function loadElevationBlock(lat, lon, halfPx) {
  const c = elevGlobalPixel(lat, lon);
  const x0 = c.gx - halfPx, y0 = c.gy - halfPx;
  const size = halfPx * 2 + 1;
  const values = new Array(size * size).fill(null);

  // 必要な画素を、所属タイルごとにまとめる
  const tiles = new Map();
  for (let ty = Math.floor(y0 / ELEV_TILE_PX); ty <= Math.floor((y0 + size - 1) / ELEV_TILE_PX); ty++) {
    for (let tx = Math.floor(x0 / ELEV_TILE_PX); tx <= Math.floor((x0 + size - 1) / ELEV_TILE_PX); tx++) {
      tiles.set(`${ty}_${tx}`, { ty, tx });
    }
  }

  await Promise.all(Array.from(tiles.values()).map(async ({ ty, tx }) => {
    const latFloor = 89 - ty;
    const lonFloor = tx;
    if (latFloor < 0 || lonFloor < 0) return;
    const image = await loadElevTile(latFloor, lonFloor);
    if (!image) return;
    // このタイル内で必要な範囲(タイルローカル座標)
    const left = Math.max(x0, tx * ELEV_TILE_PX) - tx * ELEV_TILE_PX;
    const right = Math.min(x0 + size - 1, tx * ELEV_TILE_PX + ELEV_TILE_PX - 1) - tx * ELEV_TILE_PX;
    const top = Math.max(y0, ty * ELEV_TILE_PX) - ty * ELEV_TILE_PX;
    const bottom = Math.min(y0 + size - 1, ty * ELEV_TILE_PX + ELEV_TILE_PX - 1) - ty * ELEV_TILE_PX;
    let raster;
    try {
      raster = await image.readRasters({ window: [left, top, right + 1, bottom + 1] });
    } catch (e) {
      return;
    }
    const band = raster[0];
    const w = right - left + 1;
    for (let r = top; r <= bottom; r++) {
      for (let cx = left; cx <= right; cx++) {
        const gyy = ty * ELEV_TILE_PX + r;
        const gxx = tx * ELEV_TILE_PX + cx;
        const bi = (gyy - y0) * size + (gxx - x0);
        if (bi < 0 || bi >= values.length) continue;
        values[bi] = band[(r - top) * w + (cx - left)];
      }
    }
  }));

  const get = (qLat, qLon) => {
    const p = elevGlobalPixel(qLat, qLon);
    const ix = p.gx - x0, iy = p.gy - y0;
    if (ix < 0 || iy < 0 || ix >= size || iy >= size) return null;
    return values[iy * size + ix];
  };
  const center = get(lat, lon);
  return { get, values, size, center, ok: center !== null };
}

// ==== 降雨: 周辺格子の距離加重平均(IDW)でGumbelパラメータを平滑化する ====
// 1度格子の中心1画素だけをCHIRPSから読んでいるため、対流性豪雨に当たった格子が
// 突出する。周囲を距離で重み付けして均すことで、隣接格子との連続性を確保する。
// 半径1.0度で参照点が見つからない場合(沿岸部など)のみ2.0度に広げる。
const RAIN_SMOOTH_R1 = 1.0;
const RAIN_SMOOTH_R2 = 2.0;
const RAIN_SMOOTH_EPS = 0.35;

function smoothedGumbelAt(lat, lon) {
  if (!rainfallGeojsonCacheGlobal) return null;
  const tryRadius = (R) => {
    let numMu = 0, numBeta = 0, den = 0;
    const span = Math.ceil(R);
    const cosLat = Math.cos(lat * Math.PI / 180);
    for (let dLat = -span; dLat <= span; dLat++) {
      for (let dLon = -span; dLon <= span; dLon++) {
        const gLat = Math.floor(lat) + dLat;
        const gLon = Math.floor(lon) + dLon;
        const p = rainfallGridIndex.get(`${gLat}_${gLon}`);
        if (!p || typeof p.gumbel_mu !== 'number' || typeof p.gumbel_beta !== 'number') continue;
        const d = Math.hypot((gLon - lon) * cosLat, gLat - lat);
        if (d > R) continue;
        const w = 1 / Math.pow(d + RAIN_SMOOTH_EPS, 2);
        numMu += w * p.gumbel_mu;
        numBeta += w * p.gumbel_beta;
        den += w;
      }
    }
    return den > 0 ? { mu: numMu / den, beta: numBeta / den } : null;
  };
  return tryRadius(RAIN_SMOOTH_R1) || tryRadius(RAIN_SMOOTH_R2);
}

// 降雨強度スコア(0〜1): 50年確率の24時間降水量を全国分布で正規化する。
// 下端16mm/上端218mmは、平滑化後の全国1,661地点の5%点・95%点(実測)。
const RAIN_X50_K = 3.9019; // -ln(-ln(1 - 1/50))
const RAIN_NORM_LO = 16;
const RAIN_NORM_HI = 218;

function rainfallIntensityScore(lat, lon) {
  const g = smoothedGumbelAt(lat, lon);
  if (!g) return null;
  const x50 = g.mu + g.beta * RAIN_X50_K;
  return Math.max(0, Math.min(1, (x50 - RAIN_NORM_LO) / (RAIN_NORM_HI - RAIN_NORM_LO)));
}

// ==== 機構2: 内水氾濫の窪み係数(0.6〜1.3の倍率) ====
// 21x21グリッド(約3.15km四方)の標高から、周囲に対してどれだけ低いかを見る。
// 最小値ではなく下位10%分位を使うのは、1画素の誤差やノイズに引きずられないため。
// 起伏(rng)が2m未満の一様な平野は「窪地かどうか判定できない」ため中立(1.0)に倒す。
function percentileOf(sortedVals, q) {
  if (sortedVals.length === 0) return null;
  const i = Math.max(0, Math.min(sortedVals.length - 1, Math.floor(q * sortedVals.length)));
  return sortedVals[i];
}

function depressionFactor(centerElev, neighborhoodVals) {
  const vals = neighborhoodVals.filter(v => typeof v === 'number').sort((a, b) => a - b);
  if (vals.length < 20 || centerElev === null) return { factor: 1.0, rel: null, rng: null };
  const p10 = percentileOf(vals, 0.10);
  const p90 = percentileOf(vals, 0.90);
  const rng = p90 - p10;
  const rel = centerElev - p10;
  if (rng < 2) return { factor: 1.0, rel, rng };
  let factor;
  if (rel <= 0.5) factor = 1.3;
  else if (rel <= 2) factor = 1.15;
  else if (rel <= 5) factor = 1.0;
  else if (rel <= 10) factor = 0.8;
  else factor = 0.6;
  return { factor, rel, rng };
}

// ==== 機構1: 外水氾濫(河川の氾濫) ====
// 半径2km以内の河川を1本ずつ評価し、最大値を採る。
// 最寄りが小河川でも、少し遠い大河川のほうが危険なことがあるため。
function riverProximityScore(distanceM) {
  if (distanceM <= 500) return 1.0;
  if (distanceM <= 1000) return 0.7;
  if (distanceM <= 1500) return 0.4;
  if (distanceM <= 2000) return 0.2;
  return 0;
}

// Strahler次数(order)を河川規模の代理指標として使う。流量属性はHydroRIVERSの
// 配布データに含まれていないため、次数で代用している(乾燥地帯の涸れ川と
// 湿潤地帯の同次数河川が同格になる限界がある)。
function riverOrderFactor(order) {
  if (typeof order !== 'number') return 0.3;
  if (order >= 9) return 1.0;
  if (order >= 8) return 0.85;
  if (order >= 7) return 0.7;
  if (order >= 6) return 0.55;
  if (order >= 5) return 0.4;
  return 0.3;
}

// 川面からの高さ(比高)。考え方はHAND(Height Above Nearest Drainage)に基づくが、
// 流向解析を行わず最寄りの河川線を使う簡易版のため、分水嶺を挟んだ反対側の川を
// 拾う場合がある。
function riverReliefFactor(reliefM) {
  if (reliefM === null) return 1.0; // 標高が取れない場合は比高で減点しない
  if (reliefM <= 2) return 1.0;
  if (reliefM <= 5) return 0.6;
  if (reliefM <= 10) return 0.25;
  return 0.05;
}

// 河川の頂点のうち最寄りのものを返す(距離kmと座標)
function nearestVertexOnRiver(lat, lon, coords) {
  let best = null, bestD = Infinity;
  coords.forEach(([clon, clat]) => {
    const d = haversineKm(lat, lon, clat, clon);
    if (d < bestD) { bestD = d; best = { lat: clat, lon: clon }; }
  });
  return best ? { distKm: bestD, lat: best.lat, lon: best.lon } : null;
}

function fluvialScoreAt(lat, lon, elevGet, centerElev) {
  let best = 0;
  nearbyRiverFeatures(lat, lon).forEach(f => {
    const coords = f.geometry?.coordinates;
    if (!coords) return;
    const nv = nearestVertexOnRiver(lat, lon, coords);
    if (!nv || nv.distKm > 2) return;
    const prox = riverProximityScore(nv.distKm * 1000);
    if (prox === 0) return;
    const scale = riverOrderFactor(f.properties?.order);
    let relief = null;
    if (elevGet && centerElev !== null) {
      const riverElev = elevGet(nv.lat, nv.lon);
      if (typeof riverElev === 'number') relief = centerElev - riverElev;
    }
    const score = prox * scale * riverReliefFactor(relief);
    if (score > best) best = score;
  });
  return best;
}

// ==== 機構3: 高潮・海岸浸水 ====
// 内陸に進むほど地表摩擦で水位が減衰する(中国沿岸の高潮研究で用いられる
// -0.1〜-0.3 m/km の中央値 0.2 m/km を採用)。海岸線上では、従来の
// 海抜3m/5m/10m基準と完全に一致する。
const SURGE_BASE_LEVEL_M = 3.0;
const SURGE_DECAY_M_PER_KM = 0.2;

// 海岸線までの距離。
// CHINA_COASTLINE_POLYGON は陸/海の大雑把な判定(isOnLand)用に置かれた30頂点の
// 多角形で、渤海湾や杭州湾を横切っている。これで距離を測ると天津が「海岸から329km」
// になり、高潮の判定(15km以内)が全国どこでも成立しなくなる。
// そのため距離用には、150m標高タイルから抽出した海岸線の点群
// (data/coastline_points.json、約1.85km間隔・11,339点)を使う。
// 主要都市で検証済み: 上海18km / 天津45km / 深圳5km / 青島1km / 大連4km。
let coastlinePointsIndex = null; // Map<"latCell_lonCell", [[lon,lat],...]>
const COAST_INDEX_CELL_DEG = 0.25;

function buildCoastlineIndex(points) {
  const index = new Map();
  if (!points) return index;
  points.forEach(([lon, lat]) => {
    const key = `${Math.floor(lat / COAST_INDEX_CELL_DEG)}_${Math.floor(lon / COAST_INDEX_CELL_DEG)}`;
    if (!index.has(key)) index.set(key, []);
    index.get(key).push([lon, lat]);
  });
  return index;
}

function coastDistanceKm(lat, lon) {
  if (!coastlinePointsIndex) return Infinity;
  // 高潮が成立するのは15km以内なので、±1セル(約28km四方)だけ調べれば足りる
  const baseLat = Math.floor(lat / COAST_INDEX_CELL_DEG);
  const baseLon = Math.floor(lon / COAST_INDEX_CELL_DEG);
  let minD = Infinity;
  for (let dLat = -1; dLat <= 1; dLat++) {
    for (let dLon = -1; dLon <= 1; dLon++) {
      const bucket = coastlinePointsIndex.get(`${baseLat + dLat}_${baseLon + dLon}`);
      if (!bucket) continue;
      bucket.forEach(([clon, clat]) => {
        const d = haversineKm(lat, lon, clat, clon);
        if (d < minD) minD = d;
      });
    }
  }
  return minD;
}

function surgeScoreAt(lat, lon, elev) {
  if (elev === null) return 0;
  const d = coastDistanceKm(lat, lon);
  const reach = SURGE_BASE_LEVEL_M - SURGE_DECAY_M_PER_KM * d;
  if (reach <= 0) return 0; // 15km以上内陸では対象外
  const margin = elev - reach;
  if (margin <= 0) return 1.0;
  if (margin <= 2) return 0.6;
  if (margin <= 7) return 0.25;
  return 0;
}

// data/elevation_risk.geojson は1度グリッドの平均標高を3m/5m/10mの閾値で
// リスク値(1.0/0.75/0.4/0.1)に変換したものしか持たない。全国ヒートマップの
// 高潮判定にはメートル値が要るため、各段階の代表標高に読み戻す。
// あくまで概算で、正確な標高は地点検索側で150mタイルから直接読む。
function elevFromGridProps(props) {
  if (!props) return null;
  if (typeof props.mean_elev_m === 'number') return props.mean_elev_m;
  const r = props.risk;
  if (typeof r !== 'number') return null;
  if (r >= 1.0) return 2;
  if (r >= 0.75) return 4;
  if (r >= 0.4) return 7;
  return 50;
}

// ==== 統合 ====
// 3機構のスコアは確率ではなく正規化した指標のため、足し合わせず最大値を採る。
// 洪水実績(DFO)は「モデルが捉えきれなかった分の補正」として1.0〜1.2倍に留める
// (記録の代表点は影響範囲の重心で、面積の中央値が約73,000km²=270km四方と粗いため)。
const FLOOD_WEIGHT_MAX_UPLIFT = 0.2;

function combineWaterHazard(fluvial, pluvial, surge) {
  const parts = [
    { key: 'fluvial', label: 'River flooding', value: fluvial },
    { key: 'pluvial', label: 'Surface water flooding', value: pluvial },
    { key: 'surge', label: 'Coastal storm surge', value: surge },
  ].filter(p => typeof p.value === 'number');
  if (parts.length === 0) return null;
  let top = parts[0];
  parts.forEach(p => { if (p.value > top.value) top = p; });
  return { base: top.value, dominant: top.label, dominantKey: top.key };
}

async function buildWaterHazard() {
  const [rainfallGeojson, elevationGeojson, riversGeojson, coastline] = await Promise.all([
    fetchGeojsonSafe('data/rainfall_risk.geojson'),
    fetchGeojsonSafe('data/elevation_risk.geojson'),
    fetchGeojsonSafe('data/rivers.geojson'),
    fetchGeojsonSafe('data/coastline_points.json'),
  ]);
  rainfallGeojsonCacheGlobal = rainfallGeojson;
  elevationGeojsonCacheGlobal = elevationGeojson;
  riversGeojsonCacheGlobal = riversGeojson;
  riverSpatialIndex = buildRiverSpatialIndex(riversGeojson);
  coastlinePointsIndex = buildCoastlineIndex(coastline && coastline.points);

  if (!floodGeojsonCacheGlobal) {
    floodGeojsonCacheGlobal = await fetchGeojsonSafe('data/floods.geojson');
  }

  rainfallGridIndex = buildRainfallGridIndex(rainfallGeojson);

  const riskPoints = [];

  // 全国俯瞰の色分けは「概算」である点に注意。
  // 窪み係数と河川比高は150m標高タイルの読み込みが必要で、全国1,661格子ぶんを
  // 起動時に取得するのは非現実的なため、地図側では両方とも中立(1.0)として扱う。
  // 正確な3機構評価は地点検索側(21x21グリッド)で行う。
  if (rainfallGeojson) {
    rainfallGeojson.features.forEach(f => {
      const [lon, lat] = f.geometry.coordinates;
      const props = f.properties || {};
      if (props.no_data) return; // データなしは地図上には何も描かない

      // 機構2: 内水氾濫(窪み係数は地図側では中立)
      const pluvial = rainfallIntensityScore(lat, lon);

      // 機構1: 外水氾濫(比高は地図側では中立 = elevGetを渡さない)
      const fluvial = fluvialScoreAt(lat, lon, null, null);

      // 機構3: 高潮(1度グリッドの平均標高を使う概算)
      let cellElev = null;
      if (elevationGeojson) {
        let nearestElev = null, nearestDist = Infinity;
        elevationGeojson.features.forEach(ef => {
          const [elon, elat] = ef.geometry.coordinates;
          if (!degBboxFilter(lat, lon, elat, elon, 150)) return;
          const d = haversineKm(lat, lon, elat, elon);
          if (d < nearestDist) { nearestDist = d; nearestElev = elevFromGridProps(ef.properties); }
        });
        if (typeof nearestElev === 'number') cellElev = nearestElev;
      }
      const surge = cellElev !== null ? surgeScoreAt(lat, lon, cellElev) : 0;

      const combined = combineWaterHazard(fluvial, pluvial, surge);
      if (!combined) return;
      const weight = floodWeightAt(lat, lon);
      const finalRisk = Math.min(1.0, combined.base * weight);
      if (finalRisk > 0) riskPoints.push([lat, lon, finalRisk]);
    });
  }

  if (riskPoints.length > 0) {
    L.heatLayer(riskPoints, { radius: 40, blur: 32, maxZoom: 8, max: 1.0, gradient: HAZARD_GRADIENT }).addTo(layerGroups.waterHazard);
  }
}


// ==== 地点検索: 各ハザードの5段階配色ロジック(標高以外はローカルデータのみで計算、追加通信なし) ====

// 気象庁の震度階級配色を参考にした地震用5段階(黄→橙→赤→濃い赤→赤紫)
const EARTHQUAKE_TIER_COLORS = ['#D9A22C', '#D9722C', '#C13A2E', '#8C1F1F', '#7A2E6B'];
// 気象庁の統一「警戒レベル」配色を参考にした台風・雷・洪水共通5段階(黄→橙→赤→紫→黒)
const WARNING_TIER_COLORS = ['#D9A22C', '#D9722C', '#C13A2E', '#7A3B8C', '#1A2130'];

// 5段階配色のグラデーション凡例(温度計ふう)+データ欠損(灰色)の説明をHTMLで生成する共通関数

const GENERIC_TIER_LABELS = ['Low', 'Moderate', 'High', 'Severe', 'Extreme'];
function riskLegendHtml(colors, ratio, labels) {
  const useColors = colors || WARNING_TIER_COLORS;
  const useLabels = labels || GENERIC_TIER_LABELS;
  const bar = useColors.map(c => `<span style="background:${c};"></span>`).join('');
  const labelSpans = useLabels.map(l => `<span>${l}</span>`).join('');
  const hasMarker = typeof ratio === 'number' && !isNaN(ratio);
  // マーカーは棒の左右端で見切れないよう、ごくわずかに内側へクランプする
  const pct = hasMarker ? Math.min(99, Math.max(1, ratio * 100)) : 0;
  return `
    <div class="risk-legend">
      <div class="risk-legend-bar-wrap">
        ${hasMarker ? `<div class="risk-legend-marker" style="left:${pct.toFixed(1)}%;">▼</div>` : ''}
        <div class="risk-legend-bar">${bar}</div>
      </div>
    </div>
    <div class="risk-legend-labels">${labelSpans}</div>
  `;
}

// 台風(34kt+)の発生頻度(再現期間)の表示。過去の最大値(バッジ本体)とは別の指標なので、
// 混同されないよう「past N years」を明記し、不確実性の90%区間もあわせて示す。
function typhoonFreqHtml(freq) {
  if (!freq.observed) {
    return `<div class="result-freq">Typhoon (34kt+): not observed within 200km in past ${freq.totalYears}yrs (insufficient data for a frequency estimate)</div>`;
  }
  return `<div class="result-freq">Typhoon frequency: ~${freq.returnPeriod.toFixed(1)}yr return period (annual prob. ${(freq.pAnnual * 100).toFixed(0)}%, 90% CI: ${freq.ciLow.toFixed(1)}–${freq.ciHigh.toFixed(1)}yr, based on ${freq.totalYears}yrs of data)</div>`;
}

function haversineKm(lat1, lon1, lat2, lon2) {
  const R = 6371;
  const dLat = (lat2 - lat1) * Math.PI / 180;
  const dLon = (lon2 - lon1) * Math.PI / 180;
  const a = Math.sin(dLat / 2) ** 2 + Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLon / 2) ** 2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
}

// 度単位のざっくりした絞り込み(重い三角関数を使うhaversineの前段フィルタとして使う)。
// 緯度1度は約111km固定。経度は高緯度ほど短くなるが、ここでは安全側に倍のマージンを取って簡略化する。
function degBboxFilter(lat, lon, flat, flon, radiusKm) {
  const degMargin = (radiusKm / 111) * 1.5;
  return Math.abs(lat - flat) <= degMargin && Math.abs(lon - flon) <= degMargin;
}

// 地震: 周辺100km以内の地震のうち、マグニチュードと震源距離を組み合わせた実効的な
// 危険度が最大のものを判定に使う。以前は「100km以内の最大マグニチュード」を二値判定
// (圏内/圏外)していたため、5km先のM6.0も95km先のM6.0も同じ扱いになっていた。
// lightningと同じ考え方で、震源距離に応じて線形減衰させる(100kmでゼロ)ようにした。
// マグニチュード側はM5.0=0.05(下限)、M7.5以上=1.0となるよう2乗カーブで正規化している。
// 【2026年8月改訂】以前は単純な線形正規化(M5.0=0.0)だったため、震源距離が0kmでも
// M5.0ちょうどの地震は必ずeffective=0(距離減衰も無意味化)になり、「M5.0+」を謳う
// バッジ文言と矛盾していた。2乗カーブへの変更は副作用として、M6.5以上の高マグニチュード
// 帯の刻みをより強調する効果もある(地震のエネルギーは指数的に増えるため、線形正規化だと
// 低マグニチュード側の刻みが相対的に粗く感じられる問題があった)。
function earthquakeRiskInfo(lat, lon) {
  if (!earthquakeGeojsonCache) return null;
  let best = null; // { mag, dist, effective }
  earthquakeGeojsonCache.features.forEach(f => {
    const [flon, flat] = f.geometry.coordinates;
    if (!degBboxFilter(lat, lon, flat, flon, 100)) return; // 先に安価な絞り込み
    const mag = f.properties?.mag;
    if (typeof mag !== 'number') return;
    const dist = haversineKm(lat, lon, flat, flon);
    if (dist > 100) return;
    const falloff = Math.max(0, 1 - dist / 100);
    const magRatioLinear = Math.min(1, Math.max(0, (mag - 5.0) / 2.5));
    const magRatio = Math.max(0.05, Math.pow(magRatioLinear, 2));
    const effective = magRatio * falloff;
    if (!best || effective > best.effective) best = { mag, dist, effective };
  });
  // 100km境界付近のごく微弱な値はノイズとして扱い、「データなし」と同様に無視する
  if (!best || best.effective <= 0.02) return null;
  const tier = Math.min(4, Math.floor(best.effective * 5));
  return { tier, ratio: best.effective, color: EARTHQUAKE_TIER_COLORS[tier], valueLabel: `M${best.mag.toFixed(1)}, ${Math.round(best.dist)}km` };
}
function earthquakeTileColor(lat, lon) {
  const info = earthquakeRiskInfo(lat, lon);
  return info ? info.color : null;
}

// 台風: 指定地点での推定風速(r34_kmがあれば線形補間、無ければ固定半径フォールバック)を、
// JMA(気象庁)の台風強さ階級(台風/強い台風/非常に強い台風/猛烈な台風)で判定する。最低閾値(34kt)未満は対象外。
// 周辺200km以内で、過去のデータ期間全体における台風(34kt+)の発生回数を年ごとに数える
// 共通ヘルパー(頻度重み・再現期間の両方で使う)。r34_kmがあれば線形補間、無ければ
// 固定半径フォールバックで判定する(estimateStormWindAtと同じ基準)。
function typhoonEventsAt(lat, lon) {
  if (!typhoonGeojsonCacheGlobal) return null;
  const years = typhoonGeojsonCacheGlobal.features
    .map(f => f.properties?.start_time ? new Date(f.properties.start_time).getFullYear() : null)
    .filter(y => y !== null);
  if (years.length === 0) return null;
  const minYear = Math.min(...years), maxYear = Math.max(...years);
  const totalYears = maxYear - minYear + 1;
  const countByYear = {};
  for (let y = minYear; y <= maxYear; y++) countByYear[y] = 0;
  typhoonGeojsonCacheGlobal.features.forEach(f => {
    const estWind = estimateStormWindAt(f, lat, lon);
    if (estWind === null || estWind < TYPHOON_CATEGORY_BOUNDS_KT[0]) return; // 最低閾値(34kt)未満は対象外
    const y = f.properties?.start_time ? new Date(f.properties.start_time).getFullYear() : null;
    if (y !== null && countByYear[y] !== undefined) countByYear[y]++;
  });
  const counts = Object.values(countByYear);
  const totalEvents = counts.reduce((s, c) => s + c, 0);
  return { totalYears, countByYear, counts, totalEvents };
}

// 台風の発生頻度による重み(水害の洪水実績重みと同じ設計思想: 1.0〜1.5倍、下限1.0固定)。
// 「1回だけ強烈な猛烈な台風」と「弱めの台風が繰り返し何度も来る」地点を区別するため、
// 過去の発生回数が多いほど単発最大強度のratioを底上げする。
// 【2026年8月実装】N=5(データ期間内で台風(34kt+)が5回以上なら頭打ち)は、水害の
// 80km・0.5係数と同様、公式基準ではなく経験則的な調整値。まずはN=5で試験導入し、
// 実データでの発生回数の分布を見ながら調整する想定。
const TYPHOON_FREQ_WEIGHT_N = 5;
function typhoonFrequencyWeightAt(lat, lon) {
  const ev = typhoonEventsAt(lat, lon);
  if (!ev || ev.totalEvents === 0) return { weight: 1.0, totalEvents: 0, totalYears: ev ? ev.totalYears : null };
  const relative = Math.min(1, ev.totalEvents / TYPHOON_FREQ_WEIGHT_N);
  return { weight: 1 + 0.5 * relative, totalEvents: ev.totalEvents, totalYears: ev.totalYears };
}

function typhoonRiskInfo(lat, lon) {
  const estWind = typhoonWindEstimateAt(lat, lon);
  const tr = typhoonWindToTierRatio(estWind);
  if (!tr) return null;
  const freq = typhoonFrequencyWeightAt(lat, lon);
  const adjustedRatio = Math.min(1, tr.ratio * freq.weight);
  const n = TYPHOON_CATEGORY_BOUNDS_KT.length;
  const tier = Math.min(n - 1, Math.floor(adjustedRatio * n));
  const freqSuffix = freq.totalEvents > 1 ? ` (×${freq.totalEvents} in ${freq.totalYears}yrs)` : '';
  return { tier, ratio: adjustedRatio, color: TYPHOON_TIER_COLORS[tier], valueLabel: `${TYPHOON_TIER_LABELS[tr.tier]}, ~${Math.round(estWind)}kt at this point${freqSuffix}` };
}
function typhoonTileColor(lat, lon) {
  const info = typhoonRiskInfo(lat, lon);
  return info ? info.color : null;
}

// 台風の発生頻度(再現期間)を、周辺200km以内・過去のデータ期間全体から統計的に推定する。
// バッジ本体が過去の最大値(1個のイベント)を示すのに対し、こちらは
// 「台風(34kt+)が平均どれくらいの頻度で来るか」という発生回数(頻度)の指標で、別物。
// 2026年8月実装: 年ごとに台風(34kt+)の発生回数をカウントし、ポアソン分布で
// 年間発生確率・再現期間を点推定。加えて、年別データを1000回ブートストラップ再抽出して
// (11年程度の少ないデータに由来する)推定の不確実性を90%区間として示す。
// 対数正規分布などの連続分布は「0回の年」を表現できないため採用していない(過去の検討より)。
function typhoonReturnPeriodInfo(lat, lon) {
  const ev = typhoonEventsAt(lat, lon);
  if (!ev) return null;
  const { totalYears, counts, totalEvents } = ev;

  if (totalEvents === 0) return { totalYears, observed: false };

  // 点推定(ポアソン分布): lambda = 年平均発生回数
  const lambda = totalEvents / totalYears;
  const pAnnual = 1 - Math.exp(-lambda);
  const returnPeriod = 1 / pAnnual;

  // ブートストラップ(1000回、年単位で重複ありに再抽出)で不確実性の90%区間を求める
  const BOOTSTRAP_N = 1000;
  const rps = [];
  for (let i = 0; i < BOOTSTRAP_N; i++) {
    let sampleSum = 0;
    for (let j = 0; j < counts.length; j++) {
      sampleSum += counts[Math.floor(Math.random() * counts.length)];
    }
    const lamB = sampleSum / counts.length;
    if (lamB === 0) continue; // この試行では「発生なし」となり再現期間は定義できないため除外
    const pB = 1 - Math.exp(-lamB);
    rps.push(1 / pB);
  }
  rps.sort((a, b) => a - b);
  const pct = (p) => rps.length ? rps[Math.min(rps.length - 1, Math.floor(rps.length * p))] : null;

  return {
    totalYears, observed: true, totalEvents, pAnnual, returnPeriod,
    ciLow: pct(0.05), ciHigh: pct(0.95),
  };
}

// 雷: 既知の落雷多発地点までの距離から密度を推定し5段階に変換
function lightningRiskInfo(lat, lon) {
  if (!lightningGeojsonCacheGlobal) return null;
  let nearest = null, nearestDist = Infinity;
  lightningGeojsonCacheGlobal.features.forEach(f => {
    const [slon, slat] = f.geometry.coordinates;
    if (!degBboxFilter(lat, lon, slat, slon, 80)) return;
    const d = haversineKm(lat, lon, slat, slon);
    if (d < nearestDist) { nearestDist = d; nearest = f.properties?.risk; }
  });
  if (nearest === null || nearest === undefined || nearestDist > 80) return null;
  // 格子点(約55km間隔)からの距離で緩やかに減衰させ、格子の境目が不自然に見えないようにする
  const falloff = Math.max(0, 1 - nearestDist / 80);
  const ratio = nearest * falloff;
  if (ratio <= 0.05) return null;
  const tier = Math.min(4, Math.floor(ratio * 5));
  return { tier, ratio, color: WARNING_TIER_COLORS[tier], valueLabel: ratio.toFixed(2) };
}
function lightningTileColor(lat, lon) {
  const info = lightningRiskInfo(lat, lon);
  return info ? info.color : null;
}

// 洪水: 周辺80km以内で最も近い洪水記録の冠水面積を5段階に変換
function floodTileColor(lat, lon) {
  if (!floodGeojsonCacheGlobal) return null;
  let nearestArea = null, nearestDist = Infinity;
  floodGeojsonCacheGlobal.features.forEach(f => {
    const area = f.properties?.affected_sq_km;
    if (typeof area !== 'number') return;
    const [flon, flat] = f.geometry.coordinates;
    if (!degBboxFilter(lat, lon, flat, flon, 80)) return;
    const d = haversineKm(lat, lon, flat, flon);
    if (d <= 80 && d < nearestDist) { nearestDist = d; nearestArea = area; }
  });
  if (nearestArea === null) return null;
  const ratio = Math.min(1, nearestArea / 5000);
  return WARNING_TIER_COLORS[Math.min(4, Math.floor(ratio * 5))];
}


// so failed lookups are retried automatically before surfacing an error.
// ==== Point lookup: elevation + comparison with 8 surrounding points ====
// Open-Elevation supports CORS for direct browser calls (unlike the free tier of
// Open-Topo-Data, which requires a paid plan for CORS). It's occasionally flaky,
// so failed lookups are retried automatically before surfacing an error.
const OPEN_ELEVATION_URL = 'https://api.open-elevation.com/api/v1/lookup';
const ELEVATION_MAX_RETRIES = 2;
const DIRS = [
  { name: 'N', dLat: 1, dLon: 0 }, { name: 'NE', dLat: 1, dLon: 1 },
  { name: 'E', dLat: 0, dLon: 1 }, { name: 'SE', dLat: -1, dLon: 1 },
  { name: 'S', dLat: -1, dLon: 0 }, { name: 'SW', dLat: -1, dLon: -1 },
  { name: 'W', dLat: 0, dLon: -1 }, { name: 'NW', dLat: 1, dLon: -1 },
];
const SEARCH_RADIUS_M = 100;

// 検索地点周辺を細かい格子(グリッド)状にサンプリングして面で塗るための設定。
// 【2026年9月改訂】標高がローカルの150mタイル(AW3D30)になり、1マスあたりの
// API問い合わせが不要になったため、9x9(1マス250m、約2.25km四方)から
// 21x21(1マス150m、約3.15km四方)へ拡張した。1マスのサイズを標高タイルの
// 画素サイズ(1/720度 ≒ 150m)に合わせてあるので、リサンプリングが発生しない。
// この21x21グリッドは、内水氾濫の窪み係数(周囲との相対標高)の計算基盤も兼ねる。
const GRID_CELL_M = 150;
const GRID_STEPS = 10; // 中心 ±10マス = 21x21 = 441マス
const GRID_RADIUS_M = GRID_CELL_M * GRID_STEPS; // 1500m

let searchMarkerLayer;
let searchGridLayers = {}; // ハザードキーごとのタイルレイヤー(それぞれ対応するチップと連動)

function elevationToRiskInfo(elevation) {
  if (elevation < 3) return { label: 'High risk (< 3m)', color: '#C13A2E' };
  if (elevation < 5) return { label: 'Watch zone (3–5m)', color: '#D9722C' };
  if (elevation < 10) return { label: 'Transition zone (5–10m)', color: '#D9A22C' };
  return { label: 'Relatively low risk (10m+)', color: '#4E7BA8' };
}

// 降雨の再現期間(2026年8月実装)。
// fetch_rainfall.py側で20年分の年最大値にフィット済みのGumbel分布パラメータ
// (gumbel_mu, gumbel_beta)を使い、固定の再現期間(10年/50年/100年)それぞれについて
// 「その再現期間に相当する降水量(mm)」を逆算する。
// 台風がポアソン分布(離散カウント)なのに対し、降雨は「年最大値」という連続量を扱うため
// Gumbel分布(極値統計で標準的に使われる連続分布)を使う。
// 逆関数: x_T = mu - beta * ln(-ln(1 - 1/T))  ※Tは再現期間(年)
// 20年分のデータでは、50年・100年は観測期間の2.5〜5倍の外挿になり不確実性が非常に大きい
// 点に注意(台風の非常に強い/猛烈な台風と同種の限界)。10年(観測期間の半分)はおおむね妥当。
const RAINFALL_RETURN_PERIODS_YR = [10, 50, 100];

// 気候変動シナリオ(2026年8月実装)。
// Gumbel分布は「降水量の統計的性質は時間で変わらない(定常性)」を前提にしており、
// 気候変動による増加傾向を織り込めない。10年分のデータでは非定常GEV(時間依存パラメータ)で
// トレンドを検出する統計的検出力が無いため、IPCCの知見に基づく係数を掛ける方式を採る。
//
// 根拠: IPCC AR6 第11章 — 年最大日降水量(Rx1day)の変化は世界平均地上気温の変化に比例し、
// Clausius-Clapeyron関係に従って1℃の昇温あたり約7%増加する(観測・将来予測とも)。
// 中国域の研究でも日降水量の極値は6〜7%/℃とほぼ同じ関係が確認されている。
// このサイトが算出しているのはまさにRx1day(年最大24時間降水量)なので指標が一致する。
//
// 注意: これは「その昇温レベルに達した世界での想定値」であり、いつそうなるかを示すものではない。
// 昇温量の選択(=どのSSPシナリオを想定するか)は利用者の判断に委ねる。
const RAINFALL_CC_PCT_PER_DEG = 7; // %/℃(Clausius-Clapeyron関係)
const RAINFALL_WARMING_SCENARIOS = [0, 1.5, 2, 3]; // ℃(0=現在の観測ベース)
let rainfallSelectedWarming = 0;
function rainfallReturnPeriodInfo(lat, lon) {
  if (!rainfallGeojsonCacheGlobal) return null;
  let nearest = null, nearestDist = Infinity;
  rainfallGeojsonCacheGlobal.features.forEach(f => {
    const [flon, flat] = f.geometry.coordinates;
    if (!degBboxFilter(lat, lon, flat, flon, 150)) return;
    const d = haversineKm(lat, lon, flat, flon);
    if (d < nearestDist) { nearestDist = d; nearest = f.properties || {}; }
  });
  if (!nearest || typeof nearest.gumbel_mu !== 'number' || typeof nearest.gumbel_beta !== 'number') {
    return null; // 旧形式データ(Gumbelパラメータ未生成)の場合は表示しない
  }
  const { gumbel_mu: mu, gumbel_beta: beta, years_used: yearsUsed } = nearest;
  // 選択中の昇温シナリオに応じた気候変動係数(0℃なら1.0=観測ベースのまま)
  const ccFactor = 1 + (RAINFALL_CC_PCT_PER_DEG / 100) * rainfallSelectedWarming;
  const results = RAINFALL_RETURN_PERIODS_YR.map(T => {
    const baseMm = mu - beta * Math.log(-Math.log(1 - 1 / T));
    return { years: T, mm: baseMm * ccFactor };
  });
  return { results, yearsUsed, warming: rainfallSelectedWarming };
}

function rainfallFreqHtml(freq) {
  if (!freq) return '';
  const rows = freq.results.map(r => `${r.years}yr: ~${r.mm.toFixed(0)}mm`).join(' / ');

  // 昇温シナリオの切替
  const scenarioOptions = RAINFALL_WARMING_SCENARIOS.map(w => `
    <label>
      <input type="radio" name="rainfallWarming" value="${w}" ${w === freq.warming ? 'checked' : ''} onchange="onRainfallWarmingChange(this.value)">
      ${w === 0 ? 'Current' : `+${w}°C`}
    </label>
  `).join('');
  // +1.5/+2/+3°C選択時のみ、IPCC根拠の説明を表示(Current時は観測値そのものなので説明不要)
  const scenarioNote = freq.warming === 0
    ? ''
    : `<br>+${freq.warming}°C scenario (IPCC AR6, ~${RAINFALL_CC_PCT_PER_DEG}%/°C)`;

  return `<div class="result-freq" id="rainfallFreq">
    <div class="rp-group" style="margin-bottom:3px;">${scenarioOptions}</div>
    ${rows} (${freq.yearsUsed}yrs data)${scenarioNote}
  </div>`;
}

// ラジオボタンで昇温シナリオが切り替わった時: 直前の検索地点に対してのみ再計算する。
// 降雨の再現期間はGumbelパラメータからその場で算出できるため、通信は発生しない。
function onRainfallWarmingChange(warmingStr) {
  rainfallSelectedWarming = parseFloat(warmingStr);
  if (!lastQueriedLatLon) return;
  const el = document.getElementById('rainfallFreq');
  if (!el) return;
  const freq = rainfallReturnPeriodInfo(lastQueriedLatLon.lat, lastQueriedLatLon.lon);
  el.outerHTML = rainfallFreqHtml(freq);
}

function metersToDegLat(m) { return m / 111000; }
function metersToDegLon(m, lat) { return m / (111000 * Math.cos(lat * Math.PI / 180)); }

// 標高タイルから複数地点の標高をまとめて取得する。タイルが存在しない範囲
// (パミール高原・モンゴル国内の一部)では null を返すので、呼び出し側で
// Open-Elevation にフォールバックする。
async function elevationsFromTiles(block, locations) {
  if (!block || !block.ok) return null;
  const out = locations.map(l => block.get(l.latitude, l.longitude));
  return out.some(v => v === null || typeof v !== 'number') ? null : out;
}

async function fetchElevations(locations) {
  for (let attempt = 1; attempt <= ELEVATION_MAX_RETRIES; attempt++) {
    try {
      const res = await fetch(OPEN_ELEVATION_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ locations }),
      });
      if (!res.ok) throw new Error('elevation api error');
      const data = await res.json();
      const results = data.results || [];
      if (results.length < locations.length) throw new Error('insufficient results');
      return results.map(r => r.elevation);
    } catch (e) {
      if (attempt === ELEVATION_MAX_RETRIES) throw e;
    }
  }
}

// queryPoint に渡す lat/lon は必ずWGS84。GCJ-02(高徳)・BD-09(百度)で入力された場合は
// 呼び出し側(検索ボタン / レポート生成)で変換済みのため、この中では変換しない。
// 標高タイル(data/elevation_tiles/)もWGS84基準なので、そのままタイルIDを算出してよい。
async function queryPoint(lat, lon) {
  const resultEl = document.getElementById('searchResult');
  if (BADGE_LAYER_KEYS.some(k => activeLayers.has(k))) {
    resultEl.className = 'search-result visible';
    resultEl.innerHTML = '<div class="result-elev">Fetching…</div>';
  }

  lastQueriedLatLon = { lat, lon };
  syncReportLocationFromSearch(lat, lon);

  const dLat = metersToDegLat(SEARCH_RADIUS_M);
  const dLon = metersToDegLon(SEARCH_RADIUS_M, lat);
  const locations = [{ latitude: lat, longitude: lon }];
  DIRS.forEach(d => locations.push({ latitude: lat + d.dLat * dLat, longitude: lon + d.dLon * dLon }));

  // 500m圏内の9x9グリッド(各マス約125m四方)の中心座標を用意
  const cellDLat = metersToDegLat(GRID_CELL_M);
  const gridCells = [];
  for (let i = -GRID_STEPS; i <= GRID_STEPS; i++) {
    for (let j = -GRID_STEPS; j <= GRID_STEPS; j++) {
      const cellLat = lat + i * cellDLat;
      const cellDLon = metersToDegLon(GRID_CELL_M, cellLat);
      gridCells.push({ lat: cellLat, lon: lon + j * cellDLon });
    }
  }
  const gridLocations = gridCells.map(c => ({ latitude: c.lat, longitude: c.lon }));

  try {
    // 21x21グリッド(±10画素)に加え、外水氾濫の比高計算で半径2km(約13画素)の
    // 河川頂点も参照するため、余裕をみて ±30画素(約4.6km四方)を1回で読む。
    const elevBlock = await loadElevationBlock(lat, lon, 30);

    let elevations = await elevationsFromTiles(elevBlock, locations);
    let gridElevations = await elevationsFromTiles(elevBlock, gridLocations);
    if (!elevations || !gridElevations) {
      // タイル欠損範囲: 従来どおりOpen-Elevation APIにフォールバックする
      [elevations, gridElevations] = await Promise.all([
        fetchElevations(locations),
        fetchElevations(gridLocations),
      ]);
    }

    const centerElev = elevations[0];
    const surrounding = elevations.slice(1).map((elev, i) => ({ name: DIRS[i].name, elev }));
    const avgSurrounding = surrounding.reduce((s, d) => s + d.elev, 0) / surrounding.length;
    const diff = avgSurrounding - centerElev;

    let compareLabel;
    if (diff >= 1) compareLabel = 'Sits noticeably lower than its surroundings';
    else if (diff >= 0.5) compareLabel = 'Slightly lower than its surroundings';
    else if (diff > -0.5) compareLabel = 'About level with its surroundings';
    else compareLabel = 'Higher than its surroundings — relatively favorable';

    // バッジは「水害ハザード」の統合値(降雨×標高の高い方 × 洪水実績の重み)で判定する。
    // 方角グリッド・標高差テキストは、引き続き標高そのものを参考情報として表示する。
    // 湖の近接判定は、Overpass API(OpenStreetMap)にこの検索1回につき1回だけ問い合わせる
    // (169マス個別には問い合わせず、結果を使い回すことで通信回数を抑える)。

    const elevRiskInfo = elevationToRiskInfo(centerElev);
    const pluvialRain = rainfallIntensityScore(lat, lon);
    const noRainDataHere = pluvialRain === null;
    const tierLabels = ['Low', 'Moderate', 'High', 'Severe', 'Extreme'];

    // 21x21グリッドの標高から窪み係数を求める(内水氾濫の増幅要因)
    const depression = depressionFactor(centerElev, gridElevations);
    const pluvial = noRainDataHere ? null : Math.max(0, Math.min(1, pluvialRain * depression.factor));
    const fluvial = fluvialScoreAt(lat, lon, elevBlock && elevBlock.ok ? elevBlock.get : null, centerElev);
    const surge = surgeScoreAt(lat, lon, centerElev);
    const waterCombined = combineWaterHazard(fluvial, pluvial, surge);

    let waterBadge;
    if (!waterCombined) {
      waterBadge = { label: 'No rainfall data (outside CHIRPS coverage)', color: NO_DATA_COLOR, colors: WARNING_TIER_COLORS };
    } else {
      const weight = floodWeightAt(lat, lon);
      const finalRisk = Math.min(1.0, waterCombined.base * weight);
      const tier = Math.min(4, Math.max(0, Math.ceil(finalRisk * 5) - 1));
      const rainfallFreq = rainfallReturnPeriodInfo(lat, lon);
      waterBadge = {
        label: `${tierLabels[tier]} water hazard (${finalRisk.toFixed(2)})`,
        color: WARNING_TIER_COLORS[tier], colors: WARNING_TIER_COLORS, ratio: finalRisk,
        dominant: waterCombined.dominant,
        freqInfo: rainfallFreq, freqHtmlFn: rainfallFreqHtml,
      };
    }

    // 地震・台風・雷は標高フェッチを待つ必要が無い(キャッシュ済みgeojsonのみで判定可能)が、
    // 表示更新のタイミングは水害と揃えて1回にまとめている
    const badges = [];
    if (activeLayers.has('earthquake')) {
      const info = earthquakeRiskInfo(lat, lon);
      badges.push(info
        ? { label: `${tierLabels[info.tier]} earthquake hazard (${info.valueLabel})`, color: info.color, colors: EARTHQUAKE_TIER_COLORS, ratio: info.ratio }
        : { label: 'No M5.0+ earthquake within 100km', color: NO_DATA_COLOR, colors: EARTHQUAKE_TIER_COLORS });
    }
    if (activeLayers.has('typhoonHazard')) {
      const info = typhoonRiskInfo(lat, lon);
      const freq = typhoonReturnPeriodInfo(lat, lon);
      badges.push({
        ...(info
          ? { label: `${TYPHOON_TIER_LABELS[info.tier]} hazard (${info.valueLabel})`, color: info.color, colors: TYPHOON_TIER_COLORS, labels: TYPHOON_TIER_LABELS, ratio: info.ratio }
          : { label: 'No typhoon (34kt+) impact at this point', color: NO_DATA_COLOR, colors: TYPHOON_TIER_COLORS, labels: TYPHOON_TIER_LABELS }),
        freqInfo: freq, freqHtmlFn: typhoonFreqHtml,
      });
    }
    if (activeLayers.has('lightning')) {
      const info = lightningRiskInfo(lat, lon);
      badges.push(info
        ? { label: `${tierLabels[info.tier]} lightning hazard (${info.valueLabel})`, color: info.color, colors: WARNING_TIER_COLORS, ratio: info.ratio }
        : { label: 'No significant lightning density nearby', color: NO_DATA_COLOR, colors: WARNING_TIER_COLORS });
    }
    if (activeLayers.has('waterHazard')) badges.push(waterBadge);

    if (badges.length > 0) {
      resultEl.className = 'search-result visible';
      resultEl.innerHTML = `
        ${badges.map(b => `
          <span class="result-badge" style="background:${b.color};">${b.label}</span>
          ${riskLegendHtml(b.colors, b.ratio, b.labels)}
          ${b.freqInfo && b.freqHtmlFn ? b.freqHtmlFn(b.freqInfo) : ''}
        `).join('<div style="height:5px;"></div>')}
        ${activeLayers.has('waterHazard') ? `
          ${waterBadge.dominant ? `<div class="result-elev" style="margin-top:5px;">Dominant mechanism: ${waterBadge.dominant}</div>` : ''}
          <div class="result-elev" style="margin-top:5px;">Elevation: ${centerElev.toFixed(1)}m — ${compareLabel} (avg. surrounding diff: ${diff >= 0 ? '+' : ''}${diff.toFixed(1)}m)</div>
          <div class="result-elev" style="margin-top:5px; font-family:'JetBrains Mono', monospace; font-size:9.5px; opacity:0.75;">※ Reference only, not part of the Water Hazard score.</div>
        ` : ''}
      `;
    } else {
      resultEl.className = 'search-result';
      resultEl.innerHTML = '';
    }

    if (searchMarkerLayer) map.removeLayer(searchMarkerLayer);

    // 半径1000m(一辺約2.25km、2km四方設計)圏内を、各ハザードのリスクに応じた色のタイルで塗る
    // (地震・台風・雷はローカルデータのみ、追加通信なし)
    const hazardTileFns = {
      earthquake: earthquakeTileColor,
      typhoonHazard: typhoonTileColor,
      lightning: lightningTileColor,
    };

    Object.entries(searchGridLayers).forEach(([key, layer]) => {
      if (layer) layerGroups[key].removeLayer(layer);
    });
    searchGridLayers = {};

    Object.entries(hazardTileFns).forEach(([key, fn]) => {
      if (!activeLayers.has(key)) return; // チップがOFFなら、そもそもタイルを生成しない(表示崩れの防止)
      const layer = L.layerGroup();
      let any = false;
      gridCells.forEach((cell, idx) => {
        const color = fn(cell.lat, cell.lon);
        if (!color) return;
        any = true;
        const halfLat = cellDLat / 2;
        const halfLon = metersToDegLon(GRID_CELL_M, cell.lat) / 2;
        L.rectangle(
          [[cell.lat - halfLat, cell.lon - halfLon], [cell.lat + halfLat, cell.lon + halfLon]],
          { color, weight: 0, fillColor: color, fillOpacity: 0.45 }
        ).addTo(layer);
      });
      if (any) {
        layer.addTo(layerGroups[key]);
        searchGridLayers[key] = layer;
      }
    });

    // 水害ハザードのタイル: 標高は実測API値(このマス)、降雨強度は最寄りの事前生成データ、
    // 洪水実績は重みとしてのみ使用。海上のマスは除外。チップがOFFなら生成自体をスキップする。
    // 水害ハザードのタイル: バッジと同じ3機構モデルで1マスずつ評価する。
    // 標高は150mタイルの実測値(このマス)、降雨は平滑化済みGumbel、
    // 窪み係数はグリッド全体の分布から求めた値をマス共通で使う。
    if (activeLayers.has('waterHazard')) {
      const waterGridLayer = L.layerGroup();
      const gridVals = gridElevations;
      gridCells.forEach((cell, idx) => {
        if (!isOnLand(cell.lat, cell.lon)) return;
        const cellElev = gridVals[idx];
        if (typeof cellElev !== 'number') return;

        const cellRain = rainfallIntensityScore(cell.lat, cell.lon);
        const cellDep = depressionFactor(cellElev, gridVals);
        const cellPluvial = cellRain === null ? null : Math.max(0, Math.min(1, cellRain * cellDep.factor));
        const cellFluvial = fluvialScoreAt(cell.lat, cell.lon, elevBlock && elevBlock.ok ? elevBlock.get : null, cellElev);
        const cellSurge = surgeScoreAt(cell.lat, cell.lon, cellElev);
        const cellCombined = combineWaterHazard(cellFluvial, cellPluvial, cellSurge);
        if (!cellCombined) return; // データなしのマスは何も描かない

        const weight = floodWeightAt(cell.lat, cell.lon);
        const finalRisk = Math.min(1.0, cellCombined.base * weight);
        if (finalRisk <= 0) return;

        const halfLat = cellDLat / 2;
        const halfLon = metersToDegLon(GRID_CELL_M, cell.lat) / 2;
        const tileColor = WARNING_TIER_COLORS[Math.min(4, Math.max(0, Math.ceil(finalRisk * 5) - 1))];
        L.rectangle(
          [[cell.lat - halfLat, cell.lon - halfLon], [cell.lat + halfLat, cell.lon + halfLon]],
          { color: tileColor, weight: 0, fillColor: tileColor, fillOpacity: 0.45 }
        ).addTo(waterGridLayer);
      });
      waterGridLayer.addTo(layerGroups.waterHazard);
      searchGridLayers.waterHazard = waterGridLayer;
    }

    // 指定地点そのものは📍ピンで表示(どのチップの状態にも関わらず常に表示)
    searchMarkerLayer = L.marker([lat, lon], {
      icon: L.divIcon({
        html: '<div style="font-size:26px;line-height:1;transform:translateY(-4px);">📍</div>',
        className: '',
        iconSize: [26, 26],
        iconAnchor: [13, 26],
      }),
    }).addTo(map);

    // 検索結果パネル(バッジ・標高情報等)の表示でmap要素の高さが変わるため、
    // Leafletが内部キャッシュしている古いサイズのままcenterがズレないよう、
    // setViewの直前に再計算させる
    map.invalidateSize();
    map.setView([lat, lon], Math.max(map.getZoom(), 13));
  } catch (e) {
    resultEl.innerHTML = '<div class="result-elev">Could not fetch elevation data. Please try again shortly.</div>';
  }
}

// ==== GCJ-02(百度地図・高徳地図などが使う中国独自座標系)→ WGS84 変換 ====
// 公開されているeviltransform等のアルゴリズムに準拠した標準的な変換式。
// 中国国外の座標は変換対象外(規制自体が中国国内向けのため)。
function outOfChina(lat, lon) {
  return lon < 72.004 || lon > 137.8347 || lat < 0.8293 || lat > 55.8271;
}

function gcj02Delta(lat, lon) {
  const a = 6378245.0;
  const ee = 0.00669342162296594323;
  let dLat = -100.0 + 2.0 * lon + 3.0 * lat + 0.2 * lat * lat + 0.1 * lon * lat + 0.2 * Math.sqrt(Math.abs(lon));
  dLat += (20.0 * Math.sin(6.0 * lon * Math.PI) + 20.0 * Math.sin(2.0 * lon * Math.PI)) * 2.0 / 3.0;
  dLat += (20.0 * Math.sin(lat * Math.PI) + 40.0 * Math.sin(lat / 3.0 * Math.PI)) * 2.0 / 3.0;
  dLat += (160.0 * Math.sin(lat / 12.0 * Math.PI) + 320 * Math.sin(lat * Math.PI / 30.0)) * 2.0 / 3.0;

  let dLon = 300.0 + lon + 2.0 * lat + 0.1 * lon * lon + 0.1 * lon * lat + 0.1 * Math.sqrt(Math.abs(lon));
  dLon += (20.0 * Math.sin(6.0 * lon * Math.PI) + 20.0 * Math.sin(2.0 * lon * Math.PI)) * 2.0 / 3.0;
  dLon += (20.0 * Math.sin(lon * Math.PI) + 40.0 * Math.sin(lon / 3.0 * Math.PI)) * 2.0 / 3.0;
  dLon += (150.0 * Math.sin(lon / 12.0 * Math.PI) + 300.0 * Math.sin(lon / 30.0 * Math.PI)) * 2.0 / 3.0;

  const radLat = lat / 180.0 * Math.PI;
  let magic = Math.sin(radLat);
  magic = 1 - ee * magic * magic;
  const sqrtMagic = Math.sqrt(magic);
  dLat = (dLat * 180.0) / ((a * (1 - ee)) / (magic * sqrtMagic) * Math.PI);
  dLon = (dLon * 180.0) / (a / sqrtMagic * Math.cos(radLat) * Math.PI);
  return { dLat, dLon };
}

function gcj02ToWgs84(lat, lon) {
  if (outOfChina(lat, lon)) return { lat, lon };
  const { dLat, dLon } = gcj02Delta(lat, lon);
  return { lat: lat - dLat, lon: lon - dLon };
}

// BD-09(百度地図)→ GCJ-02 変換(百度独自の追加オフセットを取り除く)
function bd09ToGcj02(lat, lon) {
  const xPi = Math.PI * 3000.0 / 180.0;
  const x = lon - 0.0065;
  const y = lat - 0.006;
  const z = Math.sqrt(x * x + y * y) - 0.00002 * Math.sin(y * xPi);
  const theta = Math.atan2(y, x) - 0.000003 * Math.cos(x * xPi);
  return { lat: z * Math.sin(theta), lon: z * Math.cos(theta) };
}

function bd09ToWgs84(lat, lon) {
  const gcj = bd09ToGcj02(lat, lon);
  return gcj02ToWgs84(gcj.lat, gcj.lon);
}

document.getElementById('searchBtn').addEventListener('click', () => {
  let lat = parseFloat(document.getElementById('searchLat').value);
  let lon = parseFloat(document.getElementById('searchLon').value);
  if (isNaN(lat) || isNaN(lon)) return;
  // 緯度は-90〜90の範囲しかありえない。範囲外なら経度と入れ替わっている可能性が高いので自動補正する
  // (百度地図など「経度,緯度」の順でコピーされるサイトからの貼り付けを想定)
  if ((lat < -90 || lat > 90) && lon >= -90 && lon <= 90) {
    [lat, lon] = [lon, lat];
  }
  const system = document.querySelector('input[name="coordSystem"]:checked').value;
  if (system === 'gcj02') {
    const converted = gcj02ToWgs84(lat, lon);
    lat = converted.lat; lon = converted.lon;
  } else if (system === 'bd09') {
    const converted = bd09ToWgs84(lat, lon);
    lat = converted.lat; lon = converted.lon;
  }
  queryPoint(lat, lon);
});

// 既存のqueryPoint()はactiveLayers(選択中のタブ)に応じて表示するバッジを絞り込むが、
// レポートは常に4種類すべてを計算するため、内部のリスク判定関数(earthquakeRiskInfo等)を

const HAZARD_DESCRIPTIONS = {
  earthquake: 'Historical earthquakes (M5.0+) within 100km, weighted by magnitude and distance.',
  typhoon: 'Historical typhoon tracks and wind intensity (JMA scale: Typhoon/Strong/Very Strong/Violent) near this location.',
