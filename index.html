<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>China Natural Catastrophe Risk Map</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.css" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
  :root {
    /* 【2026年9月改訂】本体アプリをログイン画面(案A・レーダー)と統一したダーク
       テーマに変更。PDFレポート(#reportView以下)は印刷物として白背景を維持する
       ため、別スコープの独自CSSのまま変更していない。 */
    --bg: #10151F;
    --panel: #1A2130;
    --border: #2A3348;
    --border-strong: #57668A;
    --text-primary: #F1F3F6;
    --text-muted: #9AA5B4;
    --text-faint: #6C7686;
    --navy: #3E6FB0;
    --navy-soft: #5C8DD1;
    --risk-low: #4CAF74;
    --risk-mid: #E8B94A;
    --risk-high: #E8823A;
    --risk-severe: #E14A3D;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; background: var(--bg); }
  body { font-family: 'Inter', sans-serif; }

  #app {
    position: relative;
    width: 100%;
    max-width: 430px;
    height: 100vh;
    max-height: 860px;
    margin: 0 auto;
    background: var(--bg);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    box-shadow: 0 0 0 1px var(--border);
  }

  /* デスクトップ(タブレット以上の幅)では、モバイル向けのカード状の枠(430px×860px)をやめて
     ビューポート全体に広げる。内部のチップ列は overflow-x: auto で元々折り返し対応済み、
     地図(#map)は flex: 1 で残り領域を自動で埋めるため、この幅指定だけで全画面表示になる。 */
  @media (min-width: 700px) {
    #app {
      max-width: 100vw;
      max-height: 100vh;
      width: 100vw;
      box-shadow: none;
    }
  }

  /* Header */
  .masthead-top {
    display: flex; align-items: flex-start; justify-content: space-between;
    padding: 16px 16px 12px; background: var(--panel); gap: 10px;
  }
  .brand { display: flex; align-items: center; gap: 11px; min-width: 0; flex: 1; cursor: pointer; }
  .seal-logo {
    width: 32px; height: 32px; border-radius: 6px; background: var(--navy);
    display: flex; align-items: center; justify-content: center;
    font-family: 'JetBrains Mono', monospace; font-weight: 700; color: #fff; font-size: 12px;
    letter-spacing: -0.5px; flex-shrink: 0;
  }
  .brand-text { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
  .brand-title {
    font-family: 'Inter', sans-serif; font-weight: 800; font-size: 17px;
    color: var(--text-primary); letter-spacing: -0.3px; line-height: 1.22;
  }
  .brand-sub {
    font-family: 'JetBrains Mono', monospace; font-size: 8.5px; letter-spacing: 0.8px;
    color: var(--text-faint); text-transform: uppercase; white-space: nowrap;
  }
  .methodology-btn {
    font-family: 'JetBrains Mono', monospace; font-size: 9.5px; font-weight: 600; letter-spacing: 0.5px;
    color: var(--text-muted); background: var(--bg); border: 1px solid var(--border-strong);
    border-radius: 5px; padding: 7px 10px; flex-shrink: 0;
  }
  .methodology-btn.active { color: #fff; background: var(--navy); border-color: var(--navy); }
  .header-actions {
    display: flex; flex-direction: column; align-items: stretch; gap: 5px; flex-shrink: 0;
  }
  .header-actions .methodology-btn {
    border: none; border-radius: 6px; text-align: center; width: auto;
    display: flex; align-items: center; justify-content: center; gap: 6px; white-space: nowrap;
    color: #fff; padding: 7px 14px;
    transition: filter 0.15s ease, transform 0.1s ease;
    box-shadow: 0 1px 2px rgba(26,33,48,0.15);
  }
  .header-actions .methodology-btn svg { flex-shrink: 0; opacity: 0.9; }
  .header-actions .methodology-btn:active { transform: scale(0.97); }
  #methodologyBtn { background: linear-gradient(135deg, var(--navy-soft), var(--navy)); }
  #methodologyBtn.active { filter: brightness(1.12); }
  #reportsBtn { background: linear-gradient(135deg, #4CA377, var(--risk-low)); }
  #reportsBtn:hover, #methodologyBtn:hover { filter: brightness(1.08); }
  .rule-thin { height: 1px; background: var(--border); }

  /* PC(横幅にゆとりがある画面): ボタンを縦積みではなく横並びにしてバランスを取る */
  @media (min-width: 640px) {
    .header-actions { flex-direction: row; gap: 8px; }
  }

  /* Methodology panel */
  .methodology-panel {
    display: none; padding: 12px 16px 14px; background: var(--panel);
    border-bottom: 1px solid var(--border); flex-shrink: 0;
  }
  .methodology-panel.visible { display: block; }

  /* Report panel (location input) */
  .report-panel {
    padding: 12px 16px 14px; background: var(--panel);
    border-bottom: 1px solid var(--border); flex-shrink: 0;
  }
  .report-loc-row {
    display: flex; flex-direction: column; gap: 6px; background: var(--panel);
    border: 1px solid var(--border-strong); border-radius: 6px; padding: 8px; margin-bottom: 8px;
  }
  .report-loc-row-head { display: flex; justify-content: space-between; align-items: center; }
  .report-loc-row input[type="text"] {
    font-family: 'Inter', sans-serif; font-size: 12px; padding: 6px 8px;
    background: var(--bg); color: var(--text-primary);
    border: 1px solid var(--border-strong); border-radius: 5px; width: 100%; box-sizing: border-box;
  }
  .report-loc-row .coords-row { display: flex; gap: 6px; }
  .report-loc-remove { font-family: 'JetBrains Mono', monospace; font-size: 10px; color: var(--text-muted); cursor: pointer; background:none; border:none; padding:2px; }
  .report-add-btn, .report-generate-btn {
    width: 100%; font-family: 'JetBrains Mono', monospace; font-size: 10.5px; font-weight: 600;
    letter-spacing: 0.5px; padding: 9px; border-radius: 6px; margin-top: 4px;
  }
  .report-add-btn { background: var(--panel); color: var(--navy); border: 1px dashed var(--border-strong); }
  .report-generate-btn { background: var(--navy); color: #fff; border: none; }
  .report-generate-btn:disabled { opacity: 0.5; }
  .report-status { font-family: 'Inter', sans-serif; font-size: 10.5px; color: var(--text-muted); margin-top: 6px; text-align: center; }

  /* Printable report view (built off-screen; must stay rendered—not display:none—so
     Chart.js/Plotly can lay out and html2canvas can capture it. Positioned off-viewport instead. */
  #reportView { position: fixed; top: 0; left: -99999px; width: 720px; background: #fff; z-index: -1; }
  #reportView:empty { left: -99999px; }
  #reportView { font-family: 'Inter', sans-serif; color: #0b0b0b; background: #fff; }
  #reportView .rpt-page { max-width: 720px; margin: 0 auto; padding: 30px 34px 26px; }

  /* --- ヘッダー: 細い罫線と大きめの余白で誌面らしさを出す --- */
  #reportView .rpt-head {
    display: flex; justify-content: space-between; align-items: flex-start;
    border-bottom: 2px solid #26215C; padding-bottom: 10px; margin-bottom: 22px;
  }
  #reportView .rpt-brand { display: flex; align-items: center; gap: 12px; }
  #reportView .rpt-logo {
    width: 68px; height: 22px; background: #f5f5f3; border-radius: 3px;
    font-family: 'JetBrains Mono', monospace; font-size: 9px; color: #b4b2ac;
    display: flex; align-items: center; justify-content: center; letter-spacing: 1px;
  }
  #reportView .rpt-title {
    font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 700;
    letter-spacing: 2.4px; text-transform: uppercase; color: #26215C;
  }
  #reportView .rpt-meta {
    font-family: 'JetBrains Mono', monospace; font-size: 9px; color: #898781;
    text-align: right; letter-spacing: 0.6px; line-height: 1.7;
  }

  /* --- 拠点名: 大きく、座標はモノスペースで --- */
  #reportView .rpt-loc-name { font-size: 25px; font-weight: 700; letter-spacing: -0.4px; line-height: 1.15; }
  #reportView .rpt-loc-coords {
    font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #898781;
    margin-top: 5px; margin-bottom: 20px; letter-spacing: 0.5px;
  }

  /* --- 複合ハザードのヒーローブロック --- */
  #reportView .rpt-hero {
    border: 1px solid #e4e2dc; border-left: 5px solid #26215C; border-radius: 3px;
    padding: 16px 18px; margin-bottom: 22px; background: #fbfbfa;
  }
  #reportView .rpt-hero-top { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; }
  #reportView .rpt-hero-k {
    font-family: 'JetBrains Mono', monospace; font-size: 9px; font-weight: 700;
    letter-spacing: 1.8px; text-transform: uppercase; color: #898781; margin-bottom: 5px;
  }
  #reportView .rpt-hero-v { font-size: 30px; font-weight: 700; line-height: 1; letter-spacing: -0.8px; }
  #reportView .rpt-hero-score {
    font-family: 'JetBrains Mono', monospace; font-size: 30px; font-weight: 700;
    line-height: 1; letter-spacing: -1px;
  }
  #reportView .rpt-hero-driver {
    font-family: 'Inter', sans-serif; font-size: 11px; color: #52514e; margin-top: 9px;
  }
  #reportView .rpt-hero-driver b { font-weight: 700; }

  /* --- 内訳の横棒 --- */
  #reportView .rpt-bd { margin-top: 14px; padding-top: 13px; border-top: 1px solid #e8e6e0; }
  #reportView .rpt-bd-row { display: flex; align-items: center; gap: 10px; margin-bottom: 7px; }
  #reportView .rpt-bd-row:last-child { margin-bottom: 0; }
  #reportView .rpt-bd-name {
    font-family: 'JetBrains Mono', monospace; font-size: 9.5px; letter-spacing: 0.8px;
    text-transform: uppercase; color: #52514e; width: 82px; flex-shrink: 0;
  }
  #reportView .rpt-bd-track { flex: 1; height: 5px; background: #ecebe6; border-radius: 3px; overflow: hidden; }
  #reportView .rpt-bd-fill { height: 100%; border-radius: 3px; }
  #reportView .rpt-bd-val {
    font-family: 'JetBrains Mono', monospace; font-size: 10px; color: #52514e;
    width: 30px; text-align: right; flex-shrink: 0;
  }

  /* --- 各ハザードのセクション --- */
  #reportView .rpt-section { margin-bottom: 20px; }
  #reportView .rpt-h {
    font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 700;
    letter-spacing: 1.8px; text-transform: uppercase; color: #26215C;
    padding-bottom: 5px; border-bottom: 1px solid #e8e6e0; margin-bottom: 9px;
  }
  #reportView .rpt-desc { font-size: 9.5px; color: #898781; line-height: 1.65; margin-bottom: 10px; }
  #reportView .rpt-bar-wrap { position: relative; height: 7px; border-radius: 4px; margin: 12px 0 11px; }
  #reportView .rpt-bar-marker { position: absolute; top: -10px; transform: translateX(-50%); font-size: 9px; color: #26215C; }
  #reportView .rpt-badge {
    font-size: 11px; font-weight: 700; padding: 4px 11px; border-radius: 4px;
    display: inline-block; letter-spacing: 0.2px;
  }
  #reportView .rpt-comment { font-size: 10.5px; color: #52514e; line-height: 1.6; margin-top: 8px; }
  #reportView .rpt-mono { font-family: 'JetBrains Mono', monospace; font-size: 10.5px; line-height: 1.75; }

  /* --- 数値を並べる小さなキー・バリュー --- */
  #reportView .rpt-kv { display: flex; gap: 26px; margin: 10px 0 4px; flex-wrap: wrap; }
  #reportView .rpt-kv-item { }
  #reportView .rpt-kv-k {
    font-family: 'JetBrains Mono', monospace; font-size: 8.5px; letter-spacing: 1.2px;
    text-transform: uppercase; color: #b4b2ac; margin-bottom: 2px;
  }
  #reportView .rpt-kv-v { font-family: 'JetBrains Mono', monospace; font-size: 14px; font-weight: 700; color: #26215C; }

  /* --- ポートフォリオ一覧ページ --- */
  #reportView .rpt-sum-title { font-size: 25px; font-weight: 700; letter-spacing: -0.4px; margin-bottom: 4px; }
  #reportView .rpt-sum-sub { font-size: 11px; color: #898781; margin-bottom: 22px; }
  #reportView table.rpt-tbl { width: 100%; border-collapse: collapse; }
  #reportView table.rpt-tbl th {
    font-family: 'JetBrains Mono', monospace; font-size: 8.5px; font-weight: 700;
    letter-spacing: 1.2px; text-transform: uppercase; color: #898781;
    text-align: left; padding: 0 6px 7px; border-bottom: 1.5px solid #26215C;
  }
  #reportView table.rpt-tbl th.num, #reportView table.rpt-tbl td.num { text-align: right; }
  #reportView table.rpt-tbl td {
    padding: 9px 6px; border-bottom: 1px solid #eeece7; font-size: 11.5px; vertical-align: middle;
  }
  #reportView table.rpt-tbl td.mono { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #52514e; }
  #reportView .rpt-pill {
    display: inline-block; font-family: 'JetBrains Mono', monospace; font-size: 9.5px;
    font-weight: 700; padding: 3px 8px; border-radius: 3px; letter-spacing: 0.4px;
  }
  #reportView .rpt-rank {
    font-family: 'JetBrains Mono', monospace; font-size: 10px; color: #b4b2ac; width: 20px;
  }

  #reportView .rpt-footer {
    border-top: 1px solid #e8e6e0; padding-top: 11px; margin-top: 22px;
    font-size: 8.5px; color: #b4b2ac; line-height: 1.7;
  }
  #reportView .rpt-footer b { color: #898781; font-weight: 700; }
  #reportView .rpt-copyright {
    font-family: 'JetBrains Mono', monospace; font-size: 8.5px; color: #898781;
    letter-spacing: 0.4px; margin-top: 7px; padding-top: 7px; border-top: 1px solid #eeece7;
  }
  .method-item { margin-bottom: 10px; }
  .method-item:last-child { margin-bottom: 0; }
  .method-label {
    display: flex; align-items: center; gap: 6px;
    font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 700;
    letter-spacing: 0.5px; text-transform: uppercase; color: var(--text-primary); margin-bottom: 3px;
  }
  .method-label .dot { width: 7px; height: 7px; border-radius: 2px; flex-shrink: 0; }
  .method-desc { font-family: 'Inter', sans-serif; font-size: 11px; line-height: 1.55; color: var(--text-muted); }

  /* Layer toggle chips */
  .layer-bar {
    display: flex; gap: 8px; padding: 10px 16px; overflow-x: auto;
    border-bottom: 1px solid var(--border); flex-shrink: 0; background: var(--panel);
  }
  .layer-chip {
    display: flex; align-items: center; gap: 6px;
    font-family: 'Inter', sans-serif; font-size: 11.5px; font-weight: 600;
    padding: 6px 12px; border-radius: 6px; white-space: nowrap; flex-shrink: 0;
    border: 1px solid var(--border-strong); background: var(--bg); color: var(--text-muted);
  }
  .layer-chip .dot { width: 7px; height: 7px; border-radius: 2px; flex-shrink: 0; }
  .layer-chip.active { color: #fff; border-color: transparent; }

  /* Search panel */
  .search-bar {
    display: flex; flex-direction: column; gap: 7px; padding: 10px 16px;
    border-bottom: 1px solid var(--border); background: var(--panel); flex-shrink: 0;
  }
  .search-row { display: flex; gap: 8px; align-items: center; }
  .search-row input {
    flex: 1; min-width: 0; font-family: 'JetBrains Mono', monospace; font-size: 12px;
    background: var(--bg); color: var(--text-primary); border: 1px solid var(--border-strong);
    border-radius: 6px; padding: 8px 9px;
  }
  .search-row input::placeholder { color: var(--text-faint); }
  .search-row button {
    font-family: 'Inter', sans-serif; font-size: 12px; font-weight: 700;
    background: var(--navy); color: #fff; border: none; border-radius: 6px;
    padding: 9px 16px; flex-shrink: 0;
  }
  .search-hint { font-size: 10px; color: var(--text-faint); }
  .search-result {
    display: none; padding: 7px 16px; background: var(--panel);
    border-bottom: 1px solid var(--border); flex-shrink: 0;
  }
  .search-result.visible { display: block; }
  .result-badge {
    display: inline-block; font-family: 'Inter', sans-serif; font-weight: 700; font-size: 11.5px;
    padding: 3px 9px; border-radius: 5px; margin-bottom: 3px; color: #fff;
  }
  .result-elev { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--text-primary); margin-bottom: 3px; line-height: 1.25; }
  .rp-group {
    display: flex; gap: 10px; margin-bottom: 5px;
    font-family: 'Inter', sans-serif; font-size: 11px; color: var(--text-muted);
  }
  .rp-group label { display: flex; align-items: center; gap: 4px; cursor: pointer; }
  .risk-legend { display: flex; align-items: center; gap: 6px; margin-top: 2px; }
  .risk-legend-bar-wrap { position: relative; flex: 1; padding-top: 7px; }
  .risk-legend-bar {
    display: flex; height: 10px; border-radius: 5px; overflow: hidden;
  }
  .risk-legend-bar span { flex: 1; box-shadow: inset 0 0 0 1px rgba(255,255,255,0.25); }
  .risk-legend-marker {
    position: absolute; top: 0; transform: translateX(-50%);
    font-size: 9px; line-height: 1; color: var(--text-primary); pointer-events: none;
  }
  /* 【2026年9月修正】justify-content:space-betweenは各ラベルの「自分の文字幅」を
     基準に均等配置するだけで、上の色ブロック(5等分のflex:1)とは連動していなかった。
     "Low"が左端に寄り、"Moderate"や"Extreme"のような長い単語ほど、対応する色の
     真下からずれて見えていた。ラベル側も同じ5等分(flex:1)にし、それぞれを中央揃え
     にすることで、色ブロックの真下に文字が来るようにする。 */
  .risk-legend-labels {
    display: flex; font-family: 'JetBrains Mono', monospace;
    font-size: 8px; color: var(--text-faint); margin-top: 0px;
  }
  .risk-legend-labels span { flex: 1; text-align: center; }
  .result-freq {
    font-family: 'JetBrains Mono', monospace; font-size: 9px; color: var(--text-muted);
    margin-top: 2px; line-height: 1.25;
  }

  /* Map */
  #map, #map * {
    -webkit-touch-callout: none; -webkit-user-select: none; user-select: none;
  }
  #map {
    flex: 1; width: 100%; background: var(--bg);
  }
  .leaflet-popup-content-wrapper {
    background: var(--panel); color: var(--text-primary); border: 1px solid var(--border);
    border-radius: 6px; font-family: 'Inter', sans-serif; box-shadow: 0 2px 10px rgba(26,33,48,0.12);
  }
  .leaflet-popup-tip { background: var(--panel); }
  .leaflet-popup-content { margin: 10px 12px; font-size: 12px; line-height: 1.6; }
  .popup-title { font-family: 'Inter', sans-serif; font-weight: 700; font-size: 13px; color: var(--text-primary); margin-bottom: 4px; }
  .popup-row { color: var(--text-muted); font-size: 11px; }

  .status-bar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 7px 16px; border-top: 1px solid var(--border); background: var(--panel); flex-shrink: 0;
  }
  .mono-small {
    font-family: 'JetBrains Mono', monospace; font-size: 9.5px; letter-spacing: 0.5px;
    color: var(--text-faint); text-transform: uppercase;
  }
  .app-copyright {
    font-family: 'JetBrains Mono', monospace; font-size: 10px; color: var(--text-faint);
    padding: 0 16px 12px; background: var(--panel); letter-spacing: 0.3px;
  }
  .legend-note { font-family: 'Inter', sans-serif; font-size: 10.5px; color: var(--text-muted); line-height: 1.55; padding: 0 16px 10px; background: var(--panel); }
  /* 【2026年9月追加】status-bar(1行)は常に表示、その下の凡例説明・著作権はまとめて
     折りたたむ。ヘッダーの折りたたみと同じ「Show more」の言葉・挙動に揃えている。 */
  #footerExtra.collapsed { display: none; }
  .footer-toggle {
    font-family: 'JetBrains Mono', monospace; font-size: 9.5px; font-weight: 600;
    letter-spacing: 0.5px; color: var(--navy-soft); cursor: pointer;
    padding: 6px 16px; background: var(--panel); display: block;
  }
  /* ============================================================
     ログインゲート(2026年9月追加)
     静的サイト(GitHub Pages)のためブラウザ側の確認のみ。ページソースを
     直接読める人には効果が無い点に注意(本格的な保護にはCloudflare Access等が要る)。
     パスワードは平文でソースに残さず、SHA-256ハッシュとの比較で判定する。
     ============================================================ */
  #loginGate {
    position: fixed; inset: 0; z-index: 9999;
    display: flex; align-items: center; justify-content: center;
    background:
      radial-gradient(circle at 20% 20%, rgba(217,162,44,0.10), transparent 45%),
      radial-gradient(circle at 80% 75%, rgba(44,78,124,0.35), transparent 50%),
      linear-gradient(160deg, #0B1220 0%, #131B2C 45%, #1A2130 100%);
    overflow: hidden;
  }
  #loginGate.hidden { display: none; }
  #loginGate .scan-ring {
    position: absolute; border: 1px solid rgba(217,162,44,0.14); border-radius: 50%;
    left: 50%; top: 50%; transform: translate(-50%, -50%);
    animation: scanPulse 4.5s ease-out infinite;
  }
  #loginGate .scan-ring.r2 { animation-delay: 1.5s; }
  #loginGate .scan-ring.r3 { animation-delay: 3s; }
  @keyframes scanPulse {
    0%   { width: 40px; height: 40px; opacity: 0.9; }

<!-- 標高タイル(AW3D30 150m)の地点参照用: HTTPレンジリクエストで該当ピクセルだけを読み取る -->
<script src="https://cdn.jsdelivr.net/npm/geotiff@2.1.3/dist-browser/geotiff.js"></script>
<script>
// Peril identity colors (used for chip dots / markers — distinguishes hazard TYPE)
const COLORS = {
  earthquake: '#C13A2E',
  lightning: '#D9A22C',
  typhoonHazard: '#2C4E7C',
  waterHazard: '#3F8F5F',
};

// Gray used to mark grid cells with no data (outside CHIRPS coverage etc.) — must never be
// confused with "low risk"; always paired with a "no data" label wherever it's used.
const NO_DATA_COLOR = '#9AA3AF';

// Risk-intensity gradient used inside every hazard heatmap (severity, independent of peril type)
// ヒートマップ用グラデーション。下部の5段階凡例(WARNING_TIER_COLORS: Low→Extreme)と
// 色を完全に一致させるため、同じ5色を均等配置している(以前は独自の緑→黄→赤の3色で、
// 低強度側が凡例の黄色と合わず緑色に見えるズレがあった)。
const HAZARD_GRADIENT = { 0.0: '#D9A22C', 0.25: '#D9722C', 0.5: '#C13A2E', 0.75: '#7A3B8C', 1.0: '#C13A7A' };

// Bounding box used as a cheap first-pass filter before the coastline polygon test
const CHINA_LAND_BBOX = { minlat: 18, maxlat: 41, minlon: 97, maxlon: 123 };

// Rough coastline polygon (mainland China only, Taiwan Strait kept on the mainland side)
// used to exclude open-water track points that a simple bounding box would still include
// (e.g. the East China Sea, Yellow Sea, and Bohai Sea). Approximate, for visualization only.
const CHINA_COASTLINE_POLYGON = [
  [97, 18], [108, 18], [110, 20.2], [112.5, 21.5], [113.6, 22.2], [116.7, 23.4],
  [118.2, 24.5], [119.6, 24.9], [120.2, 26.0], [120.8, 27.9], [121.6, 29.0],
  [121.9, 30.8], [122.1, 31.6], [121.0, 32.1], [120.2, 33.3], [119.5, 34.3],
  [119.0, 35.1], [119.6, 36.0], [120.8, 37.0], [121.6, 37.4], [122.6, 37.8],
  [121.0, 38.9], [122.5, 40.0], [124.3, 40.0], [126.5, 42.5], [130.5, 46.0],
  [134.5, 48.5], [131.0, 50.5], [120.0, 53.5], [97, 53.5],
];

// Ray-casting point-in-polygon test
function isOnLand(lat, lon) {
  const poly = CHINA_COASTLINE_POLYGON;
  let inside = false;
  for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
    const [xi, yi] = poly[i], [xj, yj] = poly[j];
    const intersect = ((yi > lat) !== (yj > lat)) &&
      (lon < (xj - xi) * (lat - yi) / (yj - yi) + xi);
    if (intersect) inside = !inside;
  }
  return inside;
}

const LAYERS = [
  { key: 'earthquake', label: 'Earthquakes', color: COLORS.earthquake,
    note: 'Earthquakes: historical M5.0+ events across China, based on USGS earthquake catalog data. Marker size scales with magnitude.' },
  { key: 'lightning', label: 'Lightning', color: COLORS.lightning,
    note: 'Lightning: historical stroke density (2010–2023 multi-year mean) from the WWLLN Global Lightning Climatology. A climatological average, not real-time data. Map-wide view not shown; search a point to see the evaluation.' },
  { key: 'typhoonHazard', label: 'Typhoon Hazard', color: COLORS.typhoonHazard,
    note: 'Typhoon Hazard: created based on historical typhoon track and wind speed data. Reflects past activity, not a forecast.' },
  { key: 'waterHazard', label: 'Water Hazard', color: COLORS.waterHazard,
    note: 'Water Hazard: evaluates three flood mechanisms separately — river flooding, surface water flooding, and coastal storm surge — and reports the most severe of the three, adjusted by past flood records. Map-wide view not shown (a national approximation was not reliable enough); search a point to see the evaluation, which uses 150m elevation tiles.' },
];

// 地点検索で「評価バッジ+リスク凡例」を表示する4レイヤー
const BADGE_LAYER_KEYS = ['earthquake', 'typhoonHazard', 'lightning', 'waterHazard'];

// 各データセットの提供者・ライセンス表記。無償公開データでも「出典の明示」は
// ライセンス条件そのものであり、商用提供時は省略できない。画面(METHODOLOGY)と
// PDFレポートの両方に出す。
const DATA_ATTRIBUTION = [
  ['Base map', '© OpenStreetMap contributors, © CARTO'],
  ['Earthquakes', 'USGS Earthquake Catalog — U.S. Geological Survey'],
  ['Typhoons', 'IBTrACS — NOAA National Centers for Environmental Information / WMO'],
  ['Rainfall', 'CHIRPS — Climate Hazards Center, UC Santa Barbara'],
  ['Elevation', 'ALOS World 3D-30m (AW3D30) © JAXA — used under the AW3D30 Terms of Use'],
  ['Rivers', 'HydroRIVERS / HydroSHEDS — Lehner, B., Grill, G. (2013). hydrosheds.org'],
  ['Flood records', 'Dartmouth Flood Observatory, University of Colorado'],
  ['Lightning', 'WGLC — Kaplan, J.O. & Lau, K.H.-K. (2021), derived from WWLLN'],
  ['Lakes', '© OpenStreetMap contributors (Overpass API)'],
];

const METHODOLOGY = [
  { label: 'Earthquakes', color: COLORS.earthquake,
    desc: 'Source: USGS Earthquake Catalog. Historical M5.0+ events across China, updated periodically.' },
  { label: 'Lightning', color: COLORS.lightning,
    desc: 'Source: WWLLN Global Lightning Climatology (WGLC), 2010–2023 multi-year mean stroke density. Colored by relative density within China (not an official risk classification). A historical average, not a real-time warning.' },
  { label: 'Typhoon Hazard', color: COLORS.typhoonHazard,
    desc: 'Source: IBTrACS historical typhoon track data. Reflects past storm activity along the China coast, not a forecast.' },
  { label: 'Water Hazard', color: COLORS.waterHazard,
    desc: 'Three flood mechanisms are evaluated separately and the most severe one is reported: river flooding (distance to river, river scale, height above the river), surface water flooding (extreme rainfall intensity combined with how low-lying the site is relative to its surroundings), and coastal storm surge (elevation against a surge level that decays inland). Proximity to a river confluence increases the river flooding term modestly. Past flood records adjust the result upward by at most 20%. The point search reads 150m elevation tiles directly; the map-wide layer is an approximation that omits the local terrain terms. A simplified reference indicator, not a hydrodynamic flood simulation. Areas with no data are left blank on the map, not colored gray or treated as low risk.' },
  { label: 'Point Lookup', color: '#5C6675',
    desc: 'On-demand elevation lookup for the tapped point and its surroundings, plus a shaded grid reflecting nearby hazard data for each active layer. The risk badge and comparison grid appear while the Water Hazard chip is active.' },
];

// 雷: WGLC(WWLLN Global Lightning Climatology)由来のgeojsonをキャッシュする(読込直後に1回だけ設定)
let lightningGeojsonCacheGlobal = null;

function inLandBbox(lat, lon) {
  // Cheap first-pass filter, then a finer coastline polygon check to exclude open water
  const inBox = lat >= CHINA_LAND_BBOX.minlat && lat <= CHINA_LAND_BBOX.maxlat &&
                lon >= CHINA_LAND_BBOX.minlon && lon <= CHINA_LAND_BBOX.maxlon;
  return inBox && isOnLand(lat, lon);
}

let map, layerGroups = {};
let activeLayers = new Set();

// ============================================================================
// ベースマップ設定
//
// 経緯: CARTOのラスタータイル(basemaps.cartocdn.com/light_nolabels/...)は
// 2026年にAPIキー必須となり、かつ提供元がラスター方式そのものを廃止予定と公表した。
// 2026年8月にEsriのレガシーラスター(services.arcgisonline.com)へ一度移行したが、
// 表示速度が許容できずCARTOへ差し戻した経緯がある(maxNativeZoom未設定だけが
// 原因ではなかった)。廃止予定のエンドポイントに依存し続けるのは避けたいため、
// 2026年9月にCARTOのベクタータイル(MapLibre GL)へ移行した。
//
// APIキー: https://carto.com/basemaps/apikey で取得(CARTOアカウント不要)。
// 無償枠は月500万タイルリクエスト。本ツールは社内の引受担当者が使う想定で、
// 地図画像を外部配布しないため、この枠に達する見込みはない。
//
// 切り戻し: provider を 'carto-raster' または 'esri-raster' に変えれば、
// 以前の方式に戻せる。ベクター表示に問題が出た場合の退避経路として残してある。
// ============================================================================
const BASEMAP = {
  provider: 'carto-vector',   // 'carto-vector' | 'carto-raster' | 'esri-raster'
  cartoApiKey: 'cb1_3fun_1_56200e5c94e0e98337195b60', // 2026年9月 取得・設定済み
  // 【2026年9月追加】CARTOはキー1つで複数のベーススタイルを提供している。
  // 'positron' = 白基調(既定、可視化向け)/ 'voyager' = やや色付きのバランス型
  // (道路・緑地に色が付く)/ 'dark-matter' = 黒基調のダークテーマ。
  cartoStyle: 'positron',
};

function addRasterFallback(m, attribCarto) {
  // 【2026年9月修正】CARTOのラスター版(light_nolabels等)は、CARTOのAPIキー必須化に
  // 伴いキー無しだと「API KEY REQUIRED」の透かし入りタイルしか返らなくなった
  // (地図がほぼ何も見えない状態になる)。キー未設定の間は、キー不要で確実に表示できる
  // OpenStreetMap標準タイルに緊急避難する。CARTOキーを設定すれば、このelse節ではなく
  // 上のif節(CARTOラスター)が使われるようになる。
  if (BASEMAP.cartoApiKey) {
    const key = `?key=${encodeURIComponent(BASEMAP.cartoApiKey)}`;
    L.tileLayer(`https://{s}.basemaps.cartocdn.com/light_nolabels/{z}/{x}/{y}{r}.png${key}`, {
      attribution: attribCarto, subdomains: 'abcd', maxZoom: 19,
    }).addTo(m);
    L.tileLayer(`https://{s}.basemaps.cartocdn.com/light_only_labels/{z}/{x}/{y}{r}.png${key}`, {
      subdomains: 'abcd', maxZoom: 19,
    }).addTo(m);
  } else {
    console.warn('CARTOのAPIキーが無いため、キー不要のOpenStreetMap標準タイルで表示しています。見た目を統一したい場合はcartoApiKeyを設定してください。');
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap contributors', subdomains: 'abc', maxZoom: 19,
    }).addTo(m);
    // 【2026年9月追加】CARTOキー未設定の間、OSM標準タイル(道路が黄色・公園が緑など
    // 色数が多い)をCSSフィルタで脱色し、白基調に近づける簡易処置。CARTOのPositron
    // スタイルそのものではないため完全に同じ見た目にはならない。tilePaneはL.tileLayer
    // (ラスタータイル)専用で、ハザードのL.rectangle/L.heatLayerはoverlayPane側に
    // 描画されるため、この処理はハザード表示の色には影響しない。実際の見え方は
    // 未検証のため、気に入らなければ数値を調整するか、cartoApiKeyの設定に切り替えること。
    const tilePane = m.getPane('tilePane');
    if (tilePane) tilePane.style.filter = 'grayscale(0.5) brightness(1.12) contrast(0.92) saturate(0.6)';
  }
}

function addBasemap(m) {
  const attribCarto = '&copy; OpenStreetMap contributors &copy; CARTO';

  if (BASEMAP.provider === 'carto-vector') {
    // 【2026年9月修正】APIキーが空のままMapLibre GLのベクタースタイルを読みに行くと、
    // CARTO側がエラーを返し、そのエラーオブジェクトをMapLibreの内部Web Workerに渡そうと
    // した際に DataCloneError で地図初期化そのものが落ちる不具合があった。
    // キー未設定の間はベクター処理に入らず、安全なラスター版に自動フォールバックする。
    if (!BASEMAP.cartoApiKey) {
      console.warn('BASEMAP.cartoApiKey が未設定のため、ベクタータイルの代わりにラスター版で表示します。https://carto.com/basemaps/apikey で取得し、cartoApiKeyに設定してください。');
      addRasterFallback(m, attribCarto);
      return;
    }
    try {
      // MapLibre GLのベクタータイルをLeafletのレイヤーとして重ねる。
      // ハザードのオーバーレイは従来どおりLeaflet側に描くため、他の実装は変更不要。
      const styleUrl = `https://basemaps.cartocdn.com/gl/${BASEMAP.cartoStyle}-gl-style/style.json`
        + `?key=${encodeURIComponent(BASEMAP.cartoApiKey)}`;
      L.maplibreGL({ style: styleUrl, attribution: attribCarto }).addTo(m);
    } catch (e) {
      // キーがあってもスタイル取得やWorker初期化で失敗する可能性があるため、
      // ここでも握りつぶさずログを残した上でラスター版に落とす。
      console.error('ベクタータイルの初期化に失敗しました。ラスター版に切り替えます。', e);
      addRasterFallback(m, attribCarto);
    }
    return;
  }

  if (BASEMAP.provider === 'esri-raster') {
    // ArcGIS RESTのタイルURLは {z}/{y}/{x} の順(CARTOの {z}/{x}/{y} と異なる)。
    // 実データは世界的にズーム13程度までのため、maxNativeZoomを必ず設定する。
    const base = 'https://services.arcgisonline.com/ArcGIS/rest/services/Canvas/';
    L.tileLayer(base + 'World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}', {
      attribution: '&copy; Esri &copy; OpenStreetMap contributors',
      maxZoom: 16, maxNativeZoom: 13,
    }).addTo(m);
    L.tileLayer(base + 'World_Light_Gray_Reference/MapServer/tile/{z}/{y}/{x}', {
      maxZoom: 16, maxNativeZoom: 13,
    }).addTo(m);
    return;
  }

  addRasterFallback(m, attribCarto);
}

function initMap() {
  map = L.map('map', { zoomControl: true, attributionControl: true }).setView([31.57, 120.30], 11);
  // デスクトップでウィンドウ幅を変えた時など、#appのサイズが変わってもLeafletが
  // 内部キャッシュしたサイズのままだとタイルが崩れるため、リサイズのたびに再計算する
  window.addEventListener('resize', () => map.invalidateSize());
  addBasemap(map);

  layerGroups.earthquake = L.layerGroup();
  layerGroups.lightning = L.layerGroup();
  layerGroups.typhoonHazard = L.layerGroup();
  layerGroups.waterHazard = L.layerGroup();
}

function renderLayerBar() {
  const bar = document.getElementById('layerBar');
  // 【2026年9月修正】チップの見た目を activeLayers(別管理の状態)ではなく、
  // 地図に実際にレイヤーが乗っているか(map.hasLayer、Leaflet側の実際の状態)で
  // 決めるようにした。地震・台風のチップが、実際にはデータが表示されているのに
  // 「押されていない」見た目のままになる不具合の報告があり、原因はコードの
  // 読み合わせでは特定できなかったため、別々の状態を持たずLeafletの実態を
  // そのまま見る形にして、構造的にズレが起きないようにした。
  bar.innerHTML = LAYERS.map(l => {
    const active = map.hasLayer(layerGroups[l.key]);
    return `<button class="layer-chip${active ? ' active' : ''}" style="${active ? `background:${l.color};border-color:${l.color};` : ''}" data-key="${l.key}">
      <span class="dot" style="background:${active ? '#fff' : l.color};"></span>${l.label}
    </button>`;
  }).join('');
  bar.querySelectorAll('.layer-chip').forEach(btn => {
    btn.addEventListener('click', () => {
      const key = btn.dataset.key;
      if (activeLayers.has(key)) {
        activeLayers.delete(key);
        map.removeLayer(layerGroups[key]);
      } else {
        activeLayers.add(key);
        map.addLayer(layerGroups[key]);
      }
      // 評価バッジ(地震・台風・雷・水害)のいずれかをON/OFFしたら、地点検索の結果表示を
      // 直前の検索地点で再計算する。全てOFFになった場合は非表示にする。
      if (BADGE_LAYER_KEYS.includes(key)) {
        const anyBadgeActive = BADGE_LAYER_KEYS.some(k => activeLayers.has(k));
        if (!anyBadgeActive) {
          const resultEl = document.getElementById('searchResult');
          resultEl.className = 'search-result';
          resultEl.innerHTML = '';
        } else if (lastQueriedLatLon) {
          queryPoint(lastQueriedLatLon.lat, lastQueriedLatLon.lon);
        }
      }
      renderLayerBar();
      updateLegend();
    });
  });
}

}

async function loadEarthquakes() {
  document.getElementById('statusLabel').textContent = 'Fetching earthquakes…';

  // Prefer the pre-generated, backfilled dataset (scripts/fetch_earthquakes.py)
  const geojson = await fetchGeojsonSafe('data/earthquakes.geojson');

  if (geojson) {
    earthquakeGeojsonCache = geojson;
    let count = 0;
    let minTime = Infinity, maxTime = -Infinity;
    geojson.features.forEach(f => {
      const [lon, lat] = f.geometry.coordinates;
      const p = f.properties || {};
      const mag = p.mag || 0;
      // 地点検索(earthquakeTileColor)と同じ閾値で、地図上のマーカーもマグニチュードに応じた5段階配色にする
      let tier;
      if (mag < 5.5) tier = 0;
      else if (mag < 6.0) tier = 1;
      else if (mag < 6.5) tier = 2;
      else if (mag < 7.0) tier = 3;
      else tier = 4;
      const tierColor = EARTHQUAKE_TIER_COLORS[tier];
      const marker = L.circleMarker([lat, lon], {
        radius: Math.max(4, mag * 2.2),
        color: tierColor, weight: 1.5, fillColor: tierColor, fillOpacity: 0.35,
      });
      const date = p.time ? new Date(p.time).toLocaleDateString('en-US') : '';
      marker.bindPopup(`<div class="popup-title">M${mag.toFixed(1)} Earthquake</div>
        <div class="popup-row">${escapeHtml(p.place)}</div>
        <div class="popup-row">${date}</div>`);
      marker.addTo(layerGroups.earthquake);
      count++;
      if (p.time) { minTime = Math.min(minTime, p.time); maxTime = Math.max(maxTime, p.time); }
    });
    const minYear = isFinite(minTime) ? new Date(minTime).getFullYear() : '—';
    const maxYear = isFinite(maxTime) ? new Date(maxTime).getFullYear() : '—';
    dataRanges.earthquake = `${minYear}–${maxYear}`;
    earthquakeFallbackLive = false;
    document.getElementById('statusLabel').textContent = `Data range: ${minYear}–${maxYear}`;
    document.getElementById('countLabel').textContent = `${count} earthquakes (M5.0+)`;
    return;
  }

  // Fallback: live last-30-days query, used only until the backfilled file exists
  // 【2026年9月】このフォールバックに落ちると評価の土台が50年分から30日分になる。
  // 実データではあるが、地震ハザードは著しく低く出る。レポートに明示する。
  earthquakeFallbackLive = true;
  dataRanges.earthquake = 'last 30 days only (pre-generated catalog unavailable)';
  try {
    const url = 'https://earthquake.usgs.gov/fdsnws/event/1/query?format=geojson&starttime=' +
      new Date(Date.now() - 30 * 86400000).toISOString().slice(0,10) +
      '&minlatitude=18&maxlatitude=54&minlongitude=73&maxlongitude=135&minmagnitude=3.5';
    const res = await fetch(url);
    const data = await res.json();
    let count = 0;
    (data.features || []).forEach(f => {
      const [lon, lat] = f.geometry.coordinates;
      const mag = f.properties.mag || 0;
      let tier;
      if (mag < 5.5) tier = 0;
      else if (mag < 6.0) tier = 1;
      else if (mag < 6.5) tier = 2;
      else if (mag < 7.0) tier = 3;
      else tier = 4;
      const tierColor = EARTHQUAKE_TIER_COLORS[tier];
      const marker = L.circleMarker([lat, lon], {
        radius: Math.max(4, mag * 2.2),
        color: tierColor, weight: 1.5, fillColor: tierColor, fillOpacity: 0.35,
      });
      const date = new Date(f.properties.time).toLocaleString('en-US');
      marker.bindPopup(`<div class="popup-title">M${mag.toFixed(1)} Earthquake</div>
        <div class="popup-row">${escapeHtml(f.properties.place)}</div>
        <div class="popup-row">${date}</div>`);
      marker.addTo(layerGroups.earthquake);
      count++;
    });
    document.getElementById('statusLabel').textContent = 'Live feed (last 30 days) — backfill not yet generated';
    document.getElementById('countLabel').textContent = `${count} earthquakes (30d, M3.5+)`;
  } catch (e) {
    document.getElementById('statusLabel').textContent = 'Failed to load earthquake data';
  }
}

async function fetchGeojsonSafe(path) {
  try {
    const res = await fetch(path);
    if (!res.ok) return null;
    const geojson = await res.json();
    if (!geojson.features || geojson.features.length === 0) return null;
    return geojson;
  } catch (e) {
    return null;
  }
}

// 海岸線・河川合流部は {"points": [[lon, lat], ...]} という独自形式で、GeoJSONではない。
// fetchGeojsonSafe は features を持たないJSONをnullとして捨てるため、こちらを使う。
async function fetchPointsSafe(path) {
  try {
    const res = await fetch(path);
    if (!res.ok) return null;
    const json = await res.json();
    if (!Array.isArray(json.points) || json.points.length === 0) return null;
    return json;
  } catch (e) {
    return null;
  }
}

// HAZARD_GRADIENTの色停止点(0/0.25/0.5/0.75/1.0)の間を線形補間して、weight(0〜1)に対応する
// 1色を返す。台風の軌跡を線(ポリライン)で描くために使う(ヒートマップの色と統一するため)。
const HAZARD_GRADIENT_STOPS = [
  [0.0, [0xD9, 0xA2, 0x2C]], [0.25, [0xD9, 0x72, 0x2C]], [0.5, [0xC1, 0x3A, 0x2E]],
  [0.75, [0x7A, 0x3B, 0x8C]], [1.0, [0x1A, 0x21, 0x30]],
];
function colorForWeight(w) {
  const cw = Math.max(0, Math.min(1, w));
  for (let i = 0; i < HAZARD_GRADIENT_STOPS.length - 1; i++) {
    const [t0, c0] = HAZARD_GRADIENT_STOPS[i], [t1, c1] = HAZARD_GRADIENT_STOPS[i + 1];
    if (cw >= t0 && cw <= t1) {
      const t = (cw - t0) / (t1 - t0);
      const r = Math.round(c0[0] + (c1[0] - c0[0]) * t);
      const g = Math.round(c0[1] + (c1[1] - c0[1]) * t);
      const b = Math.round(c0[2] + (c1[2] - c0[2]) * t);
      return `rgb(${r},${g},${b})`;
    }
  }
  return '#C13A7A';
}

// inLandBbox(陸地・沿岸のみ表示)でフィルタすると軌跡の一部が虫食いになるため、
// 連続してtrueな区間だけをひとつながりの線として切り出す(そうしないと海上の空白を
// 直線でショートカットしてしまい、不自然な線になる)。items内の各要素はpredicateで
// 判定できる値を持つオブジェクトであればよい(座標に限らない汎用ヘルパー)。
function splitContiguousRuns(items, predicate) {
  const runs = [];
  let current = [];
  items.forEach(item => {
    if (predicate(item)) {
      current.push(item);
    } else {
      if (current.length >= 2) runs.push(current);
      current = [];
    }
  });
  if (current.length >= 2) runs.push(current);
  return runs;
}

// 台風の軌跡はポリライン(線)で描画する。以前はcircle(暴風域バッファ)+polylineの
// 半透明な重ね描きだったが、沿岸部のように何十本もの台風の軌跡が同じ場所を通ると、
// 半透明図形の不透明度が積み重なってべったり単色に潰れる問題があった。その後
// L.heatLayer(ヒートマップ)化も試したが、これは「通過本数が多いほど濃くなる」
// 積算方式のため、弱い台風が何本も通っただけの場所が強く見えてしまい、
// 「その場所を通った最も強い台風で評価したい」という意図とズレていた。
// 現在は、区間(ratio)の弱い順に不透明(opacity:1)なポリラインを描画し、
// 強い区間ほど後(=上)に描く方式にしている。同じ場所を複数の軌跡が通っても
// 不透明度は加算されず、単純に一番強い区間の色が最前面に残る(=最大値評価)。
//
// 同じ台風の中でも発達・衰弱で色が変わるよう、区間(2地点間)ごとに、その両端の風速の
// 平均で色を決める。階級はJMA(気象庁)の台風強さ階級を採用している(下記改訂その8参照)。
// 【2026年8月改訂・その8】このサイトのwinds_ktは、実データ検証(Typhoon Meranti 2016の
// 実測値との照合)により、JMA(気象庁、10分間平均風速)方式であることが判明した。
// 以前使っていたSaffir-Simpson基準(64/83/96/114/136kt)は米国JTWC方式(1分間平均)を
// 前提に作られており、同じ数値でも1分間平均は10分間平均よりおよそ12〜14%高く出るため、
// 単純に当てはめると実際の強さを過小評価してしまう(検証: Meranti実測120kt→旧基準では
// Category4止まりだが、1分間平均換算では約137ktでCategory5相当)。
// データの出典(JMA)に合わせ、JMA自身の階級基準に切り替えた。
// 17.2m/s(台風)・33m/s(強い台風)・44m/s(非常に強い台風)・54m/s(猛烈な台風)をkt換算。
// 下限34ktはr34_km(34kt到達半径)の定義そのものと一致するため、区間の帯の外縁=r34と
// なり、計算が単純化される(距離補間が不要になる)という副次的な利点もある。
const TYPHOON_CATEGORY_BOUNDS_KT = [34, 64, 85, 105]; // JMA: 台風/強い台風/非常に強い台風/猛烈な台風
const TYPHOON_TIER_COLORS = ['#D9A22C', '#D9722C', '#C13A2E', '#C13A7A']; // JMAの4階級専用(他ハザードの5階級とは別)
const TYPHOON_TIER_LABELS = ['Typhoon', 'Strong Typhoon', 'Very Strong Typhoon', 'Violent Typhoon']; // JMA英語表記
// 台風ごとの実際の暴風域半径(r34_km)がデータにある場合は、それを使って中心からの
// 線形補間で風速を推定する(2026年8月改訂: 台風によって暴風域の大きさが11〜581km、
// 中央値185kmと大きくばらつくため、一律の固定半径では小型で強い台風・大型で緩い台風を
// 区別できなかった)。r34_kmが無い地点・台風のみ、フォールバックとして固定半径で判定する。
const TYPHOON_FALLBACK_RADIUS_KM = 200; // r34_km欠損時のフォールバック(実データ中央値ベース)
const TYPHOON_PREFILTER_RADIUS_KM = 600; // 安価な絞り込み用(実データの最大r34=581kmをカバー)

// 2点(lat1,lon1)-(lat2,lon2)を結ぶ線分上で、指定地点(lat,lon)に最も近い点までの距離(km)と、
// その点が線分のどの位置(t=0で始点、t=1で終点)かを返す。
// 台風の観測点は6時間おきで、その間は移動速度によって100〜300km離れることもあり、
// 線分の"途中"では風速判定が行われていなかった(2026年8月改訂で対応)。
// 緯度経度を局所的に平面近似(観測点間隔は最大でも数百km程度のため、この近似で十分な精度)。
// 2点間の方位(度、真北=0、時計回り)を求める
function bearingDeg(lat1, lon1, lat2, lon2) {
  const φ1 = lat1 * Math.PI / 180, φ2 = lat2 * Math.PI / 180;
  const Δλ = (lon2 - lon1) * Math.PI / 180;
  const y = Math.sin(Δλ) * Math.cos(φ2);
  const x = Math.cos(φ1) * Math.sin(φ2) - Math.sin(φ1) * Math.cos(φ2) * Math.cos(Δλ);
  return (Math.atan2(y, x) * 180 / Math.PI + 360) % 360;
}

// 起点(lat,lon)から方位bearingDeg方向にdistKmだけ進んだ地点の緯度経度を求める(大圏航路)
function destinationPoint(lat, lon, bearingDegVal, distKm) {
  const R = 6371;
  const δ = distKm / R;
  const θ = bearingDegVal * Math.PI / 180;
  const φ1 = lat * Math.PI / 180, λ1 = lon * Math.PI / 180;
  const φ2 = Math.asin(Math.sin(φ1) * Math.cos(δ) + Math.cos(φ1) * Math.sin(δ) * Math.cos(θ));
  const λ2 = λ1 + Math.atan2(Math.sin(θ) * Math.sin(δ) * Math.cos(φ1), Math.cos(δ) - Math.sin(φ1) * Math.sin(φ2));
  return [φ2 * 180 / Math.PI, λ2 * 180 / Math.PI]; // [lat, lon]
}

function closestPointOnSegmentKm(lat, lon, lat1, lon1, lat2, lon2) {
  const latRad = (lat1 + lat2) / 2 * Math.PI / 180;
  const kx = 111.32 * Math.cos(latRad); // 経度1度あたりの距離(km、この緯度での近似)
  const ky = 110.57; // 緯度1度あたりの距離(km、ほぼ一定)
  const bx = (lon2 - lon1) * kx, by = (lat2 - lat1) * ky;
  const px = (lon - lon1) * kx, py = (lat - lat1) * ky;
  const abLenSq = bx * bx + by * by;
  let t = abLenSq > 0 ? (px * bx + py * by) / abLenSq : 0;
  t = Math.max(0, Math.min(1, t));
  const cLat = lat1 + t * (lat2 - lat1), cLon = lon1 + t * (lon2 - lon1);
  return { t, distKm: haversineKm(lat, lon, cLat, cLon) };
}

// 台風1個分のデータから、指定地点での推定風速(kt)の最大値を求める。
// 各時刻の地点ごとに、r34_kmがあれば「中心=その時刻の風速、r34地点=34kt」の線形補間、
// 無ければ固定半径(TYPHOON_FALLBACK_RADIUS_KM)内かどうかの二値判定にフォールバックする。
// 【2026年8月改訂・その2】上記は観測点(6時間おきの「点」)でしか評価しておらず、地図上に
// 描画される観測点間の直線(区間)上では一切評価されていなかった。観測点間隔が広い台風では、
// 地図上は線に近い/線上にあるのに「リスクなし」と判定される矛盾が生じていたため、
// 区間(2点間)も線分として扱い、区間上の最近接点までの距離で判定するよう拡張した。
// 【2026年8月改訂・その7】さらに、以前は地点検索側だけ「距離に応じて連続的に減衰」する
// モデルを使っており、レンダリング側(collectTyphoonSegments)の「区間ごとに一定の帯」
// というモデルと、そもそも前提が異なっていた。これでは両者が完全一致することは原理的に
// なく、細かな不一致(片方の観測点の欠損の扱いなど)が起きるたびに個別修正が必要になって
// いた。地点検索側も typhoonReachRadiusKm() による「帯の中にいるかどうか」の判定に統一し、
// 地図の帯とロジックレベルで完全に同じ計算を使うようにした。
function estimateStormWindAt(feature, lat, lon) {
  const coords = feature.geometry.coordinates;
  const windsKt = feature.properties?.winds_kt;
  const r34Km = feature.properties?.r34_km;
  const maxWind = feature.properties?.max_wind_kt;
  let best = null;
  let anyPointWind = false;

  // 各観測点の最低閾値到達半径(レンダリングのcatRadiusと完全に同じ計算)
  const catRadii = coords.map(([, ], i) => {
    const w = windsKt && typeof windsKt[i] === 'number' ? windsKt[i] : null;
    if (w !== null) anyPointWind = true;
    const hasR34 = !!(r34Km && typeof r34Km[i] === 'number' && r34Km[i] > 0);
    const r34raw = hasR34 ? r34Km[i] : TYPHOON_FALLBACK_RADIUS_KM;
    return { w, catR: typhoonReachRadiusKm(w, r34raw, hasR34) };
  });

  // (1) 観測点そのもの: 距離が観測点自身のcatRadius以内なら、その観測点の風速を採用
  coords.forEach(([flon, flat], i) => {
    if (!degBboxFilter(lat, lon, flat, flon, TYPHOON_PREFILTER_RADIUS_KM)) return;
    const { w, catR } = catRadii[i];
    if (w === null || catR <= 0) return;
    const dist = haversineKm(lat, lon, flat, flon);
    if (dist <= catR && (best === null || w > best)) best = w;
  });

  // (2) 観測点"間"(区間): レンダリングと同じく、区間の両端のcatRadiusを線形補間した
  // 「帯の幅」の中に入っているかどうかで判定する。風速側も同様に、両端の値が
  // 揃っていれば線形補間、片方だけならその値を区間全体の一定値として使う
  // (レンダリングのsegWindフォールバックと同じ規則)。
  for (let i = 0; i < coords.length - 1; i++) {
    const [flon1, flat1] = coords[i], [flon2, flat2] = coords[i + 1];
    if (!degBboxFilter(lat, lon, flat1, flon1, TYPHOON_PREFILTER_RADIUS_KM) &&
        !degBboxFilter(lat, lon, flat2, flon2, TYPHOON_PREFILTER_RADIUS_KM)) continue;
    const p1 = catRadii[i], p2 = catRadii[i + 1];
    if (p1.w === null && p2.w === null) continue; // 両方欠損なら評価不能
    const { t, distKm } = closestPointOnSegmentKm(lat, lon, flat1, flon1, flat2, flon2);
    const catT = p1.catR + t * (p2.catR - p1.catR); // 帯の幅をtで線形補間(レンダリングと同一)
    if (distKm > catT) continue; // 帯の外
    const wT = (p1.w !== null && p2.w !== null) ? p1.w + t * (p2.w - p1.w) : (p1.w !== null ? p1.w : p2.w);
    if (wT !== null && (best === null || wT > best)) best = wT;
  }

  // winds_kt自体が無い古い形式のデータ(台風全体で1つの最大風速のみ)は、固定半径のみで判定
  if (!anyPointWind && typeof maxWind === 'number') {
    const near = coords.some(([flon, flat]) => degBboxFilter(lat, lon, flat, flon, TYPHOON_FALLBACK_RADIUS_KM) && haversineKm(lat, lon, flat, flon) <= TYPHOON_FALLBACK_RADIUS_KM);
    if (near) best = maxWind;
  }
  return best;
}

// 全台風の中から、指定地点での推定風速(kt)の最大値を求める(=badge/タイル判定用)
function typhoonWindEstimateAt(lat, lon) {
  if (!typhoonGeojsonCacheGlobal) return null;
  let best = null;
  typhoonGeojsonCacheGlobal.features.forEach(f => {
    const w = estimateStormWindAt(f, lat, lon);
    if (w !== null && (best === null || w > best)) best = w;
  });
  return best;
}

// 風速(kt)をJMA階級のtier(0=台風〜3=猛烈な台風)とratio(0〜1、色のグラデーション用)に変換する。
// 最低階級(34kt)未満はnullを返す(=台風ハザードとして扱わない)。同じ階級内での強弱も
// なめらかに反映されるよう、次の階級境界に近いほどratioを1段階分の中で連続的に上げる
// (猛烈な台風は上限が無いため、目安として+30ktの幅で頭打ちにする。直前の階級幅
// (105-85=20kt)よりやや広めに取り、無限に強い台風でもratio=1に張り付き過ぎないようにした)。
function typhoonWindToTierRatio(windKt) {
  const n = TYPHOON_CATEGORY_BOUNDS_KT.length;
  if (typeof windKt !== 'number' || windKt < TYPHOON_CATEGORY_BOUNDS_KT[0]) return null;
  let tier = 0;
  for (let i = 1; i < n; i++) {
    if (windKt >= TYPHOON_CATEGORY_BOUNDS_KT[i]) tier = i;
  }
  const lower = TYPHOON_CATEGORY_BOUNDS_KT[tier];
  const upper = tier < n - 1 ? TYPHOON_CATEGORY_BOUNDS_KT[tier + 1] : lower + 30;
  const within = Math.min(1, (windKt - lower) / (upper - lower));
  return { tier, ratio: (tier + within) / n };
}

// r34_km(34kt=トロピカルストーム相当が届く範囲)を、そのまま「台風ハザードとして
// 表示する範囲」の幅として使う。改訂その8でJMA基準に切り替え、最低階級の下限
// (TYPHOON_CATEGORY_BOUNDS_KT[0])を34ktにしたことで、この下限はr34の定義(34kt到達点)
// そのものと一致するようになった。そのため下記の減衰式で距離を逆算すると、
// MIN_KT=34の場合は d = r34 × (1 - 0/(w-34)) = r34 となり、常にr34そのものが
// 返る(距離補間が実質不要になった、Saffir-Simpson基準だった頃の名残の計算式だが、
// 別の閾値に変更した場合にも対応できるよう汎用のまま残してある)。
// r34欠損時(フォールバック)は距離減衰が無い(200km以内は一律w)前提のため、
// w>=最低閾値なら200km、それ未満なら0という単純な二値になる。
function typhoonReachRadiusKm(w, r34, hasR34) {
  const MIN_KT = TYPHOON_CATEGORY_BOUNDS_KT[0]; // 34(JMA「台風」の下限)
  if (typeof w !== 'number') return 0;
  if (!hasR34) return w >= MIN_KT ? TYPHOON_FALLBACK_RADIUS_KM : 0;
  if (w <= 34) return 0; // 中心ですら34kt以下なら、r34内のどこにも最低閾値は存在しない
  const d = r34 * (1 - (MIN_KT - 34) / (w - 34));
  return Math.max(0, Math.min(r34, d));
}

function collectTyphoonSegments(coords, windsKt, r34Km, fallbackTierRatio, segments) {
  const items = coords.map(([lon, lat], i) => {
    const wind = (windsKt && typeof windsKt[i] === 'number') ? windsKt[i] : null;
    const hasR34 = !!(r34Km && typeof r34Km[i] === 'number' && r34Km[i] > 0);
    const r34 = hasR34 ? r34Km[i] : TYPHOON_FALLBACK_RADIUS_KM;
    return { lat, lon, wind, catRadius: typhoonReachRadiusKm(wind, r34, hasR34) };
  });
  const runs = splitContiguousRuns(items, item => inLandBbox(item.lat, item.lon));
  runs.forEach(run => {
    for (let i = 0; i < run.length - 1; i++) {
      const a = run[i], b = run[i + 1];
      let segWind;
      if (typeof a.wind === 'number' && typeof b.wind === 'number') segWind = (a.wind + b.wind) / 2;
      else if (typeof a.wind === 'number') segWind = a.wind;
      else if (typeof b.wind === 'number') segWind = b.wind;
      else segWind = null;
      const tr = segWind !== null ? typhoonWindToTierRatio(segWind) : fallbackTierRatio;
      // 最低閾値(JMA「台風」の下限、34kt)未満の区間は台風ハザードとして描画しない
      if (!tr) continue;
      segments.push({ a, b, ratio: tr.ratio });
    }
  });
}

async function buildTyphoonHazard() {
  const geojson = await fetchGeojsonSafe('data/typhoons.geojson');
  typhoonGeojsonCacheGlobal = geojson;
  const segments = [];

  if (geojson) {
    let minTime = Infinity, maxTime = -Infinity;
    geojson.features.forEach(f => {
      const maxWind = f.properties?.max_wind_kt;
      // winds_kt(地点ごとの風速)が無い古いデータ形式でも動くよう、その場合は
      // 台風全体の最大風速から一律のtier/ratioを計算してフォールバックに使う。
      // 最大風速でも最低閾値(34kt)未満の台風は、そもそも描画対象にしない。
      const fallbackTierRatio = typhoonWindToTierRatio(maxWind);
      collectTyphoonSegments(f.geometry.coordinates, f.properties?.winds_kt, f.properties?.r34_km, fallbackTierRatio, segments);
      const st = f.properties?.start_time, et = f.properties?.end_time;
      if (st) minTime = Math.min(minTime, new Date(st).getTime());
      if (et) maxTime = Math.max(maxTime, new Date(et).getTime());
    });
    if (isFinite(minTime) && isFinite(maxTime)) {
      dataRanges.typhoonHazard = `${new Date(minTime).getFullYear()}–${new Date(maxTime).getFullYear()}`;
      updateLegend();
    }
    typhoonDataUnavailable = false;
  } else {
    // 取得失敗。何も描かず、凡例・バッジ・レポートに「評価できなかった」と明示する。
    typhoonDataUnavailable = true;
    dataRanges.typhoonHazard = null;
    updateLegend();
  }

  // 弱い区間から先に描画し、強い区間を最後(最前面)に描くことで、重なった場所では
  // 常に最も強い台風の色が見えるようにする
  // 【2026年8月改訂・その3】以前は太さ固定(weight:5)の単純な線で描画しており、見た目の
  // 太さが実際の暴風域(r34、11〜581kmと大きく幅がある)と無関係だったため、
  // 「線に近ければ危険」という誤解を招きやすかった。区間ごとにr34を反映した幅の帯
  // (ポリゴン)として描画するよう変更し、実際の暴風域の広さの違いが見た目にも
  // 表れるようにした。帯同士が重なっても地図が見えなくなりすぎないよう、
  // 透過度を上げて(fillOpacity 0.28)半透明にしてある。
  // 【2026年9月改訂】全国表示(帯)が、地点検索の台風バッジと違う基準(連続5色
  // グラデーション・頻度重みなし)で色分けされていたため、同じ基準に揃えた。
  // 区間の中点で地点検索と同じ typhoonFrequencyWeightAt() を呼び、頻度重み
  // (×1.0〜1.5)を掛けてから、地点検索と同じJMA4階級の配色(TYPHOON_TIER_COLORS)
  // で塗る。全区間×全台風の頻度計算のため、初回描画時にまとめて1回だけ実行する。
  segments.sort((s1, s2) => s1.ratio - s2.ratio);
  segments.forEach(seg => {
    const midLat = (seg.a.lat + seg.b.lat) / 2, midLon = (seg.a.lon + seg.b.lon) / 2;
    const freq = typhoonFrequencyWeightAt(midLat, midLon);
    const adjustedRatio = Math.min(1, seg.ratio * freq.weight);
    const tier = Math.min(TYPHOON_TIER_COLORS.length - 1, Math.floor(adjustedRatio * TYPHOON_TIER_COLORS.length));
    const segColor = TYPHOON_TIER_COLORS[tier];
    const brg = bearingDeg(seg.a.lat, seg.a.lon, seg.b.lat, seg.b.lon);
    const perpL = brg - 90, perpR = brg + 90;
    const aL = destinationPoint(seg.a.lat, seg.a.lon, perpL, seg.a.catRadius);
    const aR = destinationPoint(seg.a.lat, seg.a.lon, perpR, seg.a.catRadius);
    const bL = destinationPoint(seg.b.lat, seg.b.lon, perpL, seg.b.catRadius);
    const bR = destinationPoint(seg.b.lat, seg.b.lon, perpR, seg.b.catRadius);
    L.polygon([aL, bL, bR, aR], {
      color: segColor, weight: 1, opacity: 0.35,
      fillColor: segColor, fillOpacity: 0.28,
    }).addTo(layerGroups.typhoonHazard);
  });
}

// 水害ハザード: 降雨強度(CHIRPS)と標高(Open-Elevation)の高い方を基礎リスクとし、
// 過去の洪水実績(DFO)で最大1.5倍まで底上げする。データ欠損セルは灰色で明示する。
let rainfallGeojsonCacheGlobal = null;
let elevationGeojsonCacheGlobal = null;
// 降雨グリッドは1度間隔の整数座標のため、"lat_lon" をキーにした Map で直接引ける。
// 平滑化では周囲5x5格子まで参照するので、毎回の線形探索を避ける。
let rainfallGridIndex = new Map();

function buildRainfallGridIndex(geojson) {
  const index = new Map();
  if (!geojson) return index;
  geojson.features.forEach(f => {
    const [lon, lat] = f.geometry.coordinates;
    const props = f.properties || {};
    if (props.no_data) return;
    index.set(`${Math.round(lat)}_${Math.round(lon)}`, props);
  });
  return index;
}

function floodWeightAt(lat, lon) {
  if (!floodGeojsonCacheGlobal) return 1.0;
  const areaVals = floodGeojsonCacheGlobal.features
    .map(f => f.properties?.affected_sq_km).filter(v => typeof v === 'number');
  if (areaVals.length === 0) return 1.0;
  const maxArea = Math.max(...areaVals);

  let nearestArea = null, nearestDist = Infinity;
  floodGeojsonCacheGlobal.features.forEach(f => {
    const area = f.properties?.affected_sq_km;
    if (typeof area !== 'number') return;
    const [flon, flat] = f.geometry.coordinates;
    if (!degBboxFilter(lat, lon, flat, flon, 80)) return;
    const d = haversineKm(lat, lon, flat, flon);
    if (d <= 80 && d < nearestDist) { nearestDist = d; nearestArea = area; }
  });
  if (nearestArea === null) return 1.0;
  const relative = Math.min(1, nearestArea / maxArea);
  // 2026年9月改訂: 1.0〜1.5から1.0〜1.2に縮小。DFOの代表点は洪水イベントの影響範囲の
  // 重心で、面積の中央値が約73,000km²(270km四方)と粗く、地点ごとの差を表せていない。
  // また記録の8割超が豪雨起因で、内水氾濫(降雨×窪み)と原因が重複している。
  // 実績は「モデルが捉えきれなかった分の補正」に留める。
  return 1 + FLOOD_WEIGHT_MAX_UPLIFT * relative;
}

// ==== 水域近接倍率(河川・湖・海への近さで標高リスクを底上げする) ====
let riversGeojsonCacheGlobal = null;
let riverSpatialIndex = null; // Map<"latCell_lonCell", number[]>(河川データのインデックス、featuresの添字)
const RIVER_INDEX_CELL_DEG = 0.02; // 約2.2km四方の格子(2km圏内の検索に十分な粒度)

// 河川データを読み込んだ直後に1回だけ呼ぶ: 各河川の頂点をもとに、格子ごとの索引を作る。
// これにより検索のたびに全件(14万本規模)をスキャンする必要がなくなる。
function buildRiverSpatialIndex(riversGeojson) {
  const index = new Map();
  if (!riversGeojson) return index;
  riversGeojson.features.forEach((f, idx) => {
    const coords = f.geometry?.coordinates;
    if (!coords) return;
    const seenCells = new Set(); // 同じ河川が同じ格子に何度も登録されるのを防ぐ
    coords.forEach(([lon, lat]) => {
      const cellKey = `${Math.floor(lat / RIVER_INDEX_CELL_DEG)}_${Math.floor(lon / RIVER_INDEX_CELL_DEG)}`;
      if (seenCells.has(cellKey)) return;
      seenCells.add(cellKey);
      if (!index.has(cellKey)) index.set(cellKey, []);
      index.get(cellKey).push(idx);
    });
  });
  return index;
}

// 指定地点の周囲(3x3の格子=約6.6km四方)に該当する河川の候補だけを取り出す
function nearbyRiverFeatures(lat, lon) {
  if (!riverSpatialIndex || !riversGeojsonCacheGlobal) return [];
  const baseLat = Math.floor(lat / RIVER_INDEX_CELL_DEG);
  const baseLon = Math.floor(lon / RIVER_INDEX_CELL_DEG);
  const candidateIdx = new Set();
  for (let dLat = -1; dLat <= 1; dLat++) {
    for (let dLon = -1; dLon <= 1; dLon++) {
      const key = `${baseLat + dLat}_${baseLon + dLon}`;
      const bucket = riverSpatialIndex.get(key);
      if (bucket) bucket.forEach(i => candidateIdx.add(i));
    }
  }
  return Array.from(candidateIdx).map(i => riversGeojsonCacheGlobal.features[i]);
}

// Overpass API(OpenStreetMap)で、指定地点周辺の湖・貯水池をその場に問い合わせる。
// HydroLAKES(全世界820MBの事前ダウンロードが必要)を避けるための代替手段。
// 地点検索1回につき1回だけ呼び出し、169マス全体で結果を使い回す(通信回数を抑えるため)。
const OVERPASS_URL = 'https://overpass-api.de/api/interpreter';

async function fetchNearbyLakePoints(lat, lon, radiusM) {
  const query = `[out:json][timeout:25];(way["natural"="water"]["water"~"lake|reservoir|oxbow"](around:${radiusM},${lat},${lon});relation["natural"="water"]["water"~"lake|reservoir|oxbow"](around:${radiusM},${lat},${lon}););out geom;`;
  try {
    const res = await fetch(OVERPASS_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain' },
      body: query,
    });
    if (!res.ok) return [];
    const data = await res.json();
    const points = [];
    (data.elements || []).forEach(el => {
      if (el.geometry) {
        el.geometry.forEach(g => points.push([g.lat, g.lon]));
      } else if (el.members) {
        el.members.forEach(m => {
          if (m.geometry) m.geometry.forEach(g => points.push([g.lat, g.lon]));
        });
      }
    });
    return points;
  } catch (e) {
    // Overpass APIが混雑・失敗している場合は、湖の要素なしとして扱う(検索自体は継続する)
    return [];
  }
}

// 距離(km) → 最寄りの頂点との最短距離(度)を概算距離(km)に変換する簡易ヘルパー
function pointToLineDistanceKm(lat, lon, coords) {
  // 簡易実装: 線を構成する各頂点との距離のうち最小値を採用する(頂点間の補間はしない近似)
  let minDist = Infinity;
  coords.forEach(([clon, clat]) => {
    const d = haversineKm(lat, lon, clat, clon);
    if (d < minDist) minDist = d;
  });
  return minDist;
}

// ==== 標高タイル(AW3D30 150m)の読み込み ====
// data/elevation_tiles/N034E113.tif = 北緯34〜35度・東経113〜114度の1度タイル。
// 720x720のint16 GeoTIFF(1画素 = 1/720度 ≒ 150m)、行0がタイル北端。
// geotiff.jsのHTTPレンジリクエストで、必要な範囲の画素だけを部分読み込みする。
const ELEV_TILE_PX = 720;
const ELEV_TILE_DIR = 'data/elevation_tiles/';
const elevTileCache = new Map(); // "N034E113" -> Promise<GeoTIFFImage>

function elevTileKey(latFloor, lonFloor) {
  const la = String(latFloor).padStart(3, '0');
  const lo = String(lonFloor).padStart(3, '0');
  return `N${la}E${lo}`;
}

function loadElevTile(latFloor, lonFloor) {
  const key = elevTileKey(latFloor, lonFloor);
  if (!elevTileCache.has(key)) {
    elevTileCache.set(key, (async () => {
      const tiff = await GeoTIFF.fromUrl(`${ELEV_TILE_DIR}${key}.tif`);
      return await tiff.getImage();
    })().catch(() => null));
  }
  return elevTileCache.get(key);
}

// 緯度経度 → 全球通しの画素番号(北極が行0、経度0度が列0)
function elevGlobalPixel(lat, lon) {
  return {
    gx: Math.floor(lon * ELEV_TILE_PX),
    gy: Math.floor((90 - lat) * ELEV_TILE_PX),
  };
}

// 中心地点の周囲 (2*halfPx+1) 画素四方を読み、その場で引ける標高ブロックを返す。
// タイル境界をまたぐ場合は、必要なタイルを個別に読んで貼り合わせる。
// タイルが存在しない範囲(パミール高原など)の画素は null のままになる。
async function loadElevationBlock(lat, lon, halfPx) {
  const c = elevGlobalPixel(lat, lon);
  const x0 = c.gx - halfPx, y0 = c.gy - halfPx;
  const size = halfPx * 2 + 1;
  const values = new Array(size * size).fill(null);

  // 必要な画素を、所属タイルごとにまとめる
  const tiles = new Map();
  for (let ty = Math.floor(y0 / ELEV_TILE_PX); ty <= Math.floor((y0 + size - 1) / ELEV_TILE_PX); ty++) {
    for (let tx = Math.floor(x0 / ELEV_TILE_PX); tx <= Math.floor((x0 + size - 1) / ELEV_TILE_PX); tx++) {
      tiles.set(`${ty}_${tx}`, { ty, tx });
    }
  }

  await Promise.all(Array.from(tiles.values()).map(async ({ ty, tx }) => {
    const latFloor = 89 - ty;
    const lonFloor = tx;
    if (latFloor < 0 || lonFloor < 0) return;
    const image = await loadElevTile(latFloor, lonFloor);
    if (!image) return;
    // このタイル内で必要な範囲(タイルローカル座標)
    const left = Math.max(x0, tx * ELEV_TILE_PX) - tx * ELEV_TILE_PX;
    const right = Math.min(x0 + size - 1, tx * ELEV_TILE_PX + ELEV_TILE_PX - 1) - tx * ELEV_TILE_PX;
    const top = Math.max(y0, ty * ELEV_TILE_PX) - ty * ELEV_TILE_PX;
    const bottom = Math.min(y0 + size - 1, ty * ELEV_TILE_PX + ELEV_TILE_PX - 1) - ty * ELEV_TILE_PX;
    let raster;
    try {
      raster = await image.readRasters({ window: [left, top, right + 1, bottom + 1] });
    } catch (e) {
      return;
    }
    const band = raster[0];
    const w = right - left + 1;
    for (let r = top; r <= bottom; r++) {
      for (let cx = left; cx <= right; cx++) {
        const gyy = ty * ELEV_TILE_PX + r;
        const gxx = tx * ELEV_TILE_PX + cx;
        const bi = (gyy - y0) * size + (gxx - x0);
        if (bi < 0 || bi >= values.length) continue;
        values[bi] = band[(r - top) * w + (cx - left)];
      }
    }
  }));

  const get = (qLat, qLon) => {
    const p = elevGlobalPixel(qLat, qLon);
    const ix = p.gx - x0, iy = p.gy - y0;
    if (ix < 0 || iy < 0 || ix >= size || iy >= size) return null;
    return values[iy * size + ix];
  };
  const center = get(lat, lon);
  return { get, values, size, center, ok: center !== null };
}

// ==== 降雨: 周辺格子の距離加重平均(IDW)でGumbelパラメータを平滑化する ====
// 1度格子の中心1画素だけをCHIRPSから読んでいるため、対流性豪雨に当たった格子が
// 突出する。周囲を距離で重み付けして均すことで、隣接格子との連続性を確保する。
// 半径1.0度で参照点が見つからない場合(沿岸部など)のみ2.0度に広げる。
const RAIN_SMOOTH_R1 = 1.0;
const RAIN_SMOOTH_R2 = 2.0;
const RAIN_SMOOTH_EPS = 0.35;

function smoothedGumbelAt(lat, lon) {
  if (!rainfallGeojsonCacheGlobal) return null;
  const tryRadius = (R) => {
    let numMu = 0, numBeta = 0, den = 0;
    const span = Math.ceil(R);
    const cosLat = Math.cos(lat * Math.PI / 180);
    for (let dLat = -span; dLat <= span; dLat++) {
      for (let dLon = -span; dLon <= span; dLon++) {
        const gLat = Math.floor(lat) + dLat;
        const gLon = Math.floor(lon) + dLon;
        const p = rainfallGridIndex.get(`${gLat}_${gLon}`);
        if (!p || typeof p.gumbel_mu !== 'number' || typeof p.gumbel_beta !== 'number') continue;
        const d = Math.hypot((gLon - lon) * cosLat, gLat - lat);
        if (d > R) continue;
        const w = 1 / Math.pow(d + RAIN_SMOOTH_EPS, 2);
        numMu += w * p.gumbel_mu;
        numBeta += w * p.gumbel_beta;
        den += w;
      }
    }
    return den > 0 ? { mu: numMu / den, beta: numBeta / den } : null;
  };
  return tryRadius(RAIN_SMOOTH_R1) || tryRadius(RAIN_SMOOTH_R2);
}

// 降雨強度スコア(0〜1): 50年確率の24時間降水量を全国分布で正規化する。
// 下端16mm/上端218mmは、平滑化後の全国1,661地点の5%点・95%点(実測)。
const RAIN_X50_K = 3.9019; // -ln(-ln(1 - 1/50))
const RAIN_NORM_LO = 16;
const RAIN_NORM_HI = 218;

// 【2026年9月】第2引数warmingCは全国ヒートマップの気候シナリオ切替専用。
// 地点検索・レポートの呼び出しは引数を渡さないため既定の0(現在気候)のままで、
// Water Hazardスコア自体は選択中のシナリオに関わらず常に現在気候で計算される。
function rainfallIntensityScore(lat, lon, warmingC = 0) {
  const g = smoothedGumbelAt(lat, lon);
  if (!g) return null;
  const ccFactor = 1 + (RAINFALL_CC_PCT_PER_DEG / 100) * warmingC;
  const x50 = (g.mu + g.beta * RAIN_X50_K) * ccFactor;
  return Math.max(0, Math.min(1, (x50 - RAIN_NORM_LO) / (RAIN_NORM_HI - RAIN_NORM_LO)));
}

// ==== 機構2: 内水氾濫の窪み係数(0.6〜1.3の倍率) ====
// 21x21グリッド(約3.15km四方)の標高から、周囲に対してどれだけ低いかを見る。
// 最小値ではなく下位10%分位を使うのは、1画素の誤差やノイズに引きずられないため。
// 起伏(rng)が2m未満の一様な平野は「窪地かどうか判定できない」ため中立(1.0)に倒す。
function percentileOf(sortedVals, q) {
  if (sortedVals.length === 0) return null;
  const i = Math.max(0, Math.min(sortedVals.length - 1, Math.floor(q * sortedVals.length)));
  return sortedVals[i];
}

// 21x21グリッド(行優先: 行=南北、列=東西)から、指定マスを中心とする (2*half+1) 四方を切り出す。
// 端に寄っている場合は、はみ出さない範囲だけを返す。
const DEPRESSION_HALF = 3;        // ±3マス = 7x7 = 49マス(約1.05km四方)
const DEPRESSION_QUANTILE = 0.20; // 49マスなら下から10番目。極端値に引きずられないための分位

function subGridAround(vals, side, ci, cj, half) {
  const out = [];
  for (let r = Math.max(0, ci - half); r <= Math.min(side - 1, ci + half); r++) {
    for (let c = Math.max(0, cj - half); c <= Math.min(side - 1, cj + half); c++) {
      out.push(vals[r * side + c]);
    }
  }
  return out;
}

// 【2026年9月改訂】評価範囲を21x21(3.15km四方)から7x7(約1.05km四方)へ縮小した。
// 保険会社の水災リスクチェックリストが「半径500m以内と比べて低いか」を問うており、
// 3.15km四方では敷地ではなく一帯を見ていることになるため。
// あわせて基準の分位を10%から20%に変更した。441マスの下位10%は下から44番目だが、
// 49マスの下位10%は下から4番目となりノイズに弱くなる。20%なら下から10番目で、
// 「最小値ではなく分位を使う」という当初の設計意図(1マスの誤差に引きずられない)を保てる。
function depressionFactor(centerElev, neighborhoodVals) {
  const vals = neighborhoodVals.filter(v => typeof v === 'number').sort((a, b) => a - b);
  if (vals.length < 12 || centerElev === null) return { factor: 1.0, rel: null, rng: null };
  const p10 = percentileOf(vals, DEPRESSION_QUANTILE);
  const p90 = percentileOf(vals, 1 - DEPRESSION_QUANTILE);
  const rng = p90 - p10;
  const rel = centerElev - p10;
  if (rng < 2) return { factor: 1.0, rel, rng };
  let factor;
  if (rel <= 0.5) factor = 1.3;
  else if (rel <= 2) factor = 1.15;
  else if (rel <= 5) factor = 1.0;
  else if (rel <= 10) factor = 0.8;
  else factor = 0.6;
  return { factor, rel, rng };
}

// 【2026年9月】badge/reportの「標高差」表示を、窪み係数が実際に使っている基準
// (depressionFactor()と同じrel/rngの分類)に揃えるための表示テキスト生成。
// 従来は別計算(周囲8方向・100mの単純平均)を表示しており、窪み係数と無関係に
// 見える注記が付いていたため統一した。ただし社外向け表示のため、具体的な半径
// (450m)や分位点(20%)、係数の数値そのものは出さない(算出方式は非開示の方針)。
function depressionFactorLabel(dep) {
  if (dep.rng === null) {
    return { text: 'Insufficient nearby elevation data to assess', factor: 1.0 };
  }
  if (dep.rng < 2) {
    return { text: 'Surrounding terrain too flat to judge a local low point', factor: dep.factor };
  }
  const rel = dep.rel;
  let text;
  if (rel <= 0.5) text = 'Sits at the local low point';
  else if (rel <= 2) text = 'Notably lower than nearby high ground';
  else if (rel <= 5) text = 'Mid-range relative to its surroundings';
  else if (rel <= 10) text = 'Higher than most of its surroundings';
  else text = 'Well above the surrounding low ground — relatively favorable';
  return { text, factor: dep.factor };
}

// ==== 機構1: 外水氾濫(河川の氾濫) ====
// 半径2km以内の河川を1本ずつ評価し、最大値を採る。
// 最寄りが小河川でも、少し遠い大河川のほうが危険なことがあるため。
function riverProximityScore(distanceM) {
  if (distanceM <= 500) return 1.0;
  if (distanceM <= 1000) return 0.7;
  if (distanceM <= 1500) return 0.4;
  if (distanceM <= 2000) return 0.2;
  return 0;
}

// Strahler次数(order)を河川規模の代理指標として使う。流量属性はHydroRIVERSの
// 配布データに含まれていないため、次数で代用している(乾燥地帯の涸れ川と
// 湿潤地帯の同次数河川が同格になる限界がある)。
function riverOrderFactor(order) {
  if (typeof order !== 'number') return 0.3;
  if (order >= 9) return 1.0;
  if (order >= 8) return 0.85;
  if (order >= 7) return 0.7;
  if (order >= 6) return 0.55;
  if (order >= 5) return 0.4;
  return 0.3;
}

// 川面からの高さ(比高)。考え方はHAND(Height Above Nearest Drainage)に基づくが、
// 流向解析を行わず最寄りの河川線を使う簡易版のため、分水嶺を挟んだ反対側の川を
// 拾う場合がある。
function riverReliefFactor(reliefM) {
  if (reliefM === null) return 1.0; // 標高が取れない場合は比高で減点しない
  if (reliefM <= 2) return 1.0;
  if (reliefM <= 5) return 0.6;
  if (reliefM <= 10) return 0.25;
  return 0.05;
}

// 河川の頂点のうち最寄りのものを返す(距離kmと座標)
function nearestVertexOnRiver(lat, lon, coords) {
  let best = null, bestD = Infinity;
  coords.forEach(([clon, clat]) => {
    const d = haversineKm(lat, lon, clat, clon);
    if (d < bestD) { bestD = d; best = { lat: clat, lon: clon }; }
  });
  return best ? { distKm: bestD, lat: best.lat, lon: best.lon } : null;
}

function fluvialScoreAt(lat, lon, elevGet, centerElev) {
  // 【2026年9月】河川データが読み込めていない場合は 0 ではなく null を返す。
  // 0 は「評価した結果、近くに川が無かった」という判定であり、取得失敗とは意味が違う。
  // 0 を返すと combineWaterHazard が正当な候補として最大値比較に入れてしまい、
  // 取得失敗が「評価済みの安全判定」として合成される。
  if (!riverSpatialIndex || !riversGeojsonCacheGlobal) return null;
  let best = 0;
  nearbyRiverFeatures(lat, lon).forEach(f => {
    const coords = f.geometry?.coordinates;
    if (!coords) return;
    const nv = nearestVertexOnRiver(lat, lon, coords);
    if (!nv || nv.distKm > 2) return;
    const prox = riverProximityScore(nv.distKm * 1000);
    if (prox === 0) return;
    const scale = riverOrderFactor(f.properties?.order);
    let relief = null;
    if (elevGet && centerElev !== null) {
      const riverElev = elevGet(nv.lat, nv.lon);
      if (typeof riverElev === 'number') relief = centerElev - riverElev;
    }
    const score = prox * scale * riverReliefFactor(relief);
    if (score > best) best = score;
  });
  // 河川が近くにない地点では合流部があっても意味がないため、加算ではなく乗算にする
  return best > 0 ? Math.min(1, best * confluenceFactor(lat, lon)) : 0;
}

// 河川の合流部。合流部では上流からの流量が集まり水位が上がりやすいため、
// 外水氾濫のスコアを控えめに割り増しする。
// HydroRIVERSの線分は下流向きに並ぶので、複数の線分の下流端が同じ座標に集まる点を
// 合流部として抽出した(data/river_confluences.json、5,137点)。
// 段階を分けないのは、HydroRIVERSの位置精度(15秒グリッド=約500m)が判定したい距離と
// 同程度しかなく、300m/500mのような細かい区分が実質的な意味を持たないため。
let confluenceIndex = null;
const CONFLUENCE_RADIUS_KM = 0.5;
const CONFLUENCE_UPLIFT = 1.15;

function confluenceFactor(lat, lon) {
  // 合流部は外水氾濫の「補正倍率」であって独立した機構ではないため、未ロードでも
  // 外水の評価自体は成立する。ただし最大1.15倍の上乗せが黙って消えるので、
  // waterCaveatText() で「合流部補正は未適用」と明示する。
  if (!confluenceIndex) return 1.0;
  const baseLat = Math.floor(lat / COAST_INDEX_CELL_DEG);
  const baseLon = Math.floor(lon / COAST_INDEX_CELL_DEG);
  for (let dLat = -1; dLat <= 1; dLat++) {
    for (let dLon = -1; dLon <= 1; dLon++) {
      const bucket = confluenceIndex.get(`${baseLat + dLat}_${baseLon + dLon}`);
      if (!bucket) continue;
      for (const [clon, clat] of bucket) {
        if (haversineKm(lat, lon, clat, clon) <= CONFLUENCE_RADIUS_KM) return CONFLUENCE_UPLIFT;
      }
    }
  }
  return 1.0;
}

// ==== 機構3: 高潮・海岸浸水 ====
// 内陸に進むほど地表摩擦で水位が減衰する(中国沿岸の高潮研究で用いられる
// -0.1〜-0.3 m/km の中央値 0.2 m/km を採用)。海岸線上では、従来の
// 海抜3m/5m/10m基準と完全に一致する。
const SURGE_BASE_LEVEL_M = 3.0;
const SURGE_DECAY_M_PER_KM = 0.2;

// 海岸線までの距離。
// CHINA_COASTLINE_POLYGON は陸/海の大雑把な判定(isOnLand)用に置かれた30頂点の
// 多角形で、渤海湾や杭州湾を横切っている。これで距離を測ると天津が「海岸から329km」
// になり、高潮の判定(15km以内)が全国どこでも成立しなくなる。
// そのため距離用には、150m標高タイルから抽出した海岸線の点群
// (data/coastline_points.json、約1.85km間隔・11,339点)を使う。
// 主要都市で検証済み: 上海18km / 天津45km / 深圳5km / 青島1km / 大連4km。
let coastlinePointsIndex = null; // Map<"latCell_lonCell", [[lon,lat],...]>
const COAST_INDEX_CELL_DEG = 0.25;

function buildCoastlineIndex(points) {
  const index = new Map();
  if (!points) return index;
  points.forEach(([lon, lat]) => {
    const key = `${Math.floor(lat / COAST_INDEX_CELL_DEG)}_${Math.floor(lon / COAST_INDEX_CELL_DEG)}`;
    if (!index.has(key)) index.set(key, []);
    index.get(key).push([lon, lat]);
  });
  return index;
}

function coastDistanceKm(lat, lon) {
  if (!coastlinePointsIndex) return Infinity;
  // 高潮が成立するのは15km以内なので、±1セル(約28km四方)だけ調べれば足りる
  const baseLat = Math.floor(lat / COAST_INDEX_CELL_DEG);
  const baseLon = Math.floor(lon / COAST_INDEX_CELL_DEG);
  let minD = Infinity;
  for (let dLat = -1; dLat <= 1; dLat++) {
    for (let dLon = -1; dLon <= 1; dLon++) {
      const bucket = coastlinePointsIndex.get(`${baseLat + dLat}_${baseLon + dLon}`);
      if (!bucket) continue;
      bucket.forEach(([clon, clat]) => {
        const d = haversineKm(lat, lon, clat, clon);
        if (d < minD) minD = d;
      });
    }
  }
  return minD;
}

function surgeScoreAt(lat, lon, elev) {
  // 【2026年9月】海岸線点群が読み込めていない場合、coastDistanceKm() は Infinity を返し、
  // 結果として全地点が「海岸から遠い = 高潮 0」になる。取得失敗が数値 0 に化けて
  // スコアに混ざるのを避けるため、評価不能として null を返す。標高が取れない場合も同じ。
  if (!coastlinePointsIndex) return null;
  if (elev === null) return null;
  const d = coastDistanceKm(lat, lon);
  const reach = SURGE_BASE_LEVEL_M - SURGE_DECAY_M_PER_KM * d;
  if (reach <= 0) return 0; // 15km以上内陸では対象外
  const margin = elev - reach;
  if (margin <= 0) return 1.0;
  if (margin <= 2) return 0.6;
  if (margin <= 7) return 0.25;
  return 0;
}

// data/elevation_risk.geojson は1度グリッドの平均標高を3m/5m/10mの閾値で
// リスク値(1.0/0.75/0.4/0.1)に変換したものしか持たない。全国ヒートマップの
// 高潮判定にはメートル値が要るため、各段階の代表標高に読み戻す。
// あくまで概算で、正確な標高は地点検索側で150mタイルから直接読む。
function elevFromGridProps(props) {
  if (!props) return null;
  if (typeof props.mean_elev_m === 'number') return props.mean_elev_m;
  const r = props.risk;
  if (typeof r !== 'number') return null;
  if (r >= 1.0) return 2;
  if (r >= 0.75) return 4;
  if (r >= 0.4) return 7;
  return 50;
}

// ==== 統合 ====
// 3機構のスコアは確率ではなく正規化した指標のため、足し合わせず最大値を採る。
// 洪水実績(DFO)は「モデルが捉えきれなかった分の補正」として1.0〜1.2倍に留める
// (記録の代表点は影響範囲の重心で、面積の中央値が約73,000km²=270km四方と粗いため)。
const FLOOD_WEIGHT_MAX_UPLIFT = 0.2;

function combineWaterHazard(fluvial, pluvial, surge) {
  const parts = [
    { key: 'fluvial', label: 'River flooding', value: fluvial },
    { key: 'pluvial', label: 'Surface water flooding', value: pluvial },
    { key: 'surge', label: 'Coastal storm surge', value: surge },
  ].filter(p => typeof p.value === 'number');
  // 評価できなかった機構(value が数値でないもの)を記録し、呼び出し側で明示させる
  const missing = [
    { label: 'river flooding', value: fluvial },
    { label: 'surface water flooding', value: pluvial },
    { label: 'coastal storm surge', value: surge },
  ].filter(p => typeof p.value !== 'number').map(p => p.label);
  if (parts.length === 0) return null;
  let top = parts[0];
  parts.forEach(p => { if (p.value > top.value) top = p; });
  // 同率1位が複数ある場合は全て挙げる(例: 高潮と内水がともに1.00に飽和した沿岸低地)
  const tied = parts.filter(p => Math.abs(p.value - top.value) < 0.005).map(p => p.label);
  const dominant = tied.length > 1
    ? `${tied.slice(0, -1).join(', ')} and ${tied[tied.length - 1]}`
    : tied[0];
  return { base: top.value, dominant, dominantKey: top.key, dominantCount: tied.length, missing };
}

// 水害スコアに添える注記。評価できなかった機構がある場合、スコアは
// 「残った機構だけで計算した値」であり、実際のハザードを過小評価しうる。
// その事実を画面とレポートの両方に必ず出す。
function waterCaveatText(missing) {
  const parts = [];
  const hasMissing = missing && missing.length > 0;
  // 「観測範囲外」と「取得失敗」を文言で断定し分けられない(rainfallIntensityScore は
  // どちらでも null を返す)ため、原因を決めつけず "no data" と書く。
  if (hasMissing) parts.push(`${missing.join(', ')} (no data)`);
  if (!confluenceIndex) parts.push('river confluence adjustment (no data)');
  if (parts.length === 0) return '';
  const tail = hasMissing
    ? ' The score reflects only the remaining mechanisms and may understate the hazard.'
    : '';
  return `Not evaluated: ${parts.join('; ')}.${tail}`;
}

// 全国ヒートマップの気候シナリオ選択(0=現在気候)。地点検索・レポートのスコアには
// 一切影響しない(rainfallIntensityScoreの第2引数を渡すのはここだけ)。
let mapRainfallWarming = 0;

  const [rainfallGeojson, elevationGeojson, riversGeojson, coastline, confluences] = await Promise.all([

// 【2026年9月】buildWaterHazardからヒートマップの描画部分だけを分離した。
