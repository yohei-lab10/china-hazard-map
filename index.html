// 降雨のGumbelパラメータ(mu, beta)を最寄り地点から取得(rainfallReturnPeriodInfoと同じ検索ロジックだが、
// グローバルなrainfallSelectedWarmingに依存せず、4シナリオ分を一度に計算するために分離)
function rainfallGumbelParamsAt(lat, lon) {
  if (!rainfallGeojsonCacheGlobal) return null;
  let nearest = null, nearestDist = Infinity;
  rainfallGeojsonCacheGlobal.features.forEach(f => {
    const [flon, flat] = f.geometry.coordinates;
    if (!degBboxFilter(lat, lon, flat, flon, 150)) return;
    const d = haversineKm(lat, lon, flat, flon);
    if (d < nearestDist) { nearestDist = d; nearest = f.properties || {}; }
  });
  if (!nearest || typeof nearest.gumbel_mu !== 'number' || typeof nearest.gumbel_beta !== 'number') return null;
  return { mu: nearest.gumbel_mu, beta: nearest.gumbel_beta, yearsUsed: nearest.years_used };
}

const TIER_LABELS_RPT = ['Low', 'Moderate', 'High', 'Severe', 'Extreme'];

// 1地点分の4ハザード+降雨曲線+標高地形データをまとめて計算する(activeLayersに依存しない)
async function computeReportData(lat, lon) {
  const dLat = metersToDegLat(SEARCH_RADIUS_M);
  const dLon = metersToDegLon(SEARCH_RADIUS_M, lat);
  const locations = [{ latitude: lat, longitude: lon }];
  DIRS.forEach(d => locations.push({ latitude: lat + d.dLat * dLat, longitude: lon + d.dLon * dLon }));
  const reportBlock = await loadElevationBlock(lat, lon, 30);
  let elevations = await elevationsFromTiles(reportBlock, locations);
  if (!elevations) elevations = await fetchElevations(locations);
  const centerElev = elevations[0];
  const surrounding = elevations.slice(1).map((elev, i) => ({ name: DIRS[i].name, elev }));
  const avgSurrounding = surrounding.reduce((s, d) => s + d.elev, 0) / surrounding.length;
  const diff = avgSurrounding - centerElev;
  let compareLabel;
  if (diff >= 1) compareLabel = 'Sits noticeably lower than its surroundings';
  else if (diff >= 0.5) compareLabel = 'Slightly lower than its surroundings';
  else if (diff > -0.5) compareLabel = 'About level with its surroundings';
  else compareLabel = 'Higher than its surroundings — relatively favorable';

  const elevRiskInfo = elevationToRiskInfo(centerElev);

  // 地点検索と同じ3機構モデルで評価する。窪み係数は21x21グリッドの標高分布から求める。
  const reportGrid = [];
  if (reportBlock && reportBlock.ok) {
    const cellDLatR = metersToDegLat(GRID_CELL_M);
    for (let i = -GRID_STEPS; i <= GRID_STEPS; i++) {
      const cellLat = lat + i * cellDLatR;
      const cellDLonR = metersToDegLon(GRID_CELL_M, cellLat);
      for (let j = -GRID_STEPS; j <= GRID_STEPS; j++) {
        reportGrid.push(reportBlock.get(cellLat, lon + j * cellDLonR));
      }
    }
  }
  const reportDepression = depressionFactor(centerElev, reportGrid);
  const reportRain = rainfallIntensityScore(lat, lon);
  const reportPluvial = reportRain === null ? null : Math.max(0, Math.min(1, reportRain * reportDepression.factor));
  const reportFluvial = fluvialScoreAt(lat, lon, reportBlock && reportBlock.ok ? reportBlock.get : null, centerElev);
  const reportSurge = surgeScoreAt(lat, lon, centerElev);
  const reportCombined = combineWaterHazard(reportFluvial, reportPluvial, reportSurge);

  let water;
  if (!reportCombined) {
    water = { label: 'No rainfall data (outside CHIRPS coverage)', color: NO_DATA_COLOR, colors: WARNING_TIER_COLORS, ratio: null };
  } else {
    const weight = floodWeightAt(lat, lon);
    const finalRisk = Math.min(1.0, reportCombined.base * weight);
    const tier = Math.min(4, Math.max(0, Math.ceil(finalRisk * 5) - 1));
    water = {
      label: `${TIER_LABELS_RPT[tier]} water hazard (${finalRisk.toFixed(2)})`,
      color: WARNING_TIER_COLORS[tier], colors: WARNING_TIER_COLORS, ratio: finalRisk,
      dominant: reportCombined.dominant,
    };
  }

  const eqInfo = earthquakeRiskInfo(lat, lon);
  const earthquake = eqInfo
    ? { label: `${TIER_LABELS_RPT[eqInfo.tier]} earthquake hazard (${eqInfo.valueLabel})`, color: eqInfo.color, colors: EARTHQUAKE_TIER_COLORS, ratio: eqInfo.ratio }
    : { label: 'No M5.0+ earthquake within 100km', color: NO_DATA_COLOR, colors: EARTHQUAKE_TIER_COLORS, ratio: null };

  const tyInfo = typhoonRiskInfo(lat, lon);
  const tyFreq = typhoonReturnPeriodInfo(lat, lon);
  const typhoon = tyInfo
    ? { label: `${TYPHOON_TIER_LABELS[tyInfo.tier]} hazard (${tyInfo.valueLabel})`, color: tyInfo.color, colors: TYPHOON_TIER_COLORS, labels: TYPHOON_TIER_LABELS, ratio: tyInfo.ratio, freq: tyFreq }
    : { label: 'No typhoon (34kt+) impact at this point', color: NO_DATA_COLOR, colors: TYPHOON_TIER_COLORS, labels: TYPHOON_TIER_LABELS, ratio: null, freq: tyFreq };

  const ltInfo = lightningRiskInfo(lat, lon);
  const lightning = ltInfo
    ? { label: `${TIER_LABELS_RPT[ltInfo.tier]} lightning hazard (${ltInfo.valueLabel})`, color: ltInfo.color, colors: WARNING_TIER_COLORS, ratio: ltInfo.ratio }
    : { label: 'No significant lightning density nearby', color: NO_DATA_COLOR, colors: WARNING_TIER_COLORS, ratio: null };

  // 降雨再現期間: Current/+1.5/+2/+3℃の4シナリオをまとめて計算(グラフ用)
  const gumbel = rainfallGumbelParamsAt(lat, lon);
  let rainfallCurves = null;
  if (gumbel) {
    rainfallCurves = RAINFALL_WARMING_SCENARIOS.map(w => {
      const ccFactor = 1 + (RAINFALL_CC_PCT_PER_DEG / 100) * w;
      return {
        warming: w,
        values: RAINFALL_RETURN_PERIODS_YR.map(T => (gumbel.mu - gumbel.beta * Math.log(-Math.log(1 - 1 / T))) * ccFactor),
      };
    });
  }

  return { centerElev, surrounding, diff, compareLabel, water, earthquake, typhoon, lightning, rainfallCurves, yearsUsed: gumbel ? gumbel.yearsUsed : null };
}

function rptLegendBar(colors, ratio) {
  const useColors = colors || WARNING_TIER_COLORS;
  const grad = useColors.map((c, i) => `${c} ${(i / (useColors.length - 1) * 100).toFixed(0)}%`).join(', ');
  const hasMarker = typeof ratio === 'number' && !isNaN(ratio);
  const pct = hasMarker ? Math.min(99, Math.max(1, ratio * 100)) : 0;
  return `<div class="rpt-bar-wrap" style="background:linear-gradient(to right, ${grad});">
    ${hasMarker ? `<div class="rpt-bar-marker" style="left:${pct.toFixed(1)}%;">▽</div>` : ''}
  </div>`;
}

function rptBadgeColors(hexColor) {
  // バッジの背景はハザード色の薄いトーン、文字は同系統の濃い色にする(簡易変換)
  return { bg: hexColor + '22', text: hexColor };
}

async function loadScriptOnce(src) {
  if (document.querySelector(`script[src="${src}"]`)) return;
  await new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = src; s.onload = resolve; s.onerror = reject;
    document.head.appendChild(s);
  });
}

async function generateIntegratedReport() {
  const btn = document.getElementById('reportGenerateBtn');
  const status = document.getElementById('reportStatus');
  const validLocs = reportLocations.filter(l => l.lat !== '' && l.lon !== '');
  if (validLocs.length === 0) { status.textContent = 'Enter at least one location.'; return; }
  btn.disabled = true;
  status.textContent = 'Computing hazard data…';

  const system = document.querySelector('input[name="reportCoordSystem"]:checked').value;

  try {
    await loadScriptOnce('https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js');
    await loadScriptOnce('https://cdnjs.cloudflare.com/ajax/libs/plotly.js/2.27.0/plotly.min.js');
    await loadScriptOnce('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js');
    await loadScriptOnce('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js');

    const results = [];
    for (const loc of validLocs) {
      let lat = parseFloat(loc.lat), lon = parseFloat(loc.lon);
      if (isNaN(lat) || isNaN(lon)) continue;
      if ((lat < -90 || lat > 90) && lon >= -90 && lon <= 90) [lat, lon] = [lon, lat];
      if (system === 'gcj02') { const c = gcj02ToWgs84(lat, lon); lat = c.lat; lon = c.lon; }
      else if (system === 'bd09') { const c = bd09ToWgs84(lat, lon); lat = c.lat; lon = c.lon; }
      const data = await computeReportData(lat, lon);
      results.push({ name: loc.name || `${lat.toFixed(4)}, ${lon.toFixed(4)}`, lat, lon, data });
    }

    if (results.length === 0) { status.textContent = 'No valid coordinates entered.'; btn.disabled = false; return; }

    status.textContent = 'Rendering charts…';
    await renderReportView(results);

    status.textContent = 'Building PDF…';
    const { jsPDF } = window.jspdf;
    let pdf = null;
    const pages = document.querySelectorAll('#reportView .rpt-page');
    for (let i = 0; i < pages.length; i++) {
      // scale:2 で高解像度化。各拠点1ページぶんの全内容を、改ページなしで1枚の縦長ページに収める
      const canvas = await html2canvas(pages[i], { scale: 2, backgroundColor: '#ffffff', useCORS: true });
      const imgData = canvas.toDataURL('image/png');
      const pageWidthMm = 210; // A4幅に合わせ、縦は内容量に応じて可変(1枚に収める)
      const pageHeightMm = canvas.height * (pageWidthMm / canvas.width);
      if (!pdf) {
        pdf = new jsPDF({ unit: 'mm', format: [pageWidthMm, pageHeightMm] });
      } else {
        pdf.addPage([pageWidthMm, pageHeightMm]);
      }
      pdf.addImage(imgData, 'PNG', 0, 0, pageWidthMm, pageHeightMm);
    }
    pdf.save(`hazard-report-${new Date().toISOString().slice(0, 10)}.pdf`);

    document.getElementById('reportView').innerHTML = '';
    status.textContent = 'PDF downloaded.';
    btn.disabled = false;
  } catch (e) {
    console.error(e);
    status.textContent = 'Failed to generate report. Please try again.';
    btn.disabled = false;
  }
}

async function renderReportView(results) {
  let view = document.getElementById('reportView');
  if (!view) {
    view = document.createElement('div');
    view.id = 'reportView';
    document.body.appendChild(view);
  }
  const today = new Date().toISOString().slice(0, 10);
  view.innerHTML = results.map((r, i) => `
    <div class="rpt-page">
      <div class="rpt-head">
        <div style="width:64px;height:20px;background:#f5f5f3;border-radius:4px;font-size:10px;color:#898781;display:flex;align-items:center;justify-content:center;">LOGO</div>
        <div>
          <div class="rpt-title">Natural catastrophe risk report</div>
          <div class="rpt-meta">Generated ${today} · WGS84</div>
        </div>
      </div>
      <div class="rpt-loc-name">${escapeHtml(r.name)}</div>
      <div class="rpt-loc-coords">${r.lat.toFixed(4)}, ${r.lon.toFixed(4)}</div>

      <div class="rpt-section">
        <div class="rpt-h">Earthquake</div>
        <div class="rpt-desc">${HAZARD_DESCRIPTIONS.earthquake}</div>
        ${rptLegendBar(r.data.earthquake.colors, r.data.earthquake.ratio)}
        <span class="rpt-badge" style="background:${rptBadgeColors(r.data.earthquake.color).bg}; color:${rptBadgeColors(r.data.earthquake.color).text};">${r.data.earthquake.label}</span>
      </div>

      <div class="rpt-section">
        <div class="rpt-h">Typhoon</div>
        <div class="rpt-desc">${HAZARD_DESCRIPTIONS.typhoon}</div>
        ${rptLegendBar(r.data.typhoon.colors, r.data.typhoon.ratio)}
        <span class="rpt-badge" style="background:${rptBadgeColors(r.data.typhoon.color).bg}; color:${rptBadgeColors(r.data.typhoon.color).text};">${r.data.typhoon.label}</span>
        <div class="rpt-comment">${r.data.typhoon.freq && r.data.typhoon.freq.observed ? `Typhoon frequency: ~${r.data.typhoon.freq.returnPeriod.toFixed(1)}yr return period (based on ${r.data.typhoon.freq.totalYears}yrs of data).` : ''}</div>
      </div>

      <div class="rpt-section">
        <div class="rpt-h">Lightning</div>
        <div class="rpt-desc">${HAZARD_DESCRIPTIONS.lightning}</div>
        ${rptLegendBar(r.data.lightning.colors, r.data.lightning.ratio)}
        <span class="rpt-badge" style="background:${rptBadgeColors(r.data.lightning.color).bg}; color:${rptBadgeColors(r.data.lightning.color).text};">${r.data.lightning.label}</span>
      </div>

      <div class="rpt-section">
        <div class="rpt-h">Water hazard</div>
        <div class="rpt-desc">${HAZARD_DESCRIPTIONS.water}</div>
        ${rptLegendBar(r.data.water.colors, r.data.water.ratio)}
        <span class="rpt-badge" style="background:${rptBadgeColors(r.data.water.color).bg}; color:${rptBadgeColors(r.data.water.color).text};">${r.data.water.label}</span>

        ${r.data.rainfallCurves ? `
        <div style="margin-top:14px;">
          <div class="rpt-h" style="font-size:11px;">Rainfall return period</div>
          <div class="rpt-desc">24h rainfall expected to be exceeded on average once every N years, from ${r.data.yearsUsed || '—'} years of CHIRPS data fit to a Gumbel distribution. Reference only.</div>
          <div class="rpt-mono">${RAINFALL_RETURN_PERIODS_YR.map((T, ti) => `${T}yr: ~${r.data.rainfallCurves[0].values[ti].toFixed(0)}mm`).join(' / ')} (${r.data.yearsUsed || '—'}yrs data)</div>
          <div style="margin:8px 0 4px;"><canvas id="rptChart${i}" width="640" height="220"></canvas></div>
          <div style="display:flex; flex-wrap:wrap; gap:10px; font-size:10px; color:#52514e;">
            <span><span style="display:inline-block;width:8px;height:8px;background:#378ADD;border-radius:2px;margin-right:4px;"></span>Current</span>
            <span><span style="display:inline-block;width:8px;height:8px;background:#1D9E75;border-radius:2px;margin-right:4px;"></span>+1.5°C</span>
            <span><span style="display:inline-block;width:8px;height:8px;background:#EF9F27;border-radius:2px;margin-right:4px;"></span>+2°C</span>
            <span><span style="display:inline-block;width:8px;height:8px;background:#D85A30;border-radius:2px;margin-right:4px;"></span>+3°C</span>
          </div>
        </div>` : ''}

        <div style="margin-top:14px;">
          <div class="rpt-h" style="font-size:11px;">Elevation vs. surroundings</div>
          <div class="rpt-desc">Center point vs. 8 surrounding directions within 100m. The black marker shows the searched location. Color and height both represent elevation (m). Reference only.</div>
          <div id="rptTerrain${i}" style="width:100%; height:230px;"></div>
        </div>
      </div>

      <div class="rpt-footer">This report is for reference only and is not a guarantee or sole basis for insurance underwriting decisions. Rainfall return period and elevation comparison are reference values not used in the Water Hazard score.</div>
    </div>
  `).join('');

  await Promise.all(results.map((r, i) => new Promise((resolveLoc) => {
    const tasks = [];
    if (r.data.rainfallCurves) {
      tasks.push(new Promise((resolveChart) => {
        const canvas = document.getElementById(`rptChart${i}`);
        const colors = ['#378ADD', '#1D9E75', '#EF9F27', '#D85A30'];
        new Chart(canvas, {
          type: 'line',
          data: {
            labels: RAINFALL_RETURN_PERIODS_YR.map(T => `${T}yr`),
            datasets: r.data.rainfallCurves.map((c, ci) => ({
              data: c.values, borderColor: colors[ci], backgroundColor: 'transparent', tension: 0.35, pointRadius: 2,
            })),
          },
          options: {
            responsive: false, animation: { onComplete: () => resolveChart() },
            plugins: { legend: { display: false }, tooltip: { enabled: false } },
            scales: {
              y: { title: { display: true, text: 'mm', color: '#898781', font: { size: 10 } }, ticks: { color: '#898781', font: { size: 10 } }, grid: { color: '#e1e0d9' } },
              x: { title: { display: true, text: 'return period', color: '#898781', font: { size: 10 } }, ticks: { color: '#898781', font: { size: 10 } }, grid: { display: false } },
            },
          },
        });
      }));
    }

    // 標高地形: 中心+周囲8方向(実測9点)を3x3グリッドとしてプロット(補間はしない)
    const order = ['NW', 'N', 'NE', 'W', null, 'E', 'SW', 'S', 'SE'];
    const elevByName = { C: r.data.centerElev };
    r.data.surrounding.forEach(s => { elevByName[s.name] = s.elev; });
    const z = [[0, 0, 0], [0, 0, 0], [0, 0, 0]];
    order.forEach((name, idx) => {
      const row = Math.floor(idx / 3), col = idx % 3;
      z[row][col] = name === null ? elevByName.C : elevByName[name];
    });
    const axis = [-100, 0, 100];
    const terrainDiv = document.getElementById(`rptTerrain${i}`);
    // 検索地点(中心=0,0)がどこかひと目でわかるよう、地表面より少し浮かせたマーカーを重ねる
    const centerMarkerZ = elevByName.C + Math.max(1, (Math.max(...Object.values(elevByName)) - Math.min(...Object.values(elevByName))) * 0.15);
    tasks.push(
      Plotly.newPlot(terrainDiv, [{
        z, x: axis, y: axis, type: 'surface', showscale: true,
        colorscale: [[0, '#185FA5'], [0.35, '#1D9E75'], [0.6, '#FAC775'], [0.8, '#D85A30'], [1, '#791F1F']],
        contours: { z: { show: false } },
        colorbar: { title: { text: 'elevation (m)', side: 'right', font: { size: 10, color: '#52514e' } }, tickfont: { size: 9, color: '#898781' }, thickness: 12, len: 0.7 },
      }, {
        type: 'scatter3d', mode: 'markers+text', x: [0], y: [0], z: [centerMarkerZ],
        text: ['Search point'], textposition: 'top center',
        textfont: { size: 10, color: '#0b0b0b' },
        marker: { size: 6, color: '#0b0b0b', symbol: 'diamond', line: { color: '#ffffff', width: 1.5 } },
        showlegend: false, hoverinfo: 'skip',
      }], {
        margin: { l: 0, r: 0, t: 0, b: 0 },
        scene: {
          xaxis: { title: { text: 'E–W (m)', font: { size: 9, color: '#898781' } }, tickfont: { size: 8, color: '#898781' }, gridcolor: '#e1e0d9' },
          yaxis: { title: { text: 'N–S (m)', font: { size: 9, color: '#898781' } }, tickfont: { size: 8, color: '#898781' }, gridcolor: '#e1e0d9' },
          zaxis: { title: { text: 'elevation (m)', font: { size: 9, color: '#898781' } }, tickfont: { size: 8, color: '#898781' } },
          camera: { eye: { x: 1.3, y: -1.3, z: 1.7 } },
        },
        paper_bgcolor: '#ffffff', plot_bgcolor: '#ffffff',
      }, { displayModeBar: false, responsive: false })
        // html2canvas/印刷はWebGLキャンバスを正しく捕捉できないことがあるため、
        // Plotly自身の画像書き出しAPIで静止画に変換し、<img>に差し替えて確実にPDFへ焼き込む
        .then(() => Plotly.toImage(terrainDiv, { format: 'png', width: terrainDiv.clientWidth * 2, height: 230 * 2 }))
        .then(dataUrl => {
          const img = document.createElement('img');
          img.src = dataUrl;
          img.style.width = '100%';
          img.style.height = '230px';
          img.style.display = 'block';
          terrainDiv.replaceWith(img);
        })
    );

    Promise.all(tasks).then(resolveLoc);
  })));
}

// 地図タップは、以前はシングルタップで即検索していたが、地図を軽くタップ/パンする操作と
// 誤操作しやすいため、長押し(500ms)専用に変更した。
//
// 【バグ修正 2026年8月・その2】当初はLeafletの'mousedown'イベントでタイマーを開始して
// いたが、スマホでは全く動作しなかった。原因は、タッチ操作の「互換mousedownイベント」は
// 指を触れた瞬間ではなく指を離した瞬間(touchend後)に初めて発火するため、押している間は
// 一切発火せず、長押しの検知が原理的に不可能だったこと。native の touchstart/touchmove/
// touchend を直接使う方式に変更し、押した瞬間から正しくタイマーを開始できるようにした。
//
// 【バグ修正 2026年8月・その3】その際、指のブレでLeaflet自身のパンが先に始まってしまう
// のを防ごうとdragging機能を一時的に無効化していたが、これが原因で通常の1本指パンその
// ものが機能しなくなった(touchstartの瞬間に毎回パンを止めてしまうため、Leaflet側が
// ドラッグ開始を検知できなかった。2本指の場合はこの無効化処理を通らないため無事だった)。
// dragging.disable/enableは撤去し、自前の移動量チェック(10px)とLeafletの'dragstart'/
// 'zoomstart'イベントの両方で長押し判定をキャンセルする、素直な方式に戻した。
const LONG_PRESS_MS = 500;
const LONG_PRESS_MOVE_TOLERANCE_PX = 10;
let longPressTimer = null;
let longPressStartPoint = null;

function cancelLongPress() {
  if (longPressTimer) { clearTimeout(longPressTimer); longPressTimer = null; }
  longPressStartPoint = null;
}

function startLongPress(evt) {
  const containerPoint = map.mouseEventToContainerPoint(evt);
  const latlng = map.containerPointToLatLng(containerPoint);
  longPressStartPoint = containerPoint;
  clearTimeout(longPressTimer);
  longPressTimer = setTimeout(() => {
    longPressTimer = null;
    document.getElementById('searchLat').value = latlng.lat.toFixed(4);
    document.getElementById('searchLon').value = latlng.lng.toFixed(4);
    queryPoint(latlng.lat, latlng.lng);
    if (navigator.vibrate) navigator.vibrate(10); // 長押しが認識されたことを伝える軽い振動(対応端末のみ)
  }, LONG_PRESS_MS);
}

function moveLongPress(evt) {
  if (!longPressTimer || !longPressStartPoint) return;
  const pt = map.mouseEventToContainerPoint(evt);
  if (pt.distanceTo(longPressStartPoint) > LONG_PRESS_MOVE_TOLERANCE_PX) cancelLongPress();
}

const mapContainer = map.getContainer();

// タッチ操作(スマホ): touchstartは指を触れた瞬間に発火するため、ここでタイマーを開始する
mapContainer.addEventListener('touchstart', (e) => {
  if (e.touches.length !== 1) { cancelLongPress(); return; } // 2本指以降(ピンチ操作等)は対象外
  e.preventDefault(); // OS標準の長押しメニューを抑止し、後続の合成mousedownの重複発火も防ぐ
  startLongPress(e.touches[0]);
}, { passive: false });
mapContainer.addEventListener('touchmove', (e) => {
  if (e.touches.length !== 1) return;
  moveLongPress(e.touches[0]);
}, { passive: true });
mapContainer.addEventListener('touchend', cancelLongPress, { passive: true });
mapContainer.addEventListener('touchcancel', cancelLongPress, { passive: true });

// マウス操作(PC): mousedownは押した瞬間に発火するため、そのまま使える
mapContainer.addEventListener('mousedown', startLongPress);
mapContainer.addEventListener('mousemove', moveLongPress);
mapContainer.addEventListener('mouseup', cancelLongPress);

// 実際にLeaflet側でパン/ズームが始まった場合も、念のため長押し判定を確実にキャンセルする
map.on('dragstart zoomstart', cancelLongPress);

// ブラウザの右クリックメニュー(PC)が独自の長押し検索と競合しないよう抑止する
mapContainer.addEventListener('contextmenu', (e) => e.preventDefault());
</script>
