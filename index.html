<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>China Natural Catastrophe Risk Map</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
  :root {
    --bg: #F3F4F6;
    --panel: #FFFFFF;
    --border: #E0E3E8;
    --border-strong: #C7CCD4;
    --text-primary: #1A2130;
    --text-muted: #5C6675;
    --text-faint: #94A0AF;
    --navy: #1F3A5F;
    --navy-soft: #2C4E7C;
    --risk-low: #3F8F5F;
    --risk-mid: #D9A22C;
    --risk-high: #D9722C;
    --risk-severe: #C13A2E;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; background: var(--bg); }
  body { font-family: 'Inter', sans-serif; }

  #app {
    position: relative;
    width: 100%;
    max-width: 430px;
    height: 100vh;
    max-height: 860px;
    margin: 0 auto;
    background: var(--bg);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    box-shadow: 0 0 0 1px var(--border);
  }

  /* Header */
  .masthead-top {
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 16px 12px; background: var(--panel);
  }
  .brand { display: flex; align-items: center; gap: 11px; }
  .seal-logo {
    width: 32px; height: 32px; border-radius: 6px; background: var(--navy);
    display: flex; align-items: center; justify-content: center;
    font-family: 'JetBrains Mono', monospace; font-weight: 700; color: #fff; font-size: 12px;
    letter-spacing: -0.5px; flex-shrink: 0;
  }
  .brand-text { display: flex; flex-direction: column; gap: 1px; }
  .brand-title {
    font-family: 'Inter', sans-serif; font-weight: 800; font-size: 14.5px;
    color: var(--text-primary); letter-spacing: -0.2px; line-height: 1.2;
  }
  .brand-sub {
    font-family: 'JetBrains Mono', monospace; font-size: 8.5px; letter-spacing: 1.1px;
    color: var(--text-faint); text-transform: uppercase;
  }
  .methodology-btn {
    font-family: 'JetBrains Mono', monospace; font-size: 9.5px; font-weight: 600; letter-spacing: 0.5px;
    color: var(--text-muted); background: var(--bg); border: 1px solid var(--border-strong);
    border-radius: 5px; padding: 7px 10px; flex-shrink: 0;
  }
  .methodology-btn.active { color: #fff; background: var(--navy); border-color: var(--navy); }
  .rule-thin { height: 1px; background: var(--border); }

  /* Methodology panel */
  .methodology-panel {
    display: none; padding: 12px 16px 14px; background: var(--panel);
    border-bottom: 1px solid var(--border); flex-shrink: 0;
  }
  .methodology-panel.visible { display: block; }
  .method-item { margin-bottom: 10px; }
  .method-item:last-child { margin-bottom: 0; }
  .method-label {
    display: flex; align-items: center; gap: 6px;
    font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 700;
    letter-spacing: 0.5px; text-transform: uppercase; color: var(--text-primary); margin-bottom: 3px;
  }
  .method-label .dot { width: 7px; height: 7px; border-radius: 2px; flex-shrink: 0; }
  .method-desc { font-family: 'Inter', sans-serif; font-size: 11px; line-height: 1.55; color: var(--text-muted); }

  /* Layer toggle chips */
  .layer-bar {
    display: flex; gap: 8px; padding: 10px 16px; overflow-x: auto;
    border-bottom: 1px solid var(--border); flex-shrink: 0; background: var(--panel);
  }
  .layer-chip {
    display: flex; align-items: center; gap: 6px;
    font-family: 'Inter', sans-serif; font-size: 11.5px; font-weight: 600;
    padding: 6px 12px; border-radius: 6px; white-space: nowrap; flex-shrink: 0;
    border: 1px solid var(--border-strong); background: var(--bg); color: var(--text-muted);
  }
  .layer-chip .dot { width: 7px; height: 7px; border-radius: 2px; flex-shrink: 0; }
  .layer-chip.active { color: #fff; border-color: transparent; }

  /* Search panel */
  .search-bar {
    display: flex; flex-direction: column; gap: 7px; padding: 10px 16px;
    border-bottom: 1px solid var(--border); background: var(--panel); flex-shrink: 0;
  }
  .search-row { display: flex; gap: 8px; align-items: center; }
  .search-row input {
    flex: 1; min-width: 0; font-family: 'JetBrains Mono', monospace; font-size: 12px;
    background: var(--bg); color: var(--text-primary); border: 1px solid var(--border-strong);
    border-radius: 6px; padding: 8px 9px;
  }
  .search-row input::placeholder { color: var(--text-faint); }
  .search-row button {
    font-family: 'Inter', sans-serif; font-size: 12px; font-weight: 700;
    background: var(--navy); color: #fff; border: none; border-radius: 6px;
    padding: 9px 16px; flex-shrink: 0;
  }
  .search-hint { font-size: 10px; color: var(--text-faint); }
  .search-result {
    display: none; padding: 11px 16px; background: var(--panel);
    border-bottom: 1px solid var(--border); flex-shrink: 0;
  }
  .search-result.visible { display: block; }
  .result-badge {
    display: inline-block; font-family: 'Inter', sans-serif; font-weight: 700; font-size: 11.5px;
    padding: 4px 10px; border-radius: 5px; margin-bottom: 7px; color: #fff;
  }
  .result-elev { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--text-primary); margin-bottom: 8px; line-height: 1.5; }
  .result-dirs {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px;
    font-family: 'JetBrains Mono', monospace; font-size: 9.5px; color: var(--text-muted);
  }
  .result-dirs div { text-align: center; background: var(--bg); border-radius: 4px; padding: 4px 2px; }
  .risk-legend { display: flex; align-items: center; gap: 6px; margin-top: 9px; }
  .risk-legend-bar {
    display: flex; flex: 1; height: 12px; border-radius: 6px; overflow: hidden;
  }
  .risk-legend-bar span { flex: 1; }
  .risk-legend-labels {
    display: flex; justify-content: space-between; font-family: 'JetBrains Mono', monospace;
    font-size: 8px; color: var(--text-faint); margin-top: 2px;
  }
  .risk-legend-nodata {
    display: flex; align-items: center; gap: 4px; font-family: 'JetBrains Mono', monospace;
    font-size: 8.5px; color: var(--text-faint); margin-top: 4px;
  }
  .risk-legend-nodata .swatch { width: 10px; height: 10px; border-radius: 2px; flex-shrink: 0; }

  /* Map */
  #map { flex: 1; width: 100%; background: var(--bg); }
  .leaflet-popup-content-wrapper {
    background: var(--panel); color: var(--text-primary); border: 1px solid var(--border);
    border-radius: 6px; font-family: 'Inter', sans-serif; box-shadow: 0 2px 10px rgba(26,33,48,0.12);
  }
  .leaflet-popup-tip { background: var(--panel); }
  .leaflet-popup-content { margin: 10px 12px; font-size: 12px; line-height: 1.6; }
  .popup-title { font-family: 'Inter', sans-serif; font-weight: 700; font-size: 13px; color: var(--text-primary); margin-bottom: 4px; }
  .popup-row { color: var(--text-muted); font-size: 11px; }

  .status-bar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 7px 16px; border-top: 1px solid var(--border); background: var(--panel); flex-shrink: 0;
  }
  .mono-small {
    font-family: 'JetBrains Mono', monospace; font-size: 9.5px; letter-spacing: 0.5px;
    color: var(--text-faint); text-transform: uppercase;
  }
  .legend-note { font-family: 'Inter', sans-serif; font-size: 10.5px; color: var(--text-muted); line-height: 1.55; padding: 0 16px 10px; background: var(--panel); }
  .legend-note.collapsed .legend-full { display: none; }
  .legend-note .legend-toggle {
    display: block; margin-top: 4px; font-family: 'JetBrains Mono', monospace; font-size: 9.5px;
    font-weight: 600; letter-spacing: 0.4px; color: var(--navy); cursor: pointer;
  }
</style>
</head>
<body>
<div id="app">
  <div>
    <div class="masthead-top">
      <div class="brand">
        <div class="brand-text">
          <div class="brand-title">China Natural Catastrophe Risk Map</div>
          <div class="brand-sub">Historical Peril & Hazard Layers</div>
        </div>
      </div>
      <button class="methodology-btn" id="methodologyBtn">METHODOLOGY</button>
    </div>
    <div class="rule-thin"></div>
  </div>

  <div class="methodology-panel" id="methodologyPanel"></div>

  <div class="layer-bar" id="layerBar"></div>

  <div class="search-bar">
    <div class="search-row">
      <input type="text" id="searchLat" placeholder="Latitude, e.g. 31.23" inputmode="decimal">
      <input type="text" id="searchLon" placeholder="Longitude, e.g. 121.47" inputmode="decimal">
      <button id="searchBtn">Locate</button>
    </div>
    <div style="display:flex;flex-direction:column;gap:4px;">
      <label style="display:flex;align-items:center;gap:6px;font-size:10.5px;color:var(--text-muted);">
        <input type="radio" name="coordSystem" id="coordWgs84" value="wgs84" checked style="width:14px;height:14px;">
        WGS84 (OpenStreetMap, GPS) — no conversion needed
      </label>
      <label style="display:flex;align-items:center;gap:6px;font-size:10.5px;color:var(--text-muted);">
        <input type="radio" name="coordSystem" id="coordGcj02" value="gcj02" style="width:14px;height:14px;">
        GCJ-02 (Amap / 高德地图) — converts automatically
      </label>
      <label style="display:flex;align-items:center;gap:6px;font-size:10.5px;color:var(--text-muted);">
        <input type="radio" name="coordSystem" id="coordBd09" value="bd09" style="width:14px;height:14px;">
        BD-09 (Baidu Maps / 百度地图) — converts automatically
      </label>
    </div>
  </div>
  <div class="search-result" id="searchResult"></div>

  <div id="map"></div>

  <div class="status-bar">
    <span class="mono-small" id="statusLabel">Loading…</span>
    <span class="mono-small" id="countLabel"></span>
  </div>
  <div class="legend-note" id="legendNote"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.heat/0.2.0/leaflet-heat.js"></script>
<script>
// Peril identity colors (used for chip dots / markers — distinguishes hazard TYPE)
const COLORS = {
  earthquake: '#C13A2E',
  lightning: '#D9A22C',
  typhoonHazard: '#2C4E7C',
  waterHazard: '#3F8F5F',
  aqueductFloods: '#6B4E9A',
};

// Gray used to mark grid cells with no data (outside CHIRPS coverage etc.) — must never be
// confused with "low risk"; always paired with a "no data" label wherever it's used.
const NO_DATA_COLOR = '#9AA3AF';

// Risk-intensity gradient used inside every hazard heatmap (severity, independent of peril type)
const HAZARD_GRADIENT = { 0.33: '#3F8F5F', 0.66: '#D9A22C', 1.0: '#C13A2E' };

// Bounding box used as a cheap first-pass filter before the coastline polygon test
const CHINA_LAND_BBOX = { minlat: 18, maxlat: 41, minlon: 97, maxlon: 123 };

// Rough coastline polygon (mainland China only, Taiwan Strait kept on the mainland side)
// used to exclude open-water track points that a simple bounding box would still include
// (e.g. the East China Sea, Yellow Sea, and Bohai Sea). Approximate, for visualization only.
const CHINA_COASTLINE_POLYGON = [
  [97, 18], [108, 18], [110, 20.2], [112.5, 21.5], [113.6, 22.2], [116.7, 23.4],
  [118.2, 24.5], [119.6, 24.9], [120.2, 26.0], [120.8, 27.9], [121.6, 29.0],
  [121.9, 30.8], [122.1, 31.6], [121.0, 32.1], [120.2, 33.3], [119.5, 34.3],
  [119.0, 35.1], [119.6, 36.0], [120.8, 37.0], [121.6, 37.4], [122.6, 37.8],
  [121.0, 38.9], [122.5, 40.0], [124.3, 40.0], [126.5, 42.5], [130.5, 46.0],
  [134.5, 48.5], [131.0, 50.5], [120.0, 53.5], [97, 53.5],
];

// Ray-casting point-in-polygon test
function isOnLand(lat, lon) {
  const poly = CHINA_COASTLINE_POLYGON;
  let inside = false;
  for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
    const [xi, yi] = poly[i], [xj, yj] = poly[j];
    const intersect = ((yi > lat) !== (yj > lat)) &&
      (lon < (xj - xi) * (lat - yi) / (yj - yi) + xi);
    if (intersect) inside = !inside;
  }
  return inside;
}

const LAYERS = [
  { key: 'earthquake', label: 'Earthquakes', color: COLORS.earthquake,
    note: 'Earthquakes: historical M5.0+ events across China, based on USGS earthquake catalog data. Marker size scales with magnitude.' },
  { key: 'lightning', label: 'Lightning', color: COLORS.lightning,
    note: 'Lightning: an illustrative reference layer based on global lightning climatology data.' },
  { key: 'typhoonHazard', label: 'Typhoon Hazard', color: COLORS.typhoonHazard,
    note: 'Typhoon Hazard: created based on historical typhoon track and wind speed data. Reflects past activity, not a forecast.' },
  { key: 'waterHazard', label: 'Water Hazard', color: COLORS.waterHazard,
    note: 'Water Hazard: created based on historical rainfall, elevation, proximity to rivers/lakes/coastline, and past flood record data. Gray tiles mean data is unavailable there, not that risk is low.' },
  { key: 'aqueductFloods', label: 'Aqueduct Floods', color: COLORS.aqueductFloods,
    note: 'Aqueduct Floods: river flood simulation data from WRI, shown as a separate reference layer from Water Hazard. Gray tiles mean data is unavailable there, not that risk is low.' },
];

const METHODOLOGY = [
  { label: 'Earthquakes', color: COLORS.earthquake,
    desc: 'Source: USGS Earthquake Catalog. Historical M5.0+ events across China, updated periodically.' },
  { label: 'Lightning', color: COLORS.lightning,
    desc: 'Source: global lightning climatology data. An illustrative reference layer only, not a real-time warning.' },
  { label: 'Typhoon Hazard', color: COLORS.typhoonHazard,
    desc: 'Source: IBTrACS historical typhoon track data. Reflects past storm activity along the China coast, not a forecast.' },
  { label: 'Water Hazard', color: COLORS.waterHazard,
    desc: 'Created based on historical rainfall, elevation, proximity to rivers/lakes/coastline, and past flood record data. A simplified reference indicator, not a hydrodynamic flood simulation. Gray tiles mean data is unavailable there, not that risk is low.' },
  { label: 'Aqueduct Floods', color: COLORS.aqueductFloods,
    desc: 'Source: WRI Aqueduct Floods hydrodynamic river-flood simulation data. Shown as a separate reference layer, not combined with Water Hazard above.' },
  { label: 'Point Lookup', color: '#5C6675',
    desc: 'On-demand elevation lookup for the tapped point and its surroundings, plus a shaded grid reflecting nearby hazard data for each active layer. The risk badge and comparison grid appear while the Water Hazard chip is active.' },
];

const TYPHOON_SAMPLE = [
  { points: [[20.5,128.0],[22.5,122.0],[24.0,120.0],[24.82,118.57]] },
  { points: [[27.9,128.5],[28.6,124.9],[29.5,122.5],[29.99,122.30]] },
  { points: [[24.8,127.0],[27.0,124.5],[29.0,122.3],[29.99,122.30]] },
  { points: [[22.0,130.0],[26.0,125.5],[28.0,121.8],[28.37,121.36]] },
];

const LOWLAND_FLOOD_PRONE_PROXY = [
  { center: [31.0, 121.4], weight: 0.7 },
  { center: [23.1, 113.3], weight: 0.65 },
  { center: [34.75, 113.65], weight: 0.6 },
  { center: [30.5, 114.3], weight: 0.55 },
  { center: [39.9, 116.4], weight: 0.5 },
];

const LIGHTNING_SAMPLE = [
  [23.1,113.3,0.9],[22.5,114.0,0.8],[21.0,110.3,0.7],
  [28.2,121.0,0.55],[30.9,121.6,0.5],[31.2,121.5,0.5],
  [22.2,113.5,0.85],[23.5,116.7,0.6],
  [29.9,118.0,0.4],[32.0,118.8,0.35],
];

function inLandBbox(lat, lon) {
  // Cheap first-pass filter, then a finer coastline polygon check to exclude open water
  const inBox = lat >= CHINA_LAND_BBOX.minlat && lat <= CHINA_LAND_BBOX.maxlat &&
                lon >= CHINA_LAND_BBOX.minlon && lon <= CHINA_LAND_BBOX.maxlon;
  return inBox && isOnLand(lat, lon);
}

let map, layerGroups = {};
let activeLayers = new Set();

function initMap() {
  map = L.map('map', { zoomControl: true, attributionControl: true }).setView([31.57, 120.30], 11);
  // Light, professional cartographic base (CartoDB Positron)
  L.tileLayer('https://{s}.basemaps.cartocdn.com/light_nolabels/{z}/{x}/{y}{r}.png', {
    attribution: '&copy; OpenStreetMap &copy; CARTO',
    subdomains: 'abcd', maxZoom: 19,
  }).addTo(map);
  L.tileLayer('https://{s}.basemaps.cartocdn.com/light_only_labels/{z}/{x}/{y}{r}.png', {
    subdomains: 'abcd', maxZoom: 19,
  }).addTo(map);

  layerGroups.earthquake = L.layerGroup();
  layerGroups.lightning = L.layerGroup();
  layerGroups.typhoonHazard = L.layerGroup();
  layerGroups.waterHazard = L.layerGroup();
  layerGroups.aqueductFloods = L.layerGroup();
}

function renderLayerBar() {
  const bar = document.getElementById('layerBar');
  bar.innerHTML = LAYERS.map(l => {
    const active = activeLayers.has(l.key);
    return `<button class="layer-chip${active ? ' active' : ''}" style="${active ? `background:${l.color};border-color:${l.color};` : ''}" data-key="${l.key}">
      <span class="dot" style="background:${active ? '#fff' : l.color};"></span>${l.label}
    </button>`;
  }).join('');
  bar.querySelectorAll('.layer-chip').forEach(btn => {
    btn.addEventListener('click', () => {
      const key = btn.dataset.key;
      if (activeLayers.has(key)) {
        activeLayers.delete(key);
        map.removeLayer(layerGroups[key]);
      } else {
        activeLayers.add(key);
        map.addLayer(layerGroups[key]);
      }
      // 水害ハザードチップをOFFにしたら、地点検索の判定結果(バッジ・標高差・方角グリッド)も非表示にする
      if (key === 'waterHazard' && !activeLayers.has('waterHazard')) {
        const resultEl = document.getElementById('searchResult');
        resultEl.className = 'search-result';
        resultEl.innerHTML = '';
      }
      renderLayerBar();
      updateLegend();
    });
  });
}

let legendExpanded = new Set();
let dataRanges = { typhoonHazard: null };

function updateLegend() {
  const container = document.getElementById('legendNote');
  const active = LAYERS.filter(l => activeLayers.has(l.key));
  if (active.length === 0) {
    container.innerHTML = 'Select a layer above to see it on the map.';
    return;
  }
  container.innerHTML = active.map(l => {
    const firstSentenceEnd = l.note.indexOf('. ');
    const summary = firstSentenceEnd > -1 ? l.note.slice(0, firstSentenceEnd + 1) : l.note;
    const rest = firstSentenceEnd > -1 ? l.note.slice(firstSentenceEnd + 1).trim() : '';
    const expanded = legendExpanded.has(l.key);
    const range = dataRanges[l.key] ? ` <span style="color:var(--text-primary);font-weight:600;">[${dataRanges[l.key]}]</span>` : '';
    return `<div style="margin-bottom:6px;">
      <strong style="color:var(--text-primary);">${l.label}:</strong>${range} ${summary}
      ${rest ? `<span class="legend-full" style="${expanded ? '' : 'display:none;'}"> ${rest}</span>
      <span class="legend-toggle" data-key="${l.key}">${expanded ? 'Show less' : 'Show more'}</span>` : ''}
      ${l.key === 'waterHazard' || l.key === 'aqueductFloods' ? riskLegendHtml() : ''}
      ${l.key === 'earthquake' ? riskLegendHtml(EARTHQUAKE_TIER_COLORS, false) : ''}
      ${l.key === 'typhoonHazard' || l.key === 'lightning' ? riskLegendHtml(WARNING_TIER_COLORS, false) : ''}
    </div>`;
  }).join('');

  container.querySelectorAll('.legend-toggle').forEach(el => {
    el.addEventListener('click', () => {
      const key = el.dataset.key;
      if (legendExpanded.has(key)) legendExpanded.delete(key); else legendExpanded.add(key);
      updateLegend();
    });
  });
}

function renderMethodology() {
  const panel = document.getElementById('methodologyPanel');
  panel.innerHTML = METHODOLOGY.map(m => `
    <div class="method-item">
      <div class="method-label"><span class="dot" style="background:${m.color};"></span>${m.label}</div>
      <div class="method-desc">${m.desc}</div>
    </div>
  `).join('');
}

document.getElementById('methodologyBtn').addEventListener('click', () => {
  const panel = document.getElementById('methodologyPanel');
  const btn = document.getElementById('methodologyBtn');
  panel.classList.toggle('visible');
  btn.classList.toggle('active');
});

function escapeHtml(s) {
  return String(s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// 地震・台風・洪水の実データは、地点検索のタイル色付けにも再利用するためグローバルにキャッシュしておく
let earthquakeGeojsonCache = null;
let typhoonGeojsonCacheGlobal = null;
let floodGeojsonCacheGlobal = null;

async function loadEarthquakes() {
  document.getElementById('statusLabel').textContent = 'Fetching earthquakes…';

  // Prefer the pre-generated, backfilled dataset (scripts/fetch_earthquakes.py)
  const geojson = await fetchGeojsonSafe('data/earthquakes.geojson');

  if (geojson) {
    earthquakeGeojsonCache = geojson;
    let count = 0;
    let minTime = Infinity, maxTime = -Infinity;
    geojson.features.forEach(f => {
      const [lon, lat] = f.geometry.coordinates;
      const p = f.properties || {};
      const mag = p.mag || 0;
      const marker = L.circleMarker([lat, lon], {
        radius: Math.max(4, mag * 2.2),
        color: COLORS.earthquake, weight: 1.5, fillColor: COLORS.earthquake, fillOpacity: 0.3,
      });
      const date = p.time ? new Date(p.time).toLocaleDateString('en-US') : '';
      marker.bindPopup(`<div class="popup-title">M${mag.toFixed(1)} Earthquake</div>
        <div class="popup-row">${escapeHtml(p.place)}</div>
        <div class="popup-row">${date}</div>`);
      marker.addTo(layerGroups.earthquake);
      count++;
      if (p.time) { minTime = Math.min(minTime, p.time); maxTime = Math.max(maxTime, p.time); }
    });
    const minYear = isFinite(minTime) ? new Date(minTime).getFullYear() : '—';
    const maxYear = isFinite(maxTime) ? new Date(maxTime).getFullYear() : '—';
    document.getElementById('statusLabel').textContent = `Data range: ${minYear}–${maxYear}`;
    document.getElementById('countLabel').textContent = `${count} earthquakes (M5.0+)`;
    return;
  }

  // Fallback: live last-30-days query, used only until the backfilled file exists
  try {
    const url = 'https://earthquake.usgs.gov/fdsnws/event/1/query?format=geojson&starttime=' +
      new Date(Date.now() - 30 * 86400000).toISOString().slice(0,10) +
      '&minlatitude=18&maxlatitude=54&minlongitude=73&maxlongitude=135&minmagnitude=3.5';
    const res = await fetch(url);
    const data = await res.json();
    let count = 0;
    (data.features || []).forEach(f => {
      const [lon, lat] = f.geometry.coordinates;
      const mag = f.properties.mag || 0;
      const marker = L.circleMarker([lat, lon], {
        radius: Math.max(4, mag * 2.2),
        color: COLORS.earthquake, weight: 1.5, fillColor: COLORS.earthquake, fillOpacity: 0.3,
      });
      const date = new Date(f.properties.time).toLocaleString('en-US');
      marker.bindPopup(`<div class="popup-title">M${mag.toFixed(1)} Earthquake</div>
        <div class="popup-row">${escapeHtml(f.properties.place)}</div>
        <div class="popup-row">${date}</div>`);
      marker.addTo(layerGroups.earthquake);
      count++;
    });
    document.getElementById('statusLabel').textContent = 'Live feed (last 30 days) — backfill not yet generated';
    document.getElementById('countLabel').textContent = `${count} earthquakes (30d, M3.5+)`;
  } catch (e) {
    document.getElementById('statusLabel').textContent = 'Failed to load earthquake data';
  }
}

function loadLightning() {
  const heatPoints = LIGHTNING_SAMPLE.map(p => [p[0], p[1], p[2]]);
  const heat = L.heatLayer(heatPoints, { radius: 40, blur: 30, maxZoom: 8, gradient: HAZARD_GRADIENT });

async function fetchGeojsonSafe(path) {
  try {
    const res = await fetch(path);
    if (!res.ok) return null;
    const geojson = await res.json();
    if (!geojson.features || geojson.features.length === 0) return null;
    return geojson;
  } catch (e) {
    return null;
  }
}

async function buildTyphoonHazard() {
  const geojson = await fetchGeojsonSafe('data/typhoons.geojson');
  typhoonGeojsonCacheGlobal = geojson;
  const points = [];

  if (geojson) {
    const winds = geojson.features.map(f => f.properties?.max_wind_kt).filter(w => typeof w === 'number');
    const maxWind = winds.length ? Math.max(...winds) : 100;
    let minTime = Infinity, maxTime = -Infinity;
    geojson.features.forEach(f => {
      const w = f.properties?.max_wind_kt;
      const weight = typeof w === 'number' ? Math.min(1, w / maxWind) : 0.4;
      f.geometry.coordinates.forEach(([lon, lat]) => {
        if (inLandBbox(lat, lon)) points.push([lat, lon, weight]);
      });
      const st = f.properties?.start_time, et = f.properties?.end_time;
      if (st) minTime = Math.min(minTime, new Date(st).getTime());
      if (et) maxTime = Math.max(maxTime, new Date(et).getTime());
    });
    if (isFinite(minTime) && isFinite(maxTime)) {
      dataRanges.typhoonHazard = `${new Date(minTime).getFullYear()}–${new Date(maxTime).getFullYear()}`;
      updateLegend();
    }
  } else {
    TYPHOON_SAMPLE.forEach(t => {
      t.points.forEach(([lat, lon]) => {
        if (inLandBbox(lat, lon)) points.push([lat, lon, 0.5]);
      });
    });
  }

  L.heatLayer(points, { radius: 32, blur: 26, maxZoom: 8, max: 1.0, gradient: HAZARD_GRADIENT }).addTo(layerGroups.typhoonHazard);
}

// 水害ハザード: 降雨強度(CHIRPS)と標高(Open-Elevation)の高い方を基礎リスクとし、
// 過去の洪水実績(DFO)で最大1.5倍まで底上げする。データ欠損セルは灰色で明示する。
let rainfallGeojsonCacheGlobal = null;
let elevationGeojsonCacheGlobal = null;

function floodWeightAt(lat, lon) {
  if (!floodGeojsonCacheGlobal) return 1.0;
  const areaVals = floodGeojsonCacheGlobal.features
    .map(f => f.properties?.affected_sq_km).filter(v => typeof v === 'number');
  if (areaVals.length === 0) return 1.0;
  const maxArea = Math.max(...areaVals);

  let nearestArea = null, nearestDist = Infinity;
  floodGeojsonCacheGlobal.features.forEach(f => {
    const area = f.properties?.affected_sq_km;
    if (typeof area !== 'number') return;
    const [flon, flat] = f.geometry.coordinates;
    if (!degBboxFilter(lat, lon, flat, flon, 80)) return;
    const d = haversineKm(lat, lon, flat, flon);
    if (d <= 80 && d < nearestDist) { nearestDist = d; nearestArea = area; }
  });
  if (nearestArea === null) return 1.0;
  const relative = Math.min(1, nearestArea / maxArea);
  return 1 + 0.5 * relative; // 1.0〜1.5、1を下回らない
}

// ==== 水域近接倍率(河川・湖・海への近さで標高リスクを底上げする) ====
let riversGeojsonCacheGlobal = null;

// Overpass API(OpenStreetMap)で、指定地点周辺の湖・貯水池をその場に問い合わせる。
// HydroLAKES(全世界820MBの事前ダウンロードが必要)を避けるための代替手段。
// 地点検索1回につき1回だけ呼び出し、169マス全体で結果を使い回す(通信回数を抑えるため)。
const OVERPASS_URL = 'https://overpass-api.de/api/interpreter';

async function fetchNearbyLakePoints(lat, lon, radiusM) {
  const query = `[out:json][timeout:25];(way["natural"="water"]["water"~"lake|reservoir|oxbow"](around:${radiusM},${lat},${lon});relation["natural"="water"]["water"~"lake|reservoir|oxbow"](around:${radiusM},${lat},${lon}););out geom;`;
  try {
    const res = await fetch(OVERPASS_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain' },
      body: query,
    });
    if (!res.ok) return [];
    const data = await res.json();
    const points = [];
    (data.elements || []).forEach(el => {
      if (el.geometry) {
        el.geometry.forEach(g => points.push([g.lat, g.lon]));
      } else if (el.members) {
        el.members.forEach(m => {
          if (m.geometry) m.geometry.forEach(g => points.push([g.lat, g.lon]));
        });
      }
    });
    return points;
  } catch (e) {
    // Overpass APIが混雑・失敗している場合は、湖の要素なしとして扱う(検索自体は継続する)
    return [];
  }
}

// 距離(km) → 最寄りの頂点との最短距離(度)を概算距離(km)に変換する簡易ヘルパー
function pointToLineDistanceKm(lat, lon, coords) {
  // 簡易実装: 線を構成する各頂点との距離のうち最小値を採用する(頂点間の補間はしない近似)
  let minDist = Infinity;
  coords.forEach(([clon, clat]) => {
    const d = haversineKm(lat, lon, clat, clon);
    if (d < minDist) minDist = d;
  });
  return minDist;
}

// 距離(m)を5段階の倍率(1.0〜1.5)に変換する
function distanceToProximityMultiplier(distanceM) {
  if (distanceM <= 500) return 1.5;
  if (distanceM <= 1000) return 1.35;
  if (distanceM <= 1500) return 1.2;
  if (distanceM <= 2000) return 1.1;
  return 1.0;
}

// 河川・湖(Overpassでその場取得したポイント)・海のうち最も近いものまでの距離を求め、倍率に変換する
function waterProximityMultiplier(lat, lon, lakePoints) {
  let minDistKm = Infinity;

  if (riversGeojsonCacheGlobal) {
    riversGeojsonCacheGlobal.features.forEach(f => {
      const coords = f.geometry?.coordinates;
      if (!coords) return;
      // ざっくりした事前フィルタ(重い距離計算を減らす)
      const [flon, flat] = coords[Math.floor(coords.length / 2)] || coords[0];
      if (!degBboxFilter(lat, lon, flat, flon, 10)) return;
      const d = pointToLineDistanceKm(lat, lon, coords);
      if (d < minDistKm) minDistKm = d;
    });
  }

  if (lakePoints && lakePoints.length > 0) {
    lakePoints.forEach(([plat, plon]) => {
      const d = haversineKm(lat, lon, plat, plon);
      if (d < minDistKm) minDistKm = d;
    });
  }

  // 海(既存の海岸線ポリゴンの頂点との距離で近似)
  CHINA_COASTLINE_POLYGON.forEach(([clon, clat]) => {
    const d = haversineKm(lat, lon, clat, clon);
    if (d < minDistKm) minDistKm = d;
  });

  if (!isFinite(minDistKm)) return 1.0;
  return distanceToProximityMultiplier(minDistKm * 1000);
}

async function buildWaterHazard() {
  const [rainfallGeojson, elevationGeojson, riversGeojson] = await Promise.all([
    fetchGeojsonSafe('data/rainfall_risk.geojson'),
    fetchGeojsonSafe('data/elevation_risk.geojson'),
    fetchGeojsonSafe('data/rivers.geojson'),
  ]);
  rainfallGeojsonCacheGlobal = rainfallGeojson;
  elevationGeojsonCacheGlobal = elevationGeojson;
  riversGeojsonCacheGlobal = riversGeojson;

  if (!floodGeojsonCacheGlobal) {
    floodGeojsonCacheGlobal = await fetchGeojsonSafe('data/floods.geojson');
  }

  const riskPoints = [];
  const grayPoints = [];

  if (rainfallGeojson) {
    rainfallGeojson.features.forEach(f => {
      const [lon, lat] = f.geometry.coordinates;
      const p = f.properties || {};
      if (p.no_data) {
        grayPoints.push([lat, lon]);
        return;
      }
      const rainfallRisk = typeof p.risk === 'number' ? p.risk : 0;
      // 同じ格子点付近の標高リスクも参照し、高い方を基礎リスクとする
      let elevRisk = 0;
      if (elevationGeojson) {
        let nearestRisk = null, nearestDist = Infinity;
        elevationGeojson.features.forEach(ef => {
          const [elon, elat] = ef.geometry.coordinates;
          if (!degBboxFilter(lat, lon, elat, elon, 150)) return;
          const d = haversineKm(lat, lon, elat, elon);
          if (d < nearestDist) { nearestDist = d; nearestRisk = ef.properties?.risk; }
        });
        if (typeof nearestRisk === 'number') elevRisk = nearestRisk;
      }
      // 全国俯瞰では、湖はOverpassの都度問い合わせが使えないため、河川・海のみで近接倍率を計算する
      const proximity = waterProximityMultiplier(lat, lon, []);
      const baseRisk = Math.max(rainfallRisk, elevRisk * proximity);
      const weight = floodWeightAt(lat, lon);
      const finalRisk = Math.min(1.0, baseRisk * weight);
      if (finalRisk > 0) riskPoints.push([lat, lon, finalRisk]);
    });
  }

  if (riskPoints.length > 0) {
    L.heatLayer(riskPoints, { radius: 40, blur: 32, maxZoom: 8, max: 1.0, gradient: HAZARD_GRADIENT }).addTo(layerGroups.waterHazard);
  }
  // データ欠損セルを灰色の小さな四角で明示(誤って「リスクなし」と読まれないよう独立表示)
  grayPoints.forEach(([lat, lon]) => {
    L.rectangle(
      [[lat - 0.4, lon - 0.4], [lat + 0.4, lon + 0.4]],
      { color: NO_DATA_COLOR, weight: 0, fillColor: NO_DATA_COLOR, fillOpacity: 0.35 }
    ).addTo(layerGroups.waterHazard);
  });
}

// Aqueduct Floods(WRI): 水害ハザードとは統合せず、独立したレイヤーとして表示する
async function buildAqueductFloods() {
  const geojson = await fetchGeojsonSafe('data/aqueduct_floods.geojson');
  if (!geojson) return;

  const riskPoints = [];
  const grayPoints = [];
  geojson.features.forEach(f => {
    const [lon, lat] = f.geometry.coordinates;
    const p = f.properties || {};
    if (p.no_data || typeof p.risk !== 'number') {
      grayPoints.push([lat, lon]);
      return;
    }
    if (p.risk > 0) riskPoints.push([lat, lon, p.risk]);
  });

  if (riskPoints.length > 0) {
    L.heatLayer(riskPoints, { radius: 40, blur: 32, maxZoom: 8, max: 1.0, gradient: HAZARD_GRADIENT }).addTo(layerGroups.aqueductFloods);
  }
  grayPoints.forEach(([lat, lon]) => {
    L.rectangle(
      [[lat - 0.4, lon - 0.4], [lat + 0.4, lon + 0.4]],
      { color: NO_DATA_COLOR, weight: 0, fillColor: NO_DATA_COLOR, fillOpacity: 0.35 }
    ).addTo(layerGroups.aqueductFloods);
  });
}

// ==== 地点検索: 各ハザードの5段階配色ロジック(標高以外はローカルデータのみで計算、追加通信なし) ====

// 気象庁の震度階級配色を参考にした地震用5段階(黄→橙→赤→濃い赤→赤紫)
const EARTHQUAKE_TIER_COLORS = ['#D9A22C', '#D9722C', '#C13A2E', '#8C1F1F', '#7A2E6B'];
// 気象庁の統一「警戒レベル」配色を参考にした台風・雷・洪水共通5段階(黄→橙→赤→紫→黒)
const WARNING_TIER_COLORS = ['#D9A22C', '#D9722C', '#C13A2E', '#7A3B8C', '#1A2130'];

// 5段階配色のグラデーション凡例(温度計ふう)+データ欠損(灰色)の説明をHTMLで生成する共通関数
function riskLegendHtml(colors, showNoData) {
  const useColors = colors || WARNING_TIER_COLORS;
  const bar = useColors.map(c => `<span style="background:${c};"></span>`).join('');
  const noData = showNoData === false ? '' :
    `<div class="risk-legend-nodata"><span class="swatch" style="background:${NO_DATA_COLOR};"></span>No data (outside coverage) — not the same as low risk</div>`;
  return `
    <div class="risk-legend">
      <div class="risk-legend-bar">${bar}</div>
    </div>
    <div class="risk-legend-labels"><span>Low</span><span>Moderate</span><span>High</span><span>Severe</span><span>Extreme</span></div>
    ${noData}
  `;
}

function haversineKm(lat1, lon1, lat2, lon2) {
  const R = 6371;
  const dLat = (lat2 - lat1) * Math.PI / 180;
  const dLon = (lon2 - lon1) * Math.PI / 180;
  const a = Math.sin(dLat / 2) ** 2 + Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLon / 2) ** 2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
}

// 度単位のざっくりした絞り込み(重い三角関数を使うhaversineの前段フィルタとして使う)。
// 緯度1度は約111km固定。経度は高緯度ほど短くなるが、ここでは安全側に倍のマージンを取って簡略化する。
function degBboxFilter(lat, lon, flat, flon, radiusKm) {
  const degMargin = (radiusKm / 111) * 1.5;
  return Math.abs(lat - flat) <= degMargin && Math.abs(lon - flon) <= degMargin;
}

// 地震: 周辺100km以内で観測された最大マグニチュードを震度階級ふうの5段階に変換
function earthquakeTileColor(lat, lon) {
  if (!earthquakeGeojsonCache) return null;
  let maxMag = null;
  earthquakeGeojsonCache.features.forEach(f => {
    const [flon, flat] = f.geometry.coordinates;
    if (!degBboxFilter(lat, lon, flat, flon, 100)) return; // 先に安価な絞り込み
    if (haversineKm(lat, lon, flat, flon) <= 100) {
      const mag = f.properties?.mag;
      if (typeof mag === 'number' && (maxMag === null || mag > maxMag)) maxMag = mag;
    }
  });
  if (maxMag === null) return null;
  let tier;
  if (maxMag < 5.5) tier = 0;
  else if (maxMag < 6.0) tier = 1;
  else if (maxMag < 6.5) tier = 2;
  else if (maxMag < 7.0) tier = 3;
  else tier = 4;
  return EARTHQUAKE_TIER_COLORS[tier];
}

// 台風: 周辺50km以内を通過した経路の中で最大の風速を5段階に変換
function typhoonTileColor(lat, lon) {
  if (!typhoonGeojsonCacheGlobal) return null;
  let maxWind = null;
  typhoonGeojsonCacheGlobal.features.forEach(f => {
    const w = f.properties?.max_wind_kt;
    if (typeof w !== 'number') return;
    const near = f.geometry.coordinates.some(([flon, flat]) => degBboxFilter(lat, lon, flat, flon, 50) && haversineKm(lat, lon, flat, flon) <= 50);
    if (near && (maxWind === null || w > maxWind)) maxWind = w;
  });
  if (maxWind === null) return null;
  const ratio = Math.min(1, maxWind / 130);
  return WARNING_TIER_COLORS[Math.min(4, Math.floor(ratio * 5))];
}

// 雷: 既知の落雷多発地点までの距離から密度を推定し5段階に変換
function lightningTileColor(lat, lon) {
  let nearest = null, nearestDist = Infinity;
  LIGHTNING_SAMPLE.forEach(([slat, slon, density]) => {
    const d = haversineKm(lat, lon, slat, slon);
    if (d < nearestDist) { nearestDist = d; nearest = density; }
  });
  if (nearest === null || nearestDist > 80) return null;
  const falloff = Math.max(0, 1 - nearestDist / 80);
  const ratio = nearest * falloff;
  if (ratio <= 0.05) return null;
  return WARNING_TIER_COLORS[Math.min(4, Math.floor(ratio * 5))];
}

// 洪水: 周辺80km以内で最も近い洪水記録の冠水面積を5段階に変換
function floodTileColor(lat, lon) {
  if (!floodGeojsonCacheGlobal) return null;
  let nearestArea = null, nearestDist = Infinity;
  floodGeojsonCacheGlobal.features.forEach(f => {
    const area = f.properties?.affected_sq_km;
    if (typeof area !== 'number') return;
    const [flon, flat] = f.geometry.coordinates;
    if (!degBboxFilter(lat, lon, flat, flon, 80)) return;
    const d = haversineKm(lat, lon, flat, flon);
    if (d <= 80 && d < nearestDist) { nearestDist = d; nearestArea = area; }
  });
  if (nearestArea === null) return null;
  const ratio = Math.min(1, nearestArea / 5000);
  return WARNING_TIER_COLORS[Math.min(4, Math.floor(ratio * 5))];
}


// so failed lookups are retried automatically before surfacing an error.
// ==== Point lookup: elevation + comparison with 8 surrounding points ====
// Open-Elevation supports CORS for direct browser calls (unlike the free tier of
// Open-Topo-Data, which requires a paid plan for CORS). It's occasionally flaky,
// so failed lookups are retried automatically before surfacing an error.
const OPEN_ELEVATION_URL = 'https://api.open-elevation.com/api/v1/lookup';
const ELEVATION_MAX_RETRIES = 2;
const DIRS = [
  { name: 'N', dLat: 1, dLon: 0 }, { name: 'NE', dLat: 1, dLon: 1 },
  { name: 'E', dLat: 0, dLon: 1 }, { name: 'SE', dLat: -1, dLon: 1 },
  { name: 'S', dLat: -1, dLon: 0 }, { name: 'SW', dLat: -1, dLon: -1 },
  { name: 'W', dLat: 0, dLon: -1 }, { name: 'NW', dLat: 1, dLon: -1 },
];
const SEARCH_RADIUS_M = 100;

// 500m圏内を細かい格子(グリッド)状にサンプリングして面で塗るための設定
const GRID_RADIUS_M = 1500;
const GRID_CELL_M = 250; // 1マスのサイズは今までと同じ(精細さを保つ)
const GRID_STEPS = GRID_RADIUS_M / GRID_CELL_M; // 半径1500m ÷ 250m = 6マスずつ = 13x13グリッド

let searchMarkerLayer;
let searchGridLayers = {}; // ハザードキーごとのタイルレイヤー(それぞれ対応するチップと連動)

function elevationToRiskInfo(elevation) {
  if (elevation < 3) return { label: 'High risk (< 3m)', color: '#C13A2E' };
  if (elevation < 5) return { label: 'Watch zone (3–5m)', color: '#D9722C' };
  if (elevation < 10) return { label: 'Transition zone (5–10m)', color: '#D9A22C' };
  return { label: 'Relatively low risk (10m+)', color: '#4E7BA8' };
}

// elevationToRiskInfoのラベルを0〜1の数値リスクに変換(水害ハザードの合成に使う)
function elevRiskValueFromLabel(info) {
  switch (info.label) {
    case 'High risk (< 3m)': return 1.0;
    case 'Watch zone (3–5m)': return 0.75;
    case 'Transition zone (5–10m)': return 0.4;
    default: return 0.1;
  }
}

// 事前生成された降雨強度グリッド(data/rainfall_risk.geojson)から、最寄りの値を参照する。
// データが存在しない(CHIRPS対象外・未生成)場合は null を返す。
function rainfallRiskAt(lat, lon) {
  if (!rainfallGeojsonCacheGlobal) return null;
  let nearestRisk = null, nearestDist = Infinity, foundNoData = false;
  rainfallGeojsonCacheGlobal.features.forEach(f => {
    const [flon, flat] = f.geometry.coordinates;
    if (!degBboxFilter(lat, lon, flat, flon, 150)) return;
    const d = haversineKm(lat, lon, flat, flon);
    if (d < nearestDist) {
      nearestDist = d;
      const p = f.properties || {};
      if (p.no_data) { foundNoData = true; nearestRisk = null; }
      else { foundNoData = false; nearestRisk = p.risk; }
    }
  });
  if (foundNoData || nearestRisk === null) return null;
  return nearestRisk;
}

function metersToDegLat(m) { return m / 111000; }
function metersToDegLon(m, lat) { return m / (111000 * Math.cos(lat * Math.PI / 180)); }

async function fetchElevations(locations) {
  for (let attempt = 1; attempt <= ELEVATION_MAX_RETRIES; attempt++) {
    try {
      const res = await fetch(OPEN_ELEVATION_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ locations }),
      });
      if (!res.ok) throw new Error('elevation api error');
      const data = await res.json();
      const results = data.results || [];
      if (results.length < locations.length) throw new Error('insufficient results');
      return results.map(r => r.elevation);
    } catch (e) {
      if (attempt === ELEVATION_MAX_RETRIES) throw e;
    }
  }
}

async function queryPoint(lat, lon) {
  const resultEl = document.getElementById('searchResult');
  if (activeLayers.has('waterHazard')) {
    resultEl.className = 'search-result visible';
    resultEl.innerHTML = '<div class="result-elev">Fetching…</div>';
  }

  const dLat = metersToDegLat(SEARCH_RADIUS_M);
  const dLon = metersToDegLon(SEARCH_RADIUS_M, lat);
  const locations = [{ latitude: lat, longitude: lon }];
  DIRS.forEach(d => locations.push({ latitude: lat + d.dLat * dLat, longitude: lon + d.dLon * dLon }));

  // 500m圏内の9x9グリッド(各マス約125m四方)の中心座標を用意
  const cellDLat = metersToDegLat(GRID_CELL_M);
  const gridCells = [];
  for (let i = -GRID_STEPS; i <= GRID_STEPS; i++) {
    for (let j = -GRID_STEPS; j <= GRID_STEPS; j++) {
      const cellLat = lat + i * cellDLat;
      const cellDLon = metersToDegLon(GRID_CELL_M, cellLat);
      gridCells.push({ lat: cellLat, lon: lon + j * cellDLon });
    }
  }
  const gridLocations = gridCells.map(c => ({ latitude: c.lat, longitude: c.lon }));

  try {
    const [elevations, gridElevations] = await Promise.all([
      fetchElevations(locations),
      fetchElevations(gridLocations),
    ]);

    const centerElev = elevations[0];
    const surrounding = elevations.slice(1).map((elev, i) => ({ name: DIRS[i].name, elev }));
    const avgSurrounding = surrounding.reduce((s, d) => s + d.elev, 0) / surrounding.length;
    const diff = avgSurrounding - centerElev;

    let compareLabel;
    if (diff >= 1) compareLabel = 'Sits noticeably lower than its surroundings';
    else if (diff >= 0.5) compareLabel = 'Slightly lower than its surroundings';
    else if (diff > -0.5) compareLabel = 'About level with its surroundings';
    else compareLabel = 'Higher than its surroundings — relatively favorable';

    // バッジは「水害ハザード」の統合値(降雨×標高の高い方 × 洪水実績の重み)で判定する。
    // 方角グリッド・標高差テキストは、引き続き標高そのものを参考情報として表示する。
    // 湖の近接判定は、Overpass API(OpenStreetMap)にこの検索1回につき1回だけ問い合わせる
    // (169マス個別には問い合わせず、結果を使い回すことで通信回数を抑える)。
    const lakePoints = activeLayers.has('waterHazard')
      ? await fetchNearbyLakePoints(lat, lon, GRID_RADIUS_M + 2000)
      : [];

    const elevRiskInfo = elevationToRiskInfo(centerElev);
    const rainfallRiskHere = rainfallRiskAt(lat, lon);
    const noRainDataHere = rainfallRiskHere === null;
    let waterBadge;
    if (noRainDataHere) {
      waterBadge = { label: 'No rainfall data (outside CHIRPS coverage)', color: NO_DATA_COLOR };
    } else {
      const proximity = waterProximityMultiplier(lat, lon, lakePoints);
      const baseRisk = Math.max(rainfallRiskHere, elevRiskValueFromLabel(elevRiskInfo) * proximity);
      const weight = floodWeightAt(lat, lon);
      const finalRisk = Math.min(1.0, baseRisk * weight);
      const tier = Math.min(4, Math.max(0, Math.ceil(finalRisk * 5) - 1));
      const tierLabels = ['Low', 'Moderate', 'High', 'Severe', 'Extreme'];
      waterBadge = { label: `${tierLabels[tier]} water hazard (${finalRisk.toFixed(2)})`, color: WARNING_TIER_COLORS[tier] };
    }

    // 冠水ハザードチップがOFFの場合は判定結果(バッジ・標高差・方角グリッド)を表示しない
    if (activeLayers.has('waterHazard')) {
      resultEl.className = 'search-result visible';
      resultEl.innerHTML = `
        <span class="result-badge" style="background:${waterBadge.color};">${waterBadge.label}</span>
        ${riskLegendHtml()}
        <div class="result-elev" style="margin-top:9px;">Elevation: ${centerElev.toFixed(1)}m — ${compareLabel} (avg. surrounding diff: ${diff >= 0 ? '+' : ''}${diff.toFixed(1)}m)</div>
        <div class="result-dirs">
          ${surrounding.map(d => {
            const dRisk = elevationToRiskInfo(d.elev);
            return `<div style="background:${dRisk.color};color:#fff;">${d.name}<br>${(d.elev - centerElev >= 0 ? '+' : '')}${(d.elev - centerElev).toFixed(1)}m</div>`;
          }).join('')}
        </div>
      `;
    } else {
      resultEl.className = 'search-result';
      resultEl.innerHTML = '';
    }

    if (searchMarkerLayer) map.removeLayer(searchMarkerLayer);

    // 500m〜1km圏内を、各ハザードのリスクに応じた色のタイルで塗る(地震・台風・雷はローカルデータのみ、追加通信なし)
    const hazardTileFns = {
      earthquake: earthquakeTileColor,
      typhoonHazard: typhoonTileColor,
      lightning: lightningTileColor,
    };

    Object.entries(searchGridLayers).forEach(([key, layer]) => {
      if (layer) layerGroups[key].removeLayer(layer);
    });
    searchGridLayers = {};

    Object.entries(hazardTileFns).forEach(([key, fn]) => {
      if (!activeLayers.has(key)) return; // チップがOFFなら、そもそもタイルを生成しない(表示崩れの防止)
      const layer = L.layerGroup();
      let any = false;
      gridCells.forEach((cell, idx) => {
        const color = fn(cell.lat, cell.lon);
        if (!color) return;
        any = true;
        const halfLat = cellDLat / 2;
        const halfLon = metersToDegLon(GRID_CELL_M, cell.lat) / 2;
        L.rectangle(
          [[cell.lat - halfLat, cell.lon - halfLon], [cell.lat + halfLat, cell.lon + halfLon]],
          { color, weight: 0, fillColor: color, fillOpacity: 0.45 }
        ).addTo(layer);
      });
      if (any) {
        layer.addTo(layerGroups[key]);
        searchGridLayers[key] = layer;
      }
    });

    // 水害ハザードのタイル: 標高は実測API値(このマス)、降雨強度は最寄りの事前生成データ、
    // 洪水実績は重みとしてのみ使用。海上のマスは除外。チップがOFFなら生成自体をスキップする。
    if (activeLayers.has('waterHazard')) {
    const waterGridLayer = L.layerGroup();
    gridCells.forEach((cell, idx) => {
      if (!isOnLand(cell.lat, cell.lon)) return;
      const cellElev = gridElevations[idx];
      const elevRiskInfo = elevationToRiskInfo(cellElev);
      const elevRiskValue = elevRiskValueFromLabel(elevRiskInfo);
      const rainfallRiskValue = rainfallRiskAt(cell.lat, cell.lon);
      const noRainData = rainfallRiskValue === null;

      const halfLat = cellDLat / 2;
      const halfLon = metersToDegLon(GRID_CELL_M, cell.lat) / 2;

      if (noRainData) {
        L.rectangle(
          [[cell.lat - halfLat, cell.lon - halfLon], [cell.lat + halfLat, cell.lon + halfLon]],
          { color: NO_DATA_COLOR, weight: 0, fillColor: NO_DATA_COLOR, fillOpacity: 0.35 }
        ).addTo(waterGridLayer);
        return;
      }

      const baseRisk = Math.max(rainfallRiskValue, elevRiskValue * waterProximityMultiplier(cell.lat, cell.lon, lakePoints));
      const weight = floodWeightAt(cell.lat, cell.lon);
      const finalRisk = Math.min(1.0, baseRisk * weight);
      const tileColor = WARNING_TIER_COLORS[Math.min(4, Math.max(0, Math.floor(finalRisk * 5) - (finalRisk === 0 ? 1 : 0)))] ;
      if (finalRisk <= 0) return;
      L.rectangle(
        [[cell.lat - halfLat, cell.lon - halfLon], [cell.lat + halfLat, cell.lon + halfLon]],
        { color: tileColor, weight: 0, fillColor: tileColor, fillOpacity: 0.45 }
      ).addTo(waterGridLayer);
    });
    waterGridLayer.addTo(layerGroups.waterHazard);
    searchGridLayers.waterHazard = waterGridLayer;
    }

    // 指定地点そのものは📍ピンで表示(どのチップの状態にも関わらず常に表示)
    searchMarkerLayer = L.marker([lat, lon], {
      icon: L.divIcon({
        html: '<div style="font-size:26px;line-height:1;transform:translateY(-4px);">📍</div>',
        className: '',
        iconSize: [26, 26],
        iconAnchor: [13, 26],
      }),
    }).addTo(map);

    map.setView([lat, lon], Math.max(map.getZoom(), 13));
  } catch (e) {
    resultEl.innerHTML = '<div class="result-elev">Could not fetch elevation data. Please try again shortly.</div>';
  }
}

// ==== GCJ-02(百度地図・高徳地図などが使う中国独自座標系)→ WGS84 変換 ====
// 公開されているeviltransform等のアルゴリズムに準拠した標準的な変換式。
// 中国国外の座標は変換対象外(規制自体が中国国内向けのため)。
function outOfChina(lat, lon) {
  return lon < 72.004 || lon > 137.8347 || lat < 0.8293 || lat > 55.8271;
}

function gcj02Delta(lat, lon) {
  const a = 6378245.0;
  const ee = 0.00669342162296594323;
  let dLat = -100.0 + 2.0 * lon + 3.0 * lat + 0.2 * lat * lat + 0.1 * lon * lat + 0.2 * Math.sqrt(Math.abs(lon));
  dLat += (20.0 * Math.sin(6.0 * lon * Math.PI) + 20.0 * Math.sin(2.0 * lon * Math.PI)) * 2.0 / 3.0;
  dLat += (20.0 * Math.sin(lat * Math.PI) + 40.0 * Math.sin(lat / 3.0 * Math.PI)) * 2.0 / 3.0;
  dLat += (160.0 * Math.sin(lat / 12.0 * Math.PI) + 320 * Math.sin(lat * Math.PI / 30.0)) * 2.0 / 3.0;

  let dLon = 300.0 + lon + 2.0 * lat + 0.1 * lon * lon + 0.1 * lon * lat + 0.1 * Math.sqrt(Math.abs(lon));
  dLon += (20.0 * Math.sin(6.0 * lon * Math.PI) + 20.0 * Math.sin(2.0 * lon * Math.PI)) * 2.0 / 3.0;
  dLon += (20.0 * Math.sin(lon * Math.PI) + 40.0 * Math.sin(lon / 3.0 * Math.PI)) * 2.0 / 3.0;
  dLon += (150.0 * Math.sin(lon / 12.0 * Math.PI) + 300.0 * Math.sin(lon / 30.0 * Math.PI)) * 2.0 / 3.0;

  const radLat = lat / 180.0 * Math.PI;
  let magic = Math.sin(radLat);
  magic = 1 - ee * magic * magic;
  const sqrtMagic = Math.sqrt(magic);
  dLat = (dLat * 180.0) / ((a * (1 - ee)) / (magic * sqrtMagic) * Math.PI);
  dLon = (dLon * 180.0) / (a / sqrtMagic * Math.cos(radLat) * Math.PI);
  return { dLat, dLon };
}

function gcj02ToWgs84(lat, lon) {
  if (outOfChina(lat, lon)) return { lat, lon };
  const { dLat, dLon } = gcj02Delta(lat, lon);
  return { lat: lat - dLat, lon: lon - dLon };
}

// BD-09(百度地図)→ GCJ-02 変換(百度独自の追加オフセットを取り除く)
function bd09ToGcj02(lat, lon) {
  const xPi = Math.PI * 3000.0 / 180.0;
  const x = lon - 0.0065;
  const y = lat - 0.006;
  const z = Math.sqrt(x * x + y * y) - 0.00002 * Math.sin(y * xPi);
  const theta = Math.atan2(y, x) - 0.000003 * Math.cos(x * xPi);
  return { lat: z * Math.sin(theta), lon: z * Math.cos(theta) };
}

function bd09ToWgs84(lat, lon) {
  const gcj = bd09ToGcj02(lat, lon);
  return gcj02ToWgs84(gcj.lat, gcj.lon);
}

document.getElementById('searchBtn').addEventListener('click', () => {
  let lat = parseFloat(document.getElementById('searchLat').value);
  let lon = parseFloat(document.getElementById('searchLon').value);
  if (isNaN(lat) || isNaN(lon)) return;
  // 緯度は-90〜90の範囲しかありえない。範囲外なら経度と入れ替わっている可能性が高いので自動補正する
  // (百度地図など「経度,緯度」の順でコピーされるサイトからの貼り付けを想定)
  if ((lat < -90 || lat > 90) && lon >= -90 && lon <= 90) {
    [lat, lon] = [lon, lat];
  }
  const system = document.querySelector('input[name="coordSystem"]:checked').value;
  if (system === 'gcj02') {
    const converted = gcj02ToWgs84(lat, lon);
    lat = converted.lat; lon = converted.lon;
  } else if (system === 'bd09') {
    const converted = bd09ToWgs84(lat, lon);
    lat = converted.lat; lon = converted.lon;
  }
  queryPoint(lat, lon);
});

initMap();
renderLayerBar();
renderMethodology();
updateLegend();
loadEarthquakes();
loadLightning();
buildTyphoonHazard();
buildWaterHazard();
buildAqueductFloods();

map.on('click', (e) => {
  document.getElementById('searchLat').value = e.latlng.lat.toFixed(4);
  document.getElementById('searchLon').value = e.latlng.lng.toFixed(4);
  queryPoint(e.latlng.lat, e.latlng.lng);
});
</script>
